   用户前史："之前的AI把人物做得跟鬼一样" —— 病根是低模硬追写实五官/人体结构，
   正好落进恐怖谷。这次反其道走「以形写神」的剪影路线：
   · 宽袍大袖的 lathe 轮廓（江南直裰 A 形剪影，衣纹交给光影，不做面）
   · 无脸：圆头+发髻，五官一个面都不建
   · 姿态"负手观荷"：双袖拢到身后、俯首
   · 墨蓝近黑单色（水墨剪影），呼吸微动 0.6% —— 剪影的"活"就靠这一口气 */
const figures = [];
function makeScholar({ x = 0, z = 0, yaw = 0, s = 1, pose = 'observe' } = {}){
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  g.rotation.z = 0.03;                        // 重心微偏：负手的站姿不该是旗杆
  g.scale.setScalar(s);
  const ink = new THREE.MeshStandardMaterial({ color:0x1A2233, roughness:0.92, metalness:0.0, envMapIntensity:0.25 });
  /* "留白"浅色（第三轮：0x44536E 在深底上读不出，提到 0xB9C2CE）：
     簪、领边、后中缝、袖口环 —— 无脸剪影的信息量全靠这几笔（水墨的"断"） */
  const inkLight = new THREE.MeshStandardMaterial({ color:0xB9C2CE, roughness:0.85, metalness:0.0, envMapIntensity:0.4 });
  // 袍身：肩加宽、腰收窄（7.5 头身）；直裰 A 形剪影
  const prof = [
    new THREE.Vector2(0.001, 0),
    new THREE.Vector2(0.195, 0.01),
    new THREE.Vector2(0.225, 0.16),
    new THREE.Vector2(0.160, 0.55),
    new THREE.Vector2(0.150, 0.82),    // 腰（收窄 → 拉头身比）
    new THREE.Vector2(0.172, 1.04),
    new THREE.Vector2(0.186, 1.19),    // 肩（加宽 20%）
    new THREE.Vector2(0.062, 1.28),    // 颈
    new THREE.Vector2(0.001, 1.31),
  ];
  const robe = mesh(new THREE.LatheGeometry(prof, 18), ink, { name:'scholarRobe' });
  g.add(robe);
  // 立领（第三轮加高 + 浅色上缘 —— "无脖"读成"高领"）
  const collar = mesh(new THREE.CylinderGeometry(0.066, 0.072, 0.075, 10), ink, { name:'scholarCollar' });
  collar.position.y = 1.25;
  g.add(collar);
  const collarEdge = mesh(new THREE.CylinderGeometry(0.0665, 0.0665, 0.012, 10), inkLight, { name:'scholarCollarEdge' });
  collarEdge.position.y = 1.282;
  g.add(collarEdge);
  // 后领中缝（第四轮：box 埋进了袍内 —— 改为**贴背曲线管**，沿袍背 S 轮廓全段外凸 1cm）
  const seamCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 1.26, -0.075),   // 颈后
    new THREE.Vector3(0, 1.19, -0.196),   // 肩背（袍背 -0.186，外凸 1cm）
    new THREE.Vector3(0, 1.04, -0.182),
    new THREE.Vector3(0, 0.82, -0.160),  // 腰背
    new THREE.Vector3(0, 0.55, -0.170),
    new THREE.Vector3(0, 0.30, -0.205),
    new THREE.Vector3(0, 0.14, -0.235),   // 下摆
  ]);
  const seam = mesh(new THREE.TubeGeometry(seamCurve, 14, 0.011, 5), inkLight, { name:'scholarSeam' });
  g.add(seam);
  /* 双袖（第三轮：肘外顶更狠 —— 负手的唯一强信号是背后视角腰位的折角）：
     肩头→肘后外顶→前臂内收 35°→拢手袖口聚团，另挂垂布到膝、与袍身留缝。 */
  for (const side of [-1, 1]){
    const sl = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.180, 1.15, 0.03),    // 肩头（袍外起袖 → 与袍身断开）
      new THREE.Vector3(side * 0.275, 0.99, -0.105),   // 肘：后外顶出折点
      new THREE.Vector3(side * 0.098, 0.81, -0.215),   // 前臂内收（弯肘收向腰后）
      new THREE.Vector3(side * 0.052, 0.72, -0.228),  // 拢手袖口
    ]);
    g.add(mesh(new THREE.TubeGeometry(sl, 9, 0.065, 6, false), ink, { name:'scholarSleeve' }));
    // 肘尖（第五轮根因：肘球 0.062 < 袖管 0.065，完全埋在袖里 —— 外移加大到 0.37 突破袖缘）
    const elbow = mesh(new THREE.SphereGeometry(0.055, 8, 7), ink, { name:'scholarElbow' });
    elbow.position.set(side * 0.315, 0.99, -0.10);
    g.add(elbow);
    // 垂布：自肘下向膝上垂落，起点离袖身留 2~3cm 缝隙（背光下才读得出层次）
    const dr = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.150, 0.90, -0.16),
      new THREE.Vector3(side * 0.145, 0.70, -0.155),
      new THREE.Vector3(side * 0.132, 0.50, -0.135),
    ]);
    g.add(mesh(new THREE.TubeGeometry(dr, 7, 0.048, 5, false), ink, { name:'scholarDrape' }));
    // 拢手的袖口聚团 + 浅色袖口环（与袍身拉开明度）
    const clump = mesh(new THREE.SphereGeometry(0.058, 8, 7), ink, { name:'scholarClump' });
    clump.position.set(side * 0.050, 0.715, -0.228);
    clump.scale.set(1.25, 0.9, 0.85);
    g.add(clump);
    const cuff = mesh(new THREE.TorusGeometry(0.040, 0.007, 5, 10), inkLight, { name:'scholarCuff' });
    cuff.position.set(side * 0.052, 0.685, -0.235);
    cuff.rotation.y = Math.PI / 2;
    cuff.rotation.x = 0.4;
    g.add(cuff);
  }
  // 头 + 发髻 + 簪（低头回调 14°：20° 在俯拍机位读作"俯身"）
  const headG = new THREE.Group();
  headG.position.set(0, 1.445, 0.03);
  headG.rotation.x = 0.24;
  headG.add(mesh(new THREE.SphereGeometry(0.086, 14, 11), ink, { name:'scholarHead' }));
  const knot = mesh(new THREE.SphereGeometry(0.030, 8, 7), ink, { name:'scholarKnot' });
  knot.position.set(0, 0.098, -0.020);
  knot.scale.set(1, 0.95, 1);
  headG.add(knot);
  /* 簪（第五轮根因：4mm 簪径在 1.5m 视距只有 2px，被抗锯齿吃掉 —— 不是变换问题）。
     加粗到 16mm（风格化簪）+ 两端簪头珠（0.02m，4~5px 可读），"常见机位一头可见"达标 */
  const pinMat = new THREE.MeshStandardMaterial({ color:0xC9CDB8, roughness:0.6, metalness:0.0, envMapIntensity:0.5 });
  const pin = mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.132, 5), pinMat, { name:'scholarPin' });
  pin.rotation.order = 'ZYX';
  pin.rotation.set(0, 0.55, Math.PI / 2 + 0.14);   // 近水平（俯仰 8°），斜偏 30°
  pin.position.set(0.008, 0.096, -0.022);
  headG.add(pin);
  const pinAxis = new THREE.Vector3(-0.824, -0.122, 0.505);
  for (const e of [-1, 1]){
    const bead = mesh(new THREE.SphereGeometry(0.010, 6, 5), pinMat, { name:'scholarPinBead' });
    bead.position.set(0.008 + pinAxis.x * 0.066 * e, 0.096 + pinAxis.y * 0.066 * e, -0.022 + pinAxis.z * 0.066 * e);
    headG.add(bead);
  }
  g.add(headG);
  // 呼吸相位 + 不参与合并（要每帧微动）
  g.userData.breathPhase = Math.random() * TAU;
  g.userData.robe = robe;
  /* 日程道具（第十四轮：人物随时间/天气切换举止 —— 用户要求）
     pose: 'read' 执卷读书 / 'tea' 端盏品茗 / 默认负手
     道具尺寸按 3~4m 视距定：盏/卷径 4~5cm 在实物比例下偏小，为可读性放大到
     最大边 ~18cm 且用 inkLight 浅玉色 + 微自发光，白天/傍晚都压得住背景 */
  if (pose === 'read'){
    /* 执卷读书：一卷浅色书卷横于腹前（长 0.46、径 0.05，算上把手在 3m 外约 8px） */
    const vol = mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.46, 8), inkLight, { name:'scholarScroll', cast:false });
    vol.rotation.z = Math.PI / 2;
    vol.position.set(0, 1.04, 0.15);
    g.add(vol);
    const knobL = mesh(new THREE.SphereGeometry(0.022, 6, 5), inkLight, { name:'scholarScrollKnob' });
    knobL.position.set(-0.25, 1.04, 0.15);
    g.add(knobL);
    const knobR = mesh(new THREE.SphereGeometry(0.022, 6, 5), inkLight, { name:'scholarScrollKnob' });
    knobR.position.set(0.25, 1.04, 0.15);
    g.add(knobR);
    headG.rotation.x = 0.42;                        // 低头读书
  } else if (pose === 'tea'){
    /* 端盏品茗：浅色茶盏（径 0.07）前举至胸前，面对池面（yaw 由调用方给定） */
    const cup = mesh(new THREE.CylinderGeometry(0.035, 0.027, 0.042, 8), inkLight, { name:'scholarCup', cast:false });
    cup.position.set(0.15, 0.96, 0.12);
    cup.rotation.z = 0.18;
    g.add(cup);
    const saucer = mesh(new THREE.CylinderGeometry(0.043, 0.043, 0.016, 8), inkLight, { name:'scholarSaucer', cast:false });
    saucer.position.set(0.15, 0.925, 0.12);
    g.add(saucer);
    const steam = mesh(new THREE.SphereGeometry(0.018, 5, 4), inkLight, { name:'scholarSteam', cast:false });
    steam.position.set(0.15, 1.03, 0.12);
    steam.scale.set(1, 1.6, 1);
    g.add(steam);
    headG.rotation.x = 0.18;                        // 微俯视盏
    g.rotation.z = 0.02;
  }
  g.traverse(o => { if (o.isMesh) o.userData.noMerge = true; });
  figures.push(g);
  return g;
}

/* 私塾孩童（第十六轮：用户要求"2 孩童 + 1 教书先生"场景）。
   makeChildScholar 是先生剪影的子集 —— 矮约 0.72 倍、头更大（孩童头身比 ~3.5:1）、
   袍身更短圆、无簪、无负手垂布，只剩简单垂袖。陪先生晨课，面向先生。 */
function makeChildScholar({ x = 0, z = 0, yaw = 0, s = 1 } = {}){
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  g.scale.setScalar(s);
  const ink = new THREE.MeshStandardMaterial({ color:0x1A2233, roughness:0.92, metalness:0.0, envMapIntensity:0.25 });
  // 童袍：矮圆，微 A 形
  const prof = [
    new THREE.Vector2(0.001, 0),
    new THREE.Vector2(0.132, 0.01),
    new THREE.Vector2(0.152, 0.12),
    new THREE.Vector2(0.130, 0.42),
    new THREE.Vector2(0.118, 0.62),
    new THREE.Vector2(0.112, 0.80),
    new THREE.Vector2(0.090, 0.88),
    new THREE.Vector2(0.040, 0.94),
    new THREE.Vector2(0.001, 0.96),
  ];
  const robe = mesh(new THREE.LatheGeometry(prof, 14), ink, { name:'childRobe' });
  g.add(robe);
  // 简单垂袖（孩童的袖子贴垂，不拢后）
  for (const side of [-1, 1]){
    const sl = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.115, 0.80, 0.02),
      new THREE.Vector3(side * 0.105, 0.55, 0.0),
      new THREE.Vector3(side * 0.080, 0.34, -0.02),
    ]);
    g.add(mesh(new THREE.TubeGeometry(sl, 5, 0.042, 5, false), ink, { name:'childSleeve' }));
  }
  // 大头 + 双总角（孩童发髻：两小揪，不是成人单髻）
  const headG = new THREE.Group();
  headG.position.set(0, 1.02, 0.02);
  headG.rotation.x = 0.10;
  headG.add(mesh(new THREE.SphereGeometry(0.075, 12, 10), ink, { name:'childHead' }));
  for (const side of [-1, 1]){
    const top = mesh(new THREE.SphereGeometry(0.026, 7, 6), ink, { name:'childTopKnot' });
    top.position.set(side * 0.030, 0.085, -0.010);
    headG.add(top);
  }
  g.add(headG);
  g.userData.breathPhase = Math.random() * TAU;
  g.userData.robe = robe;
  g.traverse(o => { if (o.isMesh) o.userData.noMerge = true; });
  figures.push(g);
  return g;
}

/* ── 几何校验 ──
   合并前确认 position/uv/normal 计数一致、索引不越界、坐标有限。
   太湖石顶心曾经只 push position 不 push uv（11 座峰 → 合并后两个网格各差 11/4 条 uv）——
   这种错不报错、不 NaN，只是那几个三角形采到越界的 uv。机器查，别靠肉眼。 */
function validateGeometry(g, tag){
  const P = g.attributes.position;
  if (!P) return true;
  const n = P.count, bad = [];
  if (g.attributes.uv     && g.attributes.uv.count     !== n) bad.push('uv ' + g.attributes.uv.count + '≠' + n);
  if (g.attributes.normal && g.attributes.normal.count !== n) bad.push('normal ' + g.attributes.normal.count + '≠' + n);
  if (g.index){
    const ix = g.index.array;
    let mx = -1; for (let i = 0; i < ix.length; i++) if (ix[i] > mx) mx = ix[i];
    if (mx >= n) bad.push('索引越界 ' + mx + '≥' + n);
  }
  const pos = P.array;
  for (let i = 0; i < pos.length; i++) if (!isFinite(pos[i])){ bad.push('非有限坐标'); break; }
  if (bad.length) console.warn('[几何校验] ' + tag + '：' + bad.join('；'));
  return bad.length === 0;
}

/* ── 几何合并：同材质 + 同阴影标记的静态网格合并成单个 BufferGeometry ──
   把 draw call 从数百降到几十；动态物体（鱼、龟）和 InstancedMesh 不参与 */
function mergeStatics(root){
  root.updateMatrixWorld(true);
  const buckets = new Map();
  root.traverse(o=>{
    if (!o.isMesh || o.isInstancedMesh) return;
    if (o.userData.noMerge || Array.isArray(o.material)) return;
    const key = o.material.uuid + '|' + (o.castShadow ? 1 : 0) + (o.receiveShadow ? 1 : 0);
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, list: [] });
    buckets.get(key).list.push(o);
  });

  let groups = 0, removed = 0;
  for (const b of buckets.values()){
    if (b.list.length < 2) continue;                 // 单个网格不值得合并
    const geos = [];
    for (const o of b.list){
      const g = o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      /* ⚠️ 负行列式（镜像）物体：把 matrixWorld 烘进几何后**绕序会反转** ——
         三角形朝向与（已被 applyMatrix4 正确镜像的）法线相反。原来只烘矩阵不翻绕序，
         镜像构件合并后就变成反面：背面剔除下直接看不见；MAT.roof 这类 DoubleSide 材质
         虽被 gl_FrontFacing 兜住光照，但 AO 的法线 pass 与积雪的朝上判据读到的是反法线。
         翻一次绕序即可与法线一致。 */
      if (o.matrixWorld.determinant() < 0 && g.index){
        const ix = g.index.array;
        for (let t3 = 0; t3 + 2 < ix.length; t3 += 3){ const tmp = ix[t3]; ix[t3] = ix[t3 + 2]; ix[t3 + 2] = tmp; }
        g.index.needsUpdate = true;
      }
      if (!g.index){                                  // 统一为带索引
        const n = g.attributes.position.count;
        const idx = new Uint32Array(n);
        for (let i = 0; i < n; i++) idx[i] = i;
        g.setIndex(new THREE.BufferAttribute(idx, 1));
      }
      if (!g.attributes.normal) g.computeVertexNormals();
      if (!g.attributes.uv){                          // 统一补 uv，否则合并会失败
        const n = g.attributes.position.count;
        g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      }
      const keep = new THREE.BufferGeometry();        // 只保留三种属性
      keep.setAttribute('position', g.attributes.position);
      keep.setAttribute('normal', g.attributes.normal);
      keep.setAttribute('uv', g.attributes.uv);
      keep.setIndex(g.index);
      validateGeometry(keep, 'merge·' + (o.name || 'mesh'));
      geos.push(keep);
    }
    let merged = null;
    try { merged = mergeGeometries(geos, false); } catch(e){ merged = null; }
    if (!merged) continue;
    validateGeometry(merged, 'merged·' + (b.mat.name || b.mat.uuid.slice(0, 8)));
    const mm = new THREE.Mesh(merged, b.mat);
    mm.castShadow = b.cast; mm.receiveShadow = b.recv;
    mm.name = 'mergedStatic';
    root.add(mm);
    for (const o of b.list){ if (o.parent) o.parent.remove(o); removed++; }
    groups++;
  }
  console.log('[几何合并]', groups, '组材质 →', removed, '个网格');
}

/* 环境光遮蔽（GTAO）—— 治「构件像浮在地面上」这个毛病。
   建筑/石作/植被与地面的接触处会压出暗角，这是调光源参数调不出来的。
   代价：GTAO 需要一遍额外的法线渲染，等于把场景几何再画一次，draw call 会明显上升。
   radius 用世界单位（米），1.8 对应园林构件的接触尺度。 */
/* GTAO 需要一遍额外的法线渲染（= 场景几何再画一遍），实测让 draw call 与三角形各翻一倍。
   两个措施把它压回可接受范围：
   ① 按设备档位开关 —— 小视口（移动端）直接不接这个 pass；
   ② AO 阶段排除 foliage —— 叶片/柳条/水草的 AO 贡献极小，却占了绝大部分三角形。
      被排除的只是 AO 的计算输入，主渲染完全不受影响。*/
// GTAO 需要一遍额外的法线渲染（场景几何再画一遍），核显上代价不可接受。
// 完整的多档位自动升降级留到定稿后；这里只区分「独显 / 核显」两档。
const AO_ENABLED = GPU_TIER !== 'low';

let gtaoPass = null;          // 提到外层，供 ENV 调节 AO 权重
if (AO_ENABLED){
  const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  gtaoPass = gtao;
  gtao.output = GTAOPass.OUTPUT.Default;
  gtao.blendIntensity = 0.85;
  gtao.updateGtaoMaterial({
    radius: 1.8,            // 世界单位（米）—— 园林构件的接触尺度
    distanceExponent: 1.2,
    thickness: 1.0,
    scale: 1.0,
    samples: 32,            // PC 端专用，直接拉满质量
  });

  // 收集「AO 阶段可忽略」的植被网格（mergeStatics 之后，按材质认领）
  // ⚠️ 屋面/脊/墙帽**不能**排除！GTAO 的法线+深度缓冲是 AO 的唯一依据：
  //    把它们藏起来，那片像素就会按「屋顶后面」的室内几何算 AO，
  //    再把室内的 AO 图案乘回屋面 —— 看起来就是「瓦面透明、能看见堂内布局」。
  //    只能排除那些「藏起来也不会露馅」的东西：叶簇（背后是同类叶簇或天空）。
  const AO_SKIP_MATS = new Set([ MAT.leaf, MAT.leafDeep, MAT.willow, MAT.willowLeaf, MAT.reed,
                                 MAT.bambooA, MAT.bambooB, MAT.banana, MAT.wisteria,
                                 MAT.lily, MAT.lotus, MAT.trunk ]);
  const aoSkipped = [];
  world.traverse(o => { if (o.isMesh && AO_SKIP_MATS.has(o.material)) aoSkipped.push(o); });

  /* ⚠️ 还原时必须还原**原值**，不能一律置 true。
     这里原来写的是 `m.visible = true`，而 MAT.lily / MAT.reed / MAT.willow / MAT.lotus /
     MAT.wisteria 全都在 AO_SKIP_MATS 里，于是每帧都被 GTAO 从 false 翻回 true：
       applyPresence(false) → 主 RenderPass 正确地不画 → gtao.render() 的 finally 置 true
     一帧结束后对象的 visible 就停在 true 上。运行时因为下一帧 applyPresence 会再压一次，
     画面侥幸是对的；但**任何直接调用 composer.render() 的旁路**（采集脚本、控制台调试）
     都会照着 true 去画 —— 实测：冬季采集图里睡莲叶铺满水面，而实际运行时不显示。
     保存/还原原值后，帧末的 visible 才等于 applyPresence 的意图，采集与运行时一致。 */
  const gtaoRender = gtao.render.bind(gtao);
  const gtaoPrevVis = new Array(aoSkipped.length).fill(true);
  gtao.render = function (...args){
    for (let i = 0; i < aoSkipped.length; i++) gtaoPrevVis[i] = aoSkipped[i].visible;
    for (const m of aoSkipped) m.visible = false;
    /* ⚠️ 辅助 pass 期间还要把两件事按下去：
       ① 平面反射：Reflector 的 onBeforeRender 在**任何** renderer.render 里都会被调用，
          GTAO 的法线 pass 会把整个场景再渲染一遍 → 反射贴图被"法线色"覆盖一次
          （白白多一整遍镜像渲染，两条 pass 的状态互相污染）。
       ② 阴影：renderer.render 在 shadowMap.autoUpdate 打开时会重渲整张 shadow map，
          而此刻植被正被隐藏着 —— 等于每帧白渲一张 6144² 阴影图，且结果还会被下一帧覆盖。
       两者都必须 try/finally 还原。 */
    auxPass = true;
    const prevShadowAuto = renderer.shadowMap.autoUpdate;
    if (!window.__NO_SHADOW_GUARD) renderer.shadowMap.autoUpdate = false;   // 隔离实验开关
    try { gtaoRender(...args); }
    finally {
      renderer.shadowMap.autoUpdate = prevShadowAuto;
      auxPass = false;
      for (let i = 0; i < aoSkipped.length; i++) aoSkipped[i].visible = gtaoPrevVis[i];
    }
  };
  composer.addPass(gtao);
}

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.26, 0.50, 1.02);
composer.addPass(bloom);

/* 调色 pass —— 在原有的暗角之上补齐「后期该有的三件事」：对比、分离调色、饱和度。
   高光偏暖、暗部偏冷的分离调色是让画面脱开「3D 渲染感」最便宜也最有效的一步，
   而且全部发生在一个已有的 ShaderPass 里，不引入任何新 addon。 */
const GradeShader = {
  uniforms:{
    tDiffuse:{ value:null },
    uContrast:{ value:0.16 },                          // S 曲线强度
    uSaturation:{ value:1.06 },
    uWarmHi:{ value:new THREE.Color(0xFFF6E8) },       // 高光染色（暖）
    uCoolLo:{ value:new THREE.Color(0xE2EEFF) },       // 暗部染色（冷）
    uSplit:{ value:0.24 },
    uVignette:{ value:0.52 },
    uVigSize:{ value:0.90 },
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float uContrast, uSaturation, uSplit, uVignette, uVigSize;
    uniform vec3 uWarmHi, uCoolLo;
    varying vec2 vUv;
    void main(){
      vec4 src = texture2D(tDiffuse, vUv);
      vec3 c = src.rgb;

      // ① 对比：以 0.5 为轴的 S 曲线
      vec3 cc = clamp(c, 0.0, 1.0);
      vec3 s  = cc * cc * (3.0 - 2.0 * cc);
      c = mix(c, s, uContrast);

      // ② 分离调色：按亮度在高光暖 / 暗部冷之间插值
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      vec3 toned = mix(c * uCoolLo, c * uWarmHi, smoothstep(0.10, 0.75, l));
      c = mix(c, toned, uSplit);

      // ③ 饱和度
      c = mix(vec3(l), c, uSaturation);

      // ④ 暗角
      float d = distance(vUv, vec2(0.5));
      c *= mix(1.0, smoothstep(uVigSize, uVigSize - 0.52, d), uVignette);

      gl_FragColor = vec4(c, src.a);
    }`,
};
/* ⚠️ ShaderPass 会**克隆**模板的 uniforms（ShaderPass.js: this.uniforms = UniformsUtils.clone(shader.uniforms)）。
   所以 applyEnv 里写 GradeShader.uniforms 是写给一份没人用的模板 —— 实测：切到"夜 + 阴霾"后
   模板 saturation 已变成 0.662，而真正的 pass 还停在 1.06/0.16。
   也就是说对比 / 饱和 / 分离调色 / 暗角**从来没随时段天气变过**。必须写 pass 自己那份。 */
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);
bootMark('后处理链');
composer.addPass(new OutputPass());

/* ══════════════════════════════════════════════════════════════
/* ══════════════════════════════════════════════════════════════
   12 · 环境时序系统（ENV）
   ══════════════════════════════════════════════════════════════
   三个正交轴（时段 / 季节 / 天气）各自只写自己的预设表，最终参数由「组合规则」合成，
   而不是为 4×4×4 = 64 种组合各写一套 —— 这是这套系统不失控的关键。
   三根轴已全部接入（2-1 时段 / 2-2 季节 / 2-3 天气），合成位置就在 resolveEnv()。 */

/* ── 夜间的灯笼：自发光小体 + Bloom 辉光 ──
   2-1 先不做点光源：5 个点光会让所有材质重新编译着色器，代价远大于收益。
   夜里靠「低环境光 + 自发光灯笼 + 提高 bloom」就足以读成月夜园林。 */
const lanternMat = new THREE.MeshStandardMaterial({
  color: 0x3A2A18, emissive: 0xFFB45A, emissiveIntensity: 0, roughness: 0.6,
});
/* ⚠️ 灯笼原来**没有吊绳**，是个悬在空中的小圆柱 —— 近看立刻穿帮。
   而且远香堂那两盏 y=5.25，比檐口（1.24+colH=5.89）只低 0.64，
   等于挂在屋顶里面。现在：
   · 每盏灯从顶部拉一根细绳到上方构件的底面（游廊到额枋、堂前到挑檐），
     绳子长度 = 挂点高度 - 灯笼高度，所以**不可能浮空**；
   · 堂前两盏下移到 4.85，落在檐下净空里，不再钻进瓦面。 */
/* ⚠️ 挂点高度**不能猜**：写错的两种表现用户都拍到了 ——
   · 游廊三盏原来写 6.15，而实测它正上方最近的构件底面在 **3.20**（额枋背面，#4a2610），
     绳子于是从额枋和瓦面穿出去三米，露在屋面上的一截就是"连廊上生出的两根天线"；
   · 堂前两盏原来写 5.80，实测额枋底在 **6.34**（#8a3a16），低了 0.54m ——
     绳顶悬在半空，所以"灯笼没挂上、还是悬空的"。
   下面是"从灯笼顶向上打一条射线，取最近命中点"量出来的值（探针 diag-lantern.mjs）。 */
const lanternSpots = [
  [13.2, 2.30, -6.0, 3.18], [18.2, 2.30, -1.8, 3.18], [24.0, 2.30, 6.5, 3.18],  // 游廊下（额枋底实测 3.20）
  [-6.2, 4.85, -7.1, 6.32], [ 6.2, 4.85, -7.1, 6.32],                            // 远香堂前檐下（额枋底实测 6.34）
];
(function makeLanterns(){
  const bodyGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.30, 12);
  const capGeo  = new THREE.CylinderGeometry(0.085, 0.085, 0.05, 8);
  const cordGeo = new THREE.CylinderGeometry(0.012, 0.012, 1, 6);   // 单位高，按需缩放
  for (const [x, y, z, hang] of lanternSpots){
    const grp = new THREE.Group();
    grp.add(new THREE.Mesh(bodyGeo, lanternMat));
    const c1 = new THREE.Mesh(capGeo, MAT.woodDark); c1.position.y =  0.18;
    const c2 = new THREE.Mesh(capGeo, MAT.woodDark); c2.position.y = -0.18;
    grp.add(c1, c2);
    // 吊绳：从灯笼顶(cap 上沿 y≈0.205) 拉到挂点
    const cordLen = Math.max(0.1, hang - y - 0.205);
    const cord = new THREE.Mesh(cordGeo, MAT.woodDark);
    cord.scale.y = cordLen;
    cord.position.y = 0.205 + cordLen/2;
    grp.add(cord);
    grp.position.set(x, y, z);
    world.add(grp);
  }
})();

/* ── 时段预设 ──
   每个预设是一组扁平的标量与颜色通道。颜色用 hex（number），
   因此需要一份「哪些 key 是颜色 / 向量」的清单来指导构造与插值。 */
const ENV_COLOR_KEYS = ['sunColor','ambColor','hemiSky','hemiGround','fillColor',
                        'skyTop','skyHorizon','sunDisk','cloudTint','fogColor',
                        'snowTint',          // 天气：积雪色调（不登记就不会被 makeParams 转成 Color）
                        // 季节植被色调（作用于各自材质）
                        'tinGrass','tinBamboo','tinLeaf','tinReed','tinWillow',
                        'tinLily','tinLotus','tinWisteria','tinBanana','tinTrunk'];
/* ── 天气预设（第三个正交轴）──
   与季节同样的契约：只写「与时段无关」的那部分 ——
   光强 / 雾 / 曝光 / 饱和的乘性或加性修正，加上天气专属通道。
   天气专属通道：cloudAmount / rainAmount / snowAmount / snowCover / wetness /
                windMul / gustMul / skyGray / fogGray / diskFade / snowTint
   ⚠️ 每个预设必须写全这些键，否则 mixInto 会在 undefined 上做算术。 */
const ENV_WEATHER = {
  clear: { weatherLabel:'风和日丽', blizzard:0,
    sunMul:1.00, ambMul:1.00, hemiMul:1.00, fogMul:1.00, satMul:1.00, expMul:1.00,
    cloudAmount:null, skyGray:0.00, fogGray:0.00, diskFade:0.00,
    rainAmount:0.0, snowAmount:0.0, snowCover:0.0, wetness:0.0,
    windMul:1.00, gustMul:1.00, snowTint:0xF2F6FA },
  storm: { weatherLabel:'狂风暴雨', blizzard:1,   // 冬季 → 下面的 blizzard 分支会把它变成风雪
    sunMul:0.38, ambMul:0.85, hemiMul:0.90, fogMul:2.40, satMul:0.84, expMul:0.95,
    cloudAmount:1.00, skyGray:0.55, fogGray:0.30, diskFade:0.85,
    rainAmount:1.0, snowAmount:0.0, snowCover:0.0, wetness:1.0,
    windMul:4.00, gustMul:0.30, snowTint:0xF2F6FA },
  overcast: { weatherLabel:'阴霾暗沉', blizzard:0,
    sunMul:0.55, ambMul:0.95, hemiMul:0.96, fogMul:1.55, satMul:0.72, expMul:0.98,
    cloudAmount:1.00, skyGray:0.72, fogGray:0.62, diskFade:1.00,
    rainAmount:0.0, snowAmount:0.0, snowCover:0.0, wetness:0.0,
    windMul:1.15, gustMul:1.00, snowTint:0xF2F6FA },
  snow: { weatherLabel:'银装素裹', blizzard:0,
    sunMul:0.62, ambMul:1.10, hemiMul:1.12, fogMul:1.30, satMul:0.80, expMul:1.00,
    cloudAmount:0.94, skyGray:0.60, fogGray:0.55, diskFade:0.90,
    rainAmount:0.0, snowAmount:1.0, snowCover:1.0, wetness:0.0,
    windMul:1.35, gustMul:1.00, snowTint:0xF4F8FF },
  /* 薄雾烟霭：全季节合法。它不是"阴"—— 雾的本质是**雾本身变厚**（fogMul 1.3：
     正午 0.0052×1.3≈0.0068，晨间 0.0088×1.3≈0.011），天空只轻度去色、日轮留一个
     淡淡的白色圆盘（diskFade 0.7），湿气贴地（wetness 0.25）。
     ⚠️ 浓度调过四档：4.4 → 2.7 → 1.7 → 1.3。用户实测视角是**晨时**（晨的雾基数本来
     就是正午的 1.7 倍）：1.7 时主厅立面仍被洗成灰白（40m 处雾覆盖 30%）。
     量过关键段：1.3 时主厅段 ≈20%、60m ≈28%、远山 120m ≈50%、200m ≈75% ——
     "近清远朦"的灰阶阶梯成立，雾只剩三个职责：吞远山、压低日轮、中景蒙纱。 */
  mist: { weatherLabel:'薄雾烟霭', blizzard:0,
    sunMul:0.85, ambMul:1.05, hemiMul:1.08, fogMul:1.30, satMul:0.96, expMul:1.02,
    cloudAmount:0.30, skyGray:0.22, fogGray:0.26, diskFade:0.70,
    rainAmount:0.0, snowAmount:0.0, snowCover:0.0, wetness:0.25,
    windMul:1.00, gustMul:0.60, snowTint:0xF2F6FA },
};
/* 互斥矩阵 —— 唯一权威在这里。
   · 银装素裹仅冬季（其余季节按钮置灰，悬停给出原因）
   · 冬 + 狂风暴雨 → 渲染为风雪（雨置换为雪、给积雪）；其余季节是雨
   返回 null 表示该组合合法。 */
const WEATHER_RULES = {
  snow: s => s === 'winter' ? null : '仅冬季可用',
};
function weatherMutexReason(weather, season){
  const r = WEATHER_RULES[weather];
  const why = r ? r(season) : null;
  return why || null;
}
/* 实际落到画面的天气效果：风雪 = 暴雨的强度 + 雪的存在形式 */
/* 只有标签需要随季节改写：天气是 storm，但冬季画面上是风雪。
   snowAmount 等参数由 applyWeatherTo 的 blizzard 分支负责，不在这里改。 */
function weatherLabelOf(weather, season){
  // 冬 + 暴风 = 狂风细雨：冬天下暴雨是个伪命题，画面该是"风大、雨细、天暗、地湿"的凄凉感
  if (weather === 'storm' && season === 'winter') return '狂风细雨';
  return (ENV_WEATHER[weather] || ENV_WEATHER.clear).weatherLabel;
}
function weatherTag(){
  // 一律读解析后的值：冬季暴雨的天气轴是 storm，但画面上是风雪，不该显示"狂风暴雨"
  const p = ENV.cur && ENV.cur.weatherLabel;
  return p || weatherLabelOf(ENV.weather, ENV.season);
}
function effectiveWeather(){
  if (ENV.weather === 'storm' && ENV.season === 'winter') return 'winterrain';
  return ENV.weather;
}

/* ── 天气参数叠加 ──
   在「时段 × 季节」之后叠第三层。与季节同构：乘性修正打底，专属通道只在该预设出现时写入。
   skyGray / fogGray 是把天空与雾往一个中性灰上拉 —— 「阴」这件事本质上是**去色 + 去直射光**，
   而不是单纯压暗，所以做成混色而不是乘一个系数。 */
const SKY_GRAY  = new THREE.Color(0x8E949C);
const FOG_GRAY  = new THREE.Color(0x9AA0A6);
function grayMix(col, gray, amount){
  if (amount <= 0) return;
  col.r += (gray.r - col.r) * amount;
  col.g += (gray.g - col.g) * amount;
  col.b += (gray.b - col.b) * amount;
}
function applyWeatherTo(p, eff){
  const w = ENV_WEATHER[ENV.weather] || ENV_WEATHER.clear;
  p.sunIntensity  *= w.sunMul;
  p.ambIntensity  *= w.ambMul;
  p.hemiIntensity *= w.hemiMul;
  p.fogDensity    *= w.fogMul;
  p.exposure      *= w.expMul;
  p.grade.saturation *= w.satMul;
  p.cloudAmount = (w.cloudAmount === null) ? p.cloudAmount : w.cloudAmount;
  p.rainAmount = w.rainAmount; p.snowAmount = w.snowAmount;
  p.snowCover  = w.snowCover;  p.wetness    = w.wetness;
  p.windMul    = w.windMul;    p.gustMul    = w.gustMul;
  p.skyGray    = w.skyGray;    p.fogGray    = w.fogGray;  p.diskFade = w.diskFade;
  p.weatherLabel = weatherLabelOf(ENV.weather, ENV.season);
  p.blizzard = w.blizzard || 0;          // 供统计栏/调试判断"这是不是风雪"，不参与插值
  p.snowTint = new THREE.Color(w.snowTint);
  if (eff === 'winterrain'){
    /* 冬季暴雨 = 风雪。这里以前是错的：把 snowAmount/snowCover/cloudAmount/skyGray/diskFade
       全部硬编码，等于把 storm 剩下的部分**退化成 snow 预设**，再叠上 storm 的光照系数。
       结果"冬季狂风暴雨"和"银装素裹"只差一点风、一点雾 —— 用户一眼就看出来了。
       正确做法是**换相态，不换性格**：雨→雪，但暴雨该有的强降水与狂风全部保留。 */
    /* 相态**保持液态**：冬 + 暴雨 = 狂风细雨。原来这里是"换相态成风雪"，
       用户判为"伪命题"—— 冬天下暴雨本来就该是凄凉的冷雨，不该变成暴风雪。
       强风/暗光/厚雾全部保留（那是暴风的性格），只把降水改成细雨、并且不积雪。 */
    p.rainAmount = 0.62;                 // 细雨：比夏天暴雨（1.0）细，但仍是持续降水
    p.snowAmount = 0.0;
    p.snowCover  = 0.0;                  // 湿冷的地面，而不是积雪
    p.cloudAmount = 1.0;
    p.skyGray = Math.max(p.skyGray, 0.72);
    p.fogGray = Math.max(p.fogGray, 0.45);
    p.diskFade = 1.0;
    p.exposure *= 0.90;                  // 比夏雨再暗一点，压出冬天的阴沉
    // windMul / gustMul / sunIntensity / fogDensity 一律沿用 storm 自己的值，不再覆盖
  }
  if (eff === 'snow'){
    p.snowAmount = 1.0; p.snowCover = 1.0; p.rainAmount = 0.0;
  }
  grayMix(p.skyTop,     SKY_GRAY, p.skyGray);
  grayMix(p.skyHorizon, SKY_GRAY, p.skyGray);
  grayMix(p.fogColor,   FOG_GRAY, p.fogGray);
  return p;
}

const ENV_TIME = {
  morning: { label:'晨',

/* 预设 → 可插值参数对象 */
function makeParams(src){
  const o = {};
  for (const k in src){
    const v = src[k];
    if (ENV_COLOR_KEYS.indexOf(k) >= 0) o[k] = new THREE.Color(v);
    else if (Array.isArray(v)) o[k] = v.slice();
    else if (k === 'grade') o.grade = { ...v, warm:new THREE.Color(v.warm), cool:new THREE.Color(v.cool) };
    else o[k] = v;
  }
  return o;
}
function cloneParams(p){
  const o = {};
  for (const k in p){
    const v = p[k];
    if (v && v.isColor) o[k] = v.clone();
    else if (Array.isArray(v)) o[k] = v.slice();
    else if (k === 'grade') o[k] = { ...v, warm:v.warm.clone(), cool:v.cool.clone() };
    else o[k] = v;
  }
  return o;
}
/* 逐通道插值（就地写入 out） */
function mixInto(out, a, b, t){
  for (const k in a){
    const va = a[k], vb = b[k], o = out[k];
    if (typeof va === 'number') out[k] = va + (vb - va) * t;
    else if (va && va.isColor) o.copy(va).lerp(vb, t);
    else if (Array.isArray(va)) { for (let i = 0; i < va.length; i++) o[i] = va[i] + (vb[i] - va[i]) * t; }
    else if (k === 'grade'){
      for (const gk in va){
        if (typeof va[gk] === 'number') o[gk] = va[gk] + (vb[gk] - va[gk]) * t;
        else if (va[gk] && va[gk].isColor) o[gk].copy(va[gk]).lerp(vb[gk], t);
      }
    }
    else out[k] = vb;                                  // label 之类的字符串直接取目标
  }
}

/* ── 组合规则 ──
   整套系统的核心：三个轴在这里合成，而不是各自直接改渲染对象。
   时段提供「基准」，季节以乘性修正 + 专属通道叠上去；
   天气（2-3 已接入）以同样方式叠第三层：乘性修正 + 专属通道 + 天空/雾去色。
   composeEnv 单独成函数：连续时辰滑杆要用自己的「时段基准」进来叠同一套规则。 */
function composeEnv(p){
  const s = ENV_SEASON[ENV.season] || ENV_SEASON.summer;       // 季节修正
  // 乘性修正（光强 / 雾 / 饱和）
  p.sunIntensity  *= s.sunMul;
  p.ambIntensity  *= s.ambMul;
  p.hemiIntensity *= s.hemiMul;
  p.fogDensity    *= s.fogMul;
  p.grade.saturation *= s.satMul;
  // 季节专属通道（时段不提供这些键）
  for (const k in s){
    const v = s[k];
    if (k === 'label' || k === 'tintMix') continue;
    if (typeof v === 'number') p[k] = v;
  }
  p.tintMix = s.tintMix;
  for (const k of ENV_COLOR_KEYS){
    if (k.indexOf('tin') === 0) p[k] = new THREE.Color(s[k] !== undefined ? s[k] : 0xFFFFFF);
  }
  // 第三层：天气（乘法打底 + 专属通道 + 去色）
  applyWeatherTo(p, effectiveWeather());
  return p;
}
function resolveEnv(){
  /* 时段基准统一走 ENV.hour（滑杆的连续时辰）：按钮切时段只是把 hour 对齐到锚点，
     这样"滑杆拖到 15:20 再切季节/天气"不会把时刻拽回整点锚点。 */
  const base = (ENV.hour !== undefined)
    ? paramsAtHour(ENV.hour)
    : makeParams(ENV_TIME[ENV.time] || ENV_TIME.noon);
  return composeEnv(base);
}

/* ── 连续昼夜（时辰滑杆）──
   四锚点取各时段"性格"的中间时刻：晨 7:30 / 午 12:30 / 暮 17:30 / 夜 21:30。
   夜里 21:30 → 次日 4:30 整段保持深夜（不是匀速往晨过渡——凌晨两点不该"半亮"），
   4:30 → 7:30 才是黎明渐亮。 */
const TIME_ANCHORS = { morning: 7.5, noon: 12.5, dusk: 17.5, night: 21.5 };
function hourSeg(h){
  const hh = (h < 7.5 ? h + 24 : h);              // 夜→晨跨午夜：抬进 [21.5, 31.5)
  if (hh < 12.5) return { a:'morning', b:'noon',    t:(hh - 7.5)  / 5 };
  if (hh < 17.5) return { a:'noon',    b:'dusk',    t:(hh - 12.5) / 5 };
  if (hh < 21.5) return { a:'dusk',    b:'night',   t:(hh - 17.5) / 4 };
  if (hh < 28.5) return { a:'night',   b:'night',   t:0 };
  return           { a:'night',   b:'morning', t:(hh - 28.5) / 3 };
}
function paramsAtHour(h){
  const seg = hourSeg(h);
  const out = makeParams(ENV_TIME[seg.a]);
  if (seg.t > 0) mixInto(out, out, makeParams(ENV_TIME[seg.b]), Math.min(1, seg.t));
  return out;
}
function nearestTimeKey(h){
  if (h >= 4.5 && h < 10)   return 'morning';
  if (h >= 10  && h < 15)   return 'noon';
  if (h >= 15  && h < 19.5) return 'dusk';
  return 'night';
}
function fmtHour(h){
  let hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  if (mm === 60){ mm = 0; hh = (hh + 1) % 24; }
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
}
/* 标签：滑杆偏离锚点超过一刻钟就显示 HH:MM，正落锚点仍显示 晨/午/暮/夜 */
function timeLabelNow(){
  const anchor = TIME_ANCHORS[ENV.time] !== undefined ? TIME_ANCHORS[ENV.time] : 12.5;
  let d = Math.abs(ENV.hour - anchor);
  if (d > 12) d = 24 - d;                          // 跨午夜比较
  return d > 0.25 ? fmtHour(ENV.hour) : (ENV_TIME[ENV.time] ? ENV_TIME[ENV.time].label : '午');
}

/* ── 把参数落到渲染对象上 ── */
const uiRoot = document.documentElement;
let uiLastDark = null;                 // 主题只跟时段轴有关：记住上次写过的值，别每帧重写 CSS
function applyEnv(p){
  sun.color.copy(p.sunColor); sun.intensity = p.sunIntensity;
  sun.position.set(p.sunPos[0], p.sunPos[1], p.sunPos[2]);
  sun.target.position.set(0, 0, 0); sun.target.updateMatrixWorld();
  /* 阴影视体随光仰角自适应（审计 B19）：暮时太阳仰角仅 ~13°，堂高 7m 影长 ~30m，
     超过固定视体 ±28/±24 会被硬切。按仰角放大视体（仰角越低影越长视体越大）：
     白天（仰角 >20°）scale=1 原样；黄昏放大 ~1.5×，texel 密度 110→~73/m，
     长影换一点柔和度 —— 被硬切比变糊更假。lastShadowScale 防抖：静止时不再重算。 */
  const _sunH = p.sunPos[1], _sunD = Math.hypot(p.sunPos[0], p.sunPos[2], _sunH);
  const _elev = Math.max(0.09, Math.asin(_sunH / Math.max(1, _sunD)));
  const _sc = Math.max(1, Math.min(2.2, 0.35 / _elev));
  if (Math.abs(_sc - (sun.userData.lastShadowScale || 0)) > 0.02){
    sun.userData.lastShadowScale = _sc;
    sun.shadow.camera.left = -28 * _sc;
    sun.shadow.camera.right = 28 * _sc;
    sun.shadow.camera.top = 24 * _sc;
    sun.shadow.camera.bottom = -24 * _sc;
    sun.shadow.camera.updateProjectionMatrix();
    renderer.shadowMap.needsUpdate = true;
  }
  amb.color.copy(p.ambColor);  amb.intensity = p.ambIntensity;
  fill.color.copy(p.fillColor); fill.intensity = p.fillIntensity;
  hemiLight.color.copy(p.hemiSky); hemiLight.groundColor.copy(p.hemiGround);
  hemiLight.intensity = p.hemiIntensity;

  scene.fog.color.copy(p.fogColor); scene.fog.density = p.fogDensity;
  /* 夜段雾色上限（交接遗留 #7）：雾色明度不许高于天光 ——
     否则"夜+浓雾"里被雾吞掉的远山会比天空还亮（fogGray 把夜雾往亮灰拉，
     scene 侧比值收敛到 1.05 后渲染实测仍是亮斑：ACES tone mapping 对暗部有
     toe 抬升，雾色在屏幕上被额外提亮，所以 scene 侧必须压到天空的 0.9 倍）。
     以地平线天光为参照、仅暗环境启用（白天天空亮、比值恒满足不触发）；
     multiplyScalar 保色相，夜里仍是蓝黑调。 */
  const hLum = lumOf(p.skyHorizon);
  if (hLum < 0.30){
    const fLum = lumOf(scene.fog.color);
    const fMax = Math.min(hLum * 0.90, 0.15);
    if (fLum > fMax) scene.fog.color.multiplyScalar(fMax / fLum);
  }
  /* 环境贴图强度随天光走（见 ENV_BAKE_LUM 处的说明）：否则夜景里的石材/木材/水面
     仍在反射白天的天空，明明白墙已经暗下去了。 */
  if (scene.environmentIntensity !== undefined){
    const curLum = (lumOf(p.skyTop) + lumOf(p.skyHorizon)) * 0.5;
    scene.environmentIntensity = Math.max(0.08, Math.min(1.25, curLum / ENV_BAKE_LUM));
  }

  const su = skyMesh.material.uniforms;
  su.uTop.value.copy(p.skyTop);
  su.uHorizon.value.copy(p.skyHorizon);
  su.uSunColor.value.copy(p.sunDisk);
  su.uSunDir.value.copy(sun.position).normalize();
  su.uCloudTint.value.copy(p.cloudTint);
  su.uCloudAmount.value = p.cloudAmount;
  // 阴天没有可见日轮 —— 阴霾给 diskFade=1 把天光里的日轮彻底抹掉，
  // 否则"阴天"的画面上会挂着一个亮太阳，一眼假
  su.uDiskFade.value = p.diskFade !== undefined ? p.diskFade : 0;
  // 星空也要被云遮掉：云量越大，星越少
  su.uStarAmount.value = p.starAmount * Math.max(0, 1 - (p.cloudAmount || 0) * 0.85);

  renderer.toneMappingExposure = p.exposure;
  bloom.strength = p.bloomStrength;
  bloom.radius   = p.bloomRadius;
  bloom.threshold = p.bloomThreshold;
  if (gtaoPass) gtaoPass.blendIntensity = p.gtaoBlend;

  const gu = gradePass.uniforms;      // 写 pass 自己那份（模板是死的，见 composer 处的说明）
  gu.uContrast.value   = p.grade.contrast;
  gu.uSaturation.value = p.grade.saturation;
  gu.uWarmHi.value.copy(p.grade.warm);
  gu.uCoolLo.value.copy(p.grade.cool);
  gu.uSplit.value      = p.grade.split;
  gu.uVignette.value   = p.grade.vignette;

  lanternMat.emissiveIntensity = p.lamp * 3.4;

  // 核显档的水面用天空色近似反射，天空一变它也要跟着变
  if (waterSurface){
    const wu = waterSurface.material.uniforms;
    if (wu.uSkyTop)     wu.uSkyTop.value.copy(p.skyTop);
    if (wu.uSkyHorizon) wu.uSkyHorizon.value.copy(p.skyHorizon);
  }

  /* ── 季节：植被色调 / 存在性 / 动物行为 ── */
  seasonMixUniform.value = p.tintMix;
  /* 柳帘季节亮度：tint 是保明度换色，压不出"春芽发亮/夏翠深"的明度差 ——
     直接驱动叶帘材质底色（春 ×1.3 提亮，其余季节回落 1.0） */
  MAT.willowLeaf.color.setScalar(ENV.season === 'spring' ? 1.30 : 1.00);
  /* 竹叶春芽提亮（2026-09-16 用户反馈"春/夏竹叶无差别"）：seasonTint 换色是
     **保明度**的 —— 嫩绿 #8ecb58 的明度被 shader 拉回与本色一致（sLum/tLum≈0.42），
     春竹叶实际 = 本色 ×0.42 的暗绿，与夏几乎同色。与 willowLeaf 同一对策：
     copy 基色后春 ×1.35 抬亮度（1.35 下换色结果 ≈#85C758 鲜嫩绿，与夏 #4E8C36 拉满对比），
     其余季节回 1.0。copy 基色防 applyEnv 逐帧调用累积。 */
  MAT.leaf.color.copy(MAT._leafBase); MAT.leafDeep.color.copy(MAT._leafDeepBase);
  if (ENV.season === 'spring'){
    MAT.leaf.color.multiplyScalar(1.35);
    MAT.leafDeep.color.multiplyScalar(1.25);
  }
  /* 芭蕉假茎冬季枯株：压掉环境反射 —— 否则 PMREM 里草地/天空的绿会把
     tint 的枯黄褐（0x9C8A58）洗回暗橄榄绿，萧瑟残株读不出来 */
  MAT.banana.envMapIntensity = (ENV.season === 'winter') ? 0.05 : 0.5;
  MAT.banana.roughness = (ENV.season === 'winter') ? 0.96 : (MAT.banana.userData.dryRough || 0.7);
  for (const [mat] of SEASON_TINT_MATS){
    const u = mat.userData.seasonTint;
    const c = p[mat.userData.seasonKey];
    if (u && c) u.value.copy(c);
  }
  collectSeasonGLB();
  if (window.__ENVDBG){
    const wl = seasonMeshCache.get(MAT.wisteria) || [];
    const visBefore = wl.map(o=>o.visible?1:0).join('');
    console.log('[ENVDBG] p.wisteriaShow=' + p.wisteriaShow + ' cacheLen=' + wl.length +
                ' visibleBefore=' + visBefore.slice(0,20) + ' label=' + p.weatherLabel);
  }
  applyPresence(p);
  collectSeasonGLB();
  applyGLBSeason(p);
  for (const it of willowLeafInsts) it.o.count = Math.max(0, Math.round(it.max * p.willowLeaf));
  /* 竹叶季节叶量：春稀（0.55，抽竿后刚长叶）→ 夏茂（1.0）→ 秋微落（0.85）→ 冬常绿稍疏（0.65） */
  for (const it of bambooLeafInsts) it.o.count = Math.max(0, Math.round(it.max * p.bambooLeaf));
  /* 蜻蜓：季节管"存不存在"，天气管"飞不飞"。
     暴雨/风雪里蜻蜓是停栖的，不该照常游弋 —— 这是之前漏掉的一层天气修正。 */
  {
    const eff = effectiveWeather();
    const grounded = eff === 'storm' || eff === 'winterrain'
                  || (p.rainAmount || 0) > 0.4 || (p.windMul || 1) > 2.5;
    for (const d of dragonflies) d.visible = !grounded && p.dragonflyShow > 0.03;
  }
  for (const tw of swimTurtles) tw.visible = p.turtleShow > 0.03;

  /* ── 天气：风 / 积雪 / 湿地 ──
     ⚠️ 这里**不写** WIND.uWindStrength：applyEnv 只在过渡期间被调用，
     写在这里会立刻被每帧的 updateWind 覆盖（实测底值 2.2 → 0.153）。
     风力统一由 updateWind 每帧合成，这里只交代"阵风该有多猛"。 */
  gust.peakMul = p.gustMul !== undefined ? p.gustMul : 1;   // 狂风下随机阵风不再叠得很高
  snowUniform.value      = p.snowCover  !== undefined ? p.snowCover  : 0;
  if (p.snowTint) snowTintUniform.value.copy(p.snowTint);
  applyWetness(p.wetness !== undefined ? p.wetness : 0);

  /* 界面主题直接由**时段轴**决定，不由渲染出来的颜色反推。
     走这条路之前试过两种"算亮度"的写法，都栽在同一件事上：天气会改天色。
       · 用雾色：天气的"天光压灰"把雾色抬到中灰（夜+银装素裹 #767b81，亮度 0.196）
       · 用天空色：同一个压灰把 skyTop 从 #0b1220 抬到 #71767d（亮度 0.178）
     两次都是"夜里的暗场景"被判成亮场，面板在夜景里闪回一块白疙瘩。
     昼夜本来就是时段轴的语义（夜里就是暗），它有确定答案、不被任何天气手段污染，
     也正好对应面板上"晨/午/暮/夜"那四个字。暮色仍算亮场（面板压在夕阳上依然读得清）。 */
  const dark = (ENV.time === 'night');
  // 亮场：近黑字 + 暖白衬底（对比度由衬底兜底）
  // 暗场：暖白字 + 深衬底。字色不用纯白，夜里纯白会眩
  /* ⚠️ applyEnv 在 2.8 秒过渡里是**逐帧**被调用的，而主题只跟"时段轴"这个离散量有关：
     9 条 CSS 变量 × 168 帧 = 1500 次重复 DOM 写。只在真正翻转时写一次。 */
  if (dark !== uiLastDark){
  uiLastDark = dark;
  uiRoot.style.setProperty('--ui-fg',      dark ? '#f2efe6' : '#121417');
  uiRoot.style.setProperty('--ui-fg-dim',  dark ? '#dcd8ce' : '#26292e');
  uiRoot.style.setProperty('--ui-fg-hint', dark ? '#c4c0b6' : '#3a3e44');
  uiRoot.style.setProperty('--ui-panel',   dark ? 'rgba(18,22,28,.62)' : 'rgba(246,246,243,.60)');
  uiRoot.style.setProperty('--ui-bg',      dark ? 'rgba(52,58,68,.60)' : 'rgba(255,255,255,.50)');
  uiRoot.style.setProperty('--ui-bd',      dark ? 'rgba(232,230,224,.45)' : 'rgba(40,40,40,.42)');
  uiRoot.style.setProperty('--ui-sh',      dark ? '0 1px 3px rgba(0,0,0,.85)' : '0 1px 0 rgba(255,255,255,.75)');
  uiRoot.style.setProperty('--ui-on-bg',   dark ? 'rgba(240,236,226,.95)' : 'rgba(30,34,40,.92)');
  uiRoot.style.setProperty('--ui-on-fg',   dark ? '#14171c' : '#ffffff');
  }
}

/* ══ 植被季节表现 ══
   色调：给植被材质注入共享 uniform，按「保留明度的换色」重着色 ——
   色相换成季节目标色，明暗仍来自原贴图，这样叶簇的层次不会糊掉。
   ⚠️ 必须链式挂接 onBeforeCompile：叶/柳/苇已经有风场注入，直接覆盖会把风弄坏。 */
// 直接取登记表：这样连运行时克隆出来的材质（地面）也被覆盖
const SEASON_TINT_MATS = SEASON_TINT_REGISTRY.slice();
const seasonMixUniform = { value: 0 };
for (const [mat, key] of SEASON_TINT_MATS){
  const uni = { value: new THREE.Color(0xFFFFFF) };
  mat.userData.seasonTint = uni;
  mat.userData.seasonKey  = key;
  const prevCB  = mat.onBeforeCompile;
  const prevKey = mat.customProgramCacheKey;
  mat.onBeforeCompile = function (shader, renderer){
    if (prevCB) prevCB.call(this, shader, renderer);
    shader.uniforms.uSeasonTint = uni;            // 共享同一对象：所有变体一起变
    shader.uniforms.uSeasonMix  = seasonMixUniform;
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uSeasonTint;\nuniform float uSeasonMix;')
      .replace('#include <color_fragment>',
        '#include <color_fragment>\n' +
        '  float sLum = dot(diffuseColor.rgb, vec3(0.2126,0.7152,0.0722));\n' +
        '  float tLum = max(dot(uSeasonTint, vec3(0.2126,0.7152,0.0722)), 0.06);\n' +
        '  diffuseColor.rgb = mix(diffuseColor.rgb, uSeasonTint * (sLum / tLum), uSeasonMix);');
  };
  mat.customProgramCacheKey = function (){ return (prevKey ? prevKey.call(this) : '') + '|season'; };
}

/* 存在性：程序化植被已被 mergeStatics 按材质合并，只能整体开关；
   GLB 资产（荷/芭蕉/龟）异步挂载、晚于合并，可以逐个控制。 */
const SEASON_PRESENCE = [
  ['lotusShow',[MAT.lotus]], ['lilyShow',[MAT.lily]], ['wisteriaShow',[MAT.wisteria]],
  /* 芭蕉假茎**不进** presence 表（第八轮用户常识反馈）：芭蕉是多年生草本，
     冬季地上部枯萎但假茎宿存 —— 假茎的颜色由 tinBanana（冬=枯黄）表达，
     消失的只是冠层（GLB 叶+果，随 bananaShow 缩放/隐藏）。
     旧表把 MAT.banana 也挂在 bananaShow 上，冬天整株消失 = 把多年生当一年生。 */
  ['reedShow',[MAT.reed]],
  /* ⚠️ 莲蓬（莲实）必须跟着荷花一起消失。
     莲蓬的**杆**用 MAT.lily、**头与莲子**用 MAT.lotusPod —— 杆在表里、头不在，
     于是冬季 lilyShow=0 把杆藏了、头还留在水面上，看起来就是"悬空的莲蓬"。
     以后凡是"一株植物由多种材质拼成"，登记表必须把它**整套材质**都收进来。 */
  ['lotusShow',[MAT.lotusPod, MAT.lotusPodAged, MAT.lotusPodDark, MAT.lotusSeed]], ['bananaShow',[MAT.bananaFruit]],
  ['wisteriaShow',[MAT.wisteriaLeaf]],
];
const seasonMeshCache = new Map();
for (const [, mats] of SEASON_PRESENCE){
  for (const m of mats){
    const list = [];
    world.traverse(o => { if (o.isMesh && o.material === m) list.push(o); });
    seasonMeshCache.set(m, list);
  }
}
/* 存在性必须**每帧重申**，不能只在过渡里设一次。
   原因：GTAO pass 每帧都会把场景对象的 visible 临时关掉再改回来（AO 的正常做法），
   而 applyEnv 只在 ENV.t < 1 的过渡期间被调用 —— 过渡一结束，没人再重申，
   GTAO 就把 winter 的"花不存在"恢复成了 visible=true。实测就是这样：
     set true  | at gtao.render() <- renderer.render() <- animate()
   同一个根因之前也吃掉过"狂风底值风"。 */
function applyPresence(p){
  for (const [key, mats] of SEASON_PRESENCE){
    const on = p[key] > 0.03;
    for (const m of mats){
      const list = seasonMeshCache.get(m);
      if (list) for (const o of list) o.visible = on;
    }
  }
  /* 实例化网格再补一道 count：visible 会被 GTAO pass 每帧改回 true，
     而 count=0 时 three.js 根本不提交实例，GTAO 也改不动它。
     花串是"每丛一个 InstancedMesh"（共 14 个），必须逐个处理，不能只认第一个。 */
  for (const m of [MAT.wisteria]){
    const list = seasonMeshCache.get(m);
    if (!list) continue;
    for (const o of list){
      if (!o.isInstancedMesh) continue;
      if (o.userData.fullCount === undefined) o.userData.fullCount = o.count;
      const n = p.wisteriaShow > 0.03 ? o.userData.fullCount : 0;
      if (o.count !== n) o.count = n;
    }
  }
}

/* 紫藤花串是**每丛一个 InstancedMesh**，不是整园共用一个：
   实测 14 个（实例数 508/697/702/…/4055）。
   ⚠️ 这里曾经只 find 了第一个并缓存成单个引用，结果冬季只清掉一丛，
   另外 13 丛照常开花 —— 画面看起来"紫藤冬天还在开花"。必须整组处理。 */
const seasonGLB = { LotusPlant: [], BananaPlant: [], Turtle: [] };
/* ⚠️ 不能"一旦非空就不再搜"。莲花 12 株是同一批挂上的没问题，但**乌龟有两批**：
   岸上晒背的 placeAssets 4 只 + 池中缓游的 loadAssetOnce 2 只 —— 先到的那批把数组填满后，
   后到的那批永远进不来，冬季 turtleShow=0 就只藏了一半。改为按对象去重地追加。 */
function collectSeasonGLB(){
  for (const name in seasonGLB){
    world.traverse(o => {
      if (o.isMesh && o.name === name && seasonGLB[name].indexOf(o) < 0) seasonGLB[name].push(o);
    });
  }
}
/* 季节存在性 + 平滑缩放（GLB 用缩放而不是二值开关：冬季 lotusShow=0 才真消失，
   中间值如芭蕉 0.12 会缩到很小而不是突兀地整片闪掉）。
   独立成函数是为了"资产一到就立即套用当前状态"，不必等下一次环境切换。 */
function applyGLBSeason(p){
  for (const name in seasonGLB){
    const key = name === 'LotusPlant' ? 'lotusShow' : name === 'BananaPlant' ? 'bananaShow' : 'turtleShow';
    const v = Math.max(0.001, p[key]);
    for (const o of seasonGLB[name]){
      o.visible = p[key] > 0.02;
      let root = o; while (root.parent && root.parent !== world) root = root.parent;
      /* 芭蕉（多年生草本）：缩放目标优先取 userData.crown（冠层组）——
         假茎宿存不缩，冬季冠层隐藏 = "枯株"而不是"整株消失" */
      const target = root.userData.crown || root;
      if (target.parent === world || target.parent === root){
        if (!target.userData.baseScale) target.userData.baseScale = target.scale.clone();
        target.scale.copy(target.userData.baseScale).multiplyScalar(v);
      }
    }
  }
}
function onAssetAttached(){
  collectSeasonGLB(); applyGLBSeason(ENV.cur);
  renderer.shadowMap.needsUpdate = true;   // 迟到资产含真投射物（晒背龟/芭蕉/莲），阴影图补渲一次
}
/* 柳叶是实例化网格：改 count 就能做连续的「落叶」。
   ⚠️ 必须覆盖**每一棵柳树的叶片实例**。原来只记住 traverse 到的最后一个 MAT.willow 实例
   （4 棵柳树 ×（柳条 + 柳叶）共 8 个组），冬季只把其中一棵的叶子收掉，另外三棵照旧满树绿叶。
   与紫藤同一个根因：**同材质的实例化网格有多个，不能只认一个**。
   只标记 lInst（叶）；柳条是枝，冬季本就还在，不缩放。 */
const willowLeafInsts = [];
world.traverse(o => { if (o.isInstancedMesh && o.userData.seasonWillowLeaf) willowLeafInsts.push({ o, max: o.count }); });
/* 竹叶季节叶量（2026-09-16）：与 willowLeaf 同构 —— 按 count 缩减要洗牌过才均匀，
   登记在 makeBamboo 的 seasonBambooLeaf 标记上（洗牌已在该处做）。 */
const bambooLeafInsts = [];
world.traverse(o => { if (o.isInstancedMesh && o.userData.seasonBambooLeaf) bambooLeafInsts.push({ o, max: o.count }); });

/* ══ 天气表现 · 一 · 积雪 ══
   把「雪」做成朝上表面的着色，而不是给地面换一张贴图：
   顶点着色器算世界坐标与世界法线，片元按 upness 混白，并用世界坐标采一层多层 FBM 做斑驳
   （用世界坐标而不是 uv —— 合并几何后 uv 是各构件自己的，拼在一起会露出接缝）。
   雪在标准 PBR 里着色（不改 emissive 之类），所以它照样接受阴影与雾，看上去才是"落在地上"的。
   ❗ 必须链式挂接 onBeforeCompile：叶/柳/苇已有风场注入，季节色调也在同一个钩子上。 */
const snowUniform = { value: 0 };
let windBaseApplied = 0;
const snowTintUniform = { value: new THREE.Color(0xF2F6FA) };
function installSnow(list){
  for (const m of list){
    if (!m || m.userData.snowInstalled) continue;
    m.userData.snowInstalled = true;
    const prevCB = m.onBeforeCompile, prevKey = m.customProgramCacheKey;
    m.onBeforeCompile = function (shader, renderer){
      if (prevCB) prevCB.call(this, shader, renderer);
      shader.uniforms.uSnowCover = snowUniform;
      shader.uniforms.uSnowTint  = snowTintUniform;
      // 逐材质：薄叶面用自己的加成，没有登记的材质为 0（= 完全走原来的朝上判据）
      shader.uniforms.uSnowBoost = (this.userData && this.userData.snowBoost)
                                 ? this.userData.snowBoost : { value: 0 };
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vSnowW;\nvarying vec3 vSnowN;')
        .replace('#include <begin_vertex>',
          '#include <begin_vertex>\n' +
          /* ⚠️ 这里原来用 normalMatrix —— 那是**视空间**法线，片元里却拿 vSnowN.y 当"朝上程度"。
             后果：一块不动的屋面，相机仰角一变积雪判定就变（同一朝上面在三种仰角下
             vSnowN.y = 0.999 / 0.707 / 0.100）—— 雪会跟着相机走。
             改用世界空间法线（模型矩阵 × 实例矩阵）；非均匀缩放下仍非严格逆转置，
             但归一化之后对"朝上程度"足够。 */
          '#ifdef USE_INSTANCING\n' +
          '  mat4 sM = modelMatrix * instanceMatrix;\n' +
          '  vec3 sN = mat3(modelMatrix) * mat3(instanceMatrix) * normal;\n' +
          '#else\n' +
          '  mat4 sM = modelMatrix;\n' +
          '  vec3 sN = mat3(modelMatrix) * normal;\n' +
          '#endif\n' +
          '  vSnowW = (sM * vec4(transformed, 1.0)).xyz;\n' +
          '  vSnowN = normalize(sN);');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>',
          '#include <common>\n' +
          'varying vec3 vSnowW;\n' +
          'varying vec3 vSnowN;\n' +
          'uniform float uSnowCover;\n' +
          'uniform vec3 uSnowTint;\n' +
          'uniform float uSnowBoost;\n' +
          'float snowHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }\n' +
          'float snowNoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);\n' +
          '  return mix(mix(snowHash(i), snowHash(i + vec2(1.0, 0.0)), u.x),\n' +
          '             mix(snowHash(i + vec2(0.0, 1.0)), snowHash(i + vec2(1.0, 1.0)), u.x), u.y); }')
        .replace('#include <color_fragment>',
          '#include <color_fragment>\n' +
          '  if (uSnowCover > 0.001){\n' +
          '    // 平摊的薄叶面（竹叶/芭蕉等）法线基本水平，upness≈0，光靠朝上程度挂不住雪；\n' +
          '    // 用 uSnowBoost 给这类材质放宽：把 upness 的下限抬到"只要不是朝下就认"\n' +
          '    float upness = smoothstep(0.30, 0.78, vSnowN.y) * (1.0 - uSnowBoost)\n' +
          '                 + smoothstep(-0.15, 0.45, vSnowN.y) * uSnowBoost;\n' +
          '    float dr = snowNoise(vSnowW.xz * 0.65) * 0.62 + snowNoise(vSnowW.xz * 2.7 + 13.1) * 0.28\n' +
          '             + snowNoise(vSnowW.xz * 7.3 + 41.7) * 0.10;\n' +
          /* 覆盖量：噪声给斑驳的边缘（不是均匀刷白），阈值随 uSnowBoost 下移 ——
             只放宽 upness 是不够的：dr 的均值约 0.5，在 smoothstep(0.24,0.80) 下只有 ~0.47 的权重，
             薄叶面的雪就一直是"隐约有点白"，撑不起"雪压竹叶"这一笔。 */
          '    float lo = mix(0.24, 0.03, uSnowBoost);\n' +
          '    float hi = mix(0.80, 0.52, uSnowBoost);\n' +
          '    float amt = smoothstep(lo, hi, dr) * upness * uSnowCover;\n' +
          '    amt *= 1.0 + 0.25 * uSnowBoost;\n' +
          '    diffuseColor.rgb = mix(diffuseColor.rgb, uSnowTint * (0.72 + 0.40 * dr), amt);\n' +
          '  }');
    };
    m.customProgramCacheKey = function (){ return (prevKey ? prevKey.call(this) : '') + '|snow'; };
  }
}
/* 湿地：只改材质参数，不动着色器 —— 粗糙度压下去，天空与树就会在石板上留下倒影。 */
let wetApplied = -1;
function applyWetness(v){
  // 每帧都会走到这里，但只有数值真的变了才写材质属性 —— 否则会一直把材质标脏
  if (Math.abs(v - wetApplied) < 0.004) return;
  wetApplied = v;
  wetUniform.value = v;
  for (const m of WET_MATS){
    if (!m || m.userData.dryRough === undefined) continue;
    m.roughness = m.userData.dryRough * (1 - 0.72 * v * v);   // 平方：小雨几乎无感，暴雨才成镜
    m.metalness = m.userData.dryMetal + 0.20 * v * v;         // 抬高反射率，否则只有高光变亮
  }
}

/* ══ 状态机与过渡 ══ */
const ENV = {
  time:'noon', season:'summer', weather:'clear',
  hour:12.5,                                   // 连续时辰（0~24）：按钮切时段只是对齐到锚点
  cur:null, from:null, to:null, t:1, dur:2.8,      // dur = 过渡时长（秒）
};
ENV.cur  = resolveEnv();          // 必须走组合规则：季节通道也要在参数集里
ENV.from = cloneParams(ENV.cur);
ENV.to   = cloneParams(ENV.cur);

function setEnv(axis, val){
  /* 先验后写 —— 这个函数挂在 window.__garden 上供外部驱动（采集脚本、控制台），
     一次 setEnv('time', undefined) 就会把 ENV.time 写成 undefined，画面卡住且每帧报错。
     合法的轴/值在这里一次性收口，非法调用直接忽略并留痕，状态机不被污染。 */
  /* ⚠️ 必须用 Object.hasOwn，不能靠 ENV_TIME[val] 的真值：继承来的键
     （constructor / toString / __proto__ …）都是真值，会被当成合法值写进 ENV，
     然后 resolveEnv 在 ENV_TIME['constructor'].label 上炸 ——
     实测 throw：Cannot read properties of undefined (reading 'saturation')，状态同时被污染。 */
  const table = axis === 'time' ? ENV_TIME
              : axis === 'season' ? ENV_SEASON
              : axis === 'weather' ? ENV_WEATHER : null;
  const legal = !!table && Object.hasOwn(table, val);
  if (!legal){
    console.warn('[ENV] 非法切换被忽略：', axis, '=', val);
    return;
  }
  if (ENV[axis] === val) return;
  ENV[axis] = val;
  if (axis === 'time') ENV.hour = TIME_ANCHORS[val];   // 时段按钮 = 把连续时辰对齐到锚点
  ENV.from = cloneParams(ENV.cur);      // 从「当前实际画面」出发，连点也不会跳
  ENV.to   = resolveEnv();
  ENV.t    = 0;
  enforceWeather();                     // 非法组合在这里就被打回，不留非法状态
  syncEnvUI();
}

/* 天气互斥：银装素裹只在冬季合法；非冬季若被置成它，自动降级回"风和日丽"。
   "狂风暴雨在冬季渲染为风雪"不是降级 —— 它是合法组合，由 effectiveWeather() 决定表现。 */
function weatherAllowed(weather){
  return weatherMutexReason(weather, ENV.season) === null;
}
/* 唯一的强制点。UI 置灰只是「提示」，不是「保证」：键盘、控制台、外部脚本都能绕过按钮，
   所以真正的降级必须发生在 setEnv 里 —— 否则会出现「夏季 + 银装素裹」这种非法状态留在画面上。 */
function enforceWeather(){
  if (weatherAllowed(ENV.weather)) return false;
  ENV.weather = 'clear';                                  // 降级目标：风和日丽
  /* ⚠️ 不要在这里瞬切（ENV.t = 1 + 立刻 applyEnv）。原来那样写，从"冬 + 银装素裹"
     切到春天会把画面**当场**换成风和日丽，2.8 秒过渡整段被跳过 —— 用户看到的是跳变。
     正确做法：先把目标归一化，再从当前画面平滑过渡过去。 */
  ENV.from = cloneParams(ENV.cur);
  ENV.to   = resolveEnv();
  ENV.t    = 0;
  return true;
}

const envEl = document.getElementById('env');
function syncEnvUI(){
  envEl.querySelectorAll('button').forEach(b=>{
    /* 动作按钮（明信片/音景）无 data-axis：不参与环境轴状态同步 ——
       否则 ENV[undefined]===undefined 恒真，它们初始就被错误点亮 .on 高亮 */
    if (!b.dataset.axis){ b.setAttribute('aria-pressed', 'false'); return; }
    const axis = b.dataset.axis, v = b.dataset.v;
    b.classList.toggle('on', ENV[axis] === v);
    /* aria-pressed（P1-8）：所有 env 按钮都是 toggle 语义，选中态对读屏可感知 */
    b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false');
    if (axis === 'weather'){
      const why = weatherMutexReason(v, ENV.season);
      b.disabled = !!why;
      b.title = why || '';                       // 悬停给出原因（原生 tooltip，零成本）
    }
  });
  /* 滑杆跟 ENV.hour 对齐（时段按钮把 hour 拉回锚点时，滑杆位置同步走） */
  const hs = document.getElementById('hourSlider');
  if (hs && Math.abs(parseFloat(hs.value) - ENV.hour) > 0.05){
    hs.value = ENV.hour;
    document.getElementById('hourReadout').textContent = fmtHour(ENV.hour);
  }
}
envEl.addEventListener('click', (e)=>{
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  /* 动作按钮（明信片/音景）没有 data-axis，先于环境轴处理，避免落进 setEnv 的非法告警 */
  if (b.dataset.act === 'shot'){ queuePostcard(); return; }
  if (b.dataset.act === 'sound'){ b.classList.toggle('on', toggleSound()); b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false'); return; }
  setEnv(b.dataset.axis, b.dataset.v);
  if (enforceWeather()) syncEnvUI();
});

/* ── 时辰滑杆 ──
   拖动 = 直接操纵时间轴：目标由「锚点插值 + 季节天气叠加」合成，从当前画面
   短过渡过去（0.45s 跟手）；松手把过渡节奏还给 2.8s 的默认值。 */
const hourSlider = document.getElementById('hourSlider');
hourSlider.addEventListener('input', ()=>{
  ENV.hour = parseFloat(hourSlider.value);
  document.getElementById('hourReadout').textContent = fmtHour(ENV.hour);
  ENV.from = cloneParams(ENV.cur);
  ENV.to   = composeEnv(paramsAtHour(ENV.hour));
  ENV.t = 0; ENV.dur = 0.45;
  ENV.time = nearestTimeKey(ENV.hour);     // 按钮高亮 / UI 主题跟随最近锚点
  syncEnvUI();
});
hourSlider.addEventListener('change', ()=>{ ENV.dur = 2.8; });
addEventListener('keydown', (e)=>{
  /* 别抢浏览器/编辑器快捷键：Ctrl+S、Cmd+R 之类必须原样放行；
     输入框里打字、输入法组合中、长按重复，也都不该切天气。 */
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || e.isComposing) return;
  const el = e.target;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
  if (e.key === '0' || e.key === 'Home'){ resetCamera(); return; }   // 视角复位
  if (e.key === 'p' || e.key === 'P'){ queuePostcard(); return; }     // 明信片
  if (e.key === 'm' || e.key === 'M'){                                // 音景开关（按钮态同步）
    const sb = envEl.querySelector('button[data-act="sound"]');
    if (sb) sb.classList.toggle('on', toggleSound());
    return;
  }
  const map  = { '1':'morning', '2':'noon', '3':'dusk', '4':'night' };
  const smap = { q:'spring', w:'summer', e:'autumn', r:'winter' };
  const wmap = { a:'clear', s:'storm', d:'overcast', f:'snow', g:'mist' };
  const hit = map[e.key] || smap[e.key.toLowerCase()] || wmap[e.key.toLowerCase()];
  if (!hit) return;
  if (map[e.key])  setEnv('time', hit);
  else if (smap[e.key.toLowerCase()]) setEnv('season', hit);
  else if (weatherAllowed(hit)) setEnv('weather', hit);      // 非法组合不走键盘这条捷径
  if (enforceWeather()) syncEnvUI();
});
syncEnvUI();
applyEnv(ENV.cur);
installSnow(SNOW_COVER_MATS);      // 必须在**首帧渲染之前**装上：注入才进得了编译好的程序

/* 薄叶面（竹叶、芭蕉叶）法线接近水平，如果按"朝上程度"判积雪，它们永远挂不住雪 ——
   而"雪压竹叶"恰恰是冬景里最该有的一笔。给这些材质一个逐材质加成：
   upness 的下限放宽到"只要不是明显朝下就算"，其余材质仍走原来的严格判据。 */
/* ⚠️ 竹叶用的是 **MAT.leaf**，这份加成原来只写给了竹竿/芭蕉/水草 ——
   于是"雪压竹叶"从来没生效过（叶材质既不在雪表里、也没有 boost）。 */
const SNOW_BOOST = new Map([[MAT.bambooA, 0.85], [MAT.bambooB, 0.85], [MAT.banana, 0.60],
                            [MAT.leaf, 0.70], [MAT.leafDeep, 0.55],
                            [MAT.willowLeaf, 0.55],
                            [MAT.reed, 0.45], [MAT.lily, 0.35], [MAT.lotus, 0.35],
                            [MAT.bark, 0.25], [MAT.trunk, 0.25]]);
for (const [mat, boost] of SNOW_BOOST){
  mat.userData.snowBoost = { value: boost };
}

/* ══ 天气表现 · 二 · 雨 / 雪 ══
   一套 GPU Points，两种精灵（雨=细长划痕，雪=柔和团），雨雪共用同一张图集与同一个着色器。
   粒子在 CPU 上逐帧推进：这比在着色器里按 uTime 反推落点更贵一点，但换来两件事 ——
   ① 风可以直接改速度（横着下的雨 / 斜飞的雪），② 起停、切档、换风向都不需要重建缓冲。
   位置是世界坐标，绕相机回收，所以"雨永远在看得见的地方"，也不会越飘越远。
   代价写在明处：约 1.4 万点 / 帧的 CPU 更新，只按档位调点数。 */
const PRECIP = (()=>{
  /* 雨/雪的精灵**完全在着色器里画**，不用贴图。
     先试过 canvas 图集，但那条路的 alpha 混合在这个管线上不生效：
     实测「取纹理 rgb」改动 15433 个像素，而「取纹理 a」只改动 14 个 —— 图集本身没问题
     （第 31 列雨条 alpha=249），说明是取 a 这条通路出了岔子。
     与其去追一个和纹理预乘/色彩空间有关的坑，不如按 gl_PointCoord 直接算形状：
     更稳、更省一张纹理，而且形状参数是活的（雨条长宽、雪花边缘都能单独调）。 */
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    blending: THREE.NormalBlending, side: THREE.DoubleSide,
    uniforms: { uSize:{ value: 15.0 }, uIntensity:{ value: 0.0 }, uStreak:{ value: 0.0 } },
    vertexShader: `attribute float aKind;
      attribute float aVariation;
      attribute float aSpeed;
      uniform float uSize;
      uniform float uIntensity;
      varying float vKind;
      varying float vAlpha;
      void main(){
        vKind = aKind;
        vAlpha = uIntensity;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        // 雨：天空里任何距离上都读得出来，所以给固定像素高（水平仍按透视收窄）
        // 雪：真的近大远小；aVariation 让每片雪花大小不一 ——
        //     大小一律相等时，雪在屏幕上会读成一层均匀的网点帘子，而不是雪
        float dist = max(-mv.z, 1.0);
        gl_PointSize = (aKind < 0.5) ? max(uSize, uSize * 26.0 / dist)
                                     : uSize * (26.0 / dist) * aVariation;
      }`,
    fragmentShader: `varying float vKind;
      varying float vAlpha;
      uniform float uStreak;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float a;
        if (vKind < 0.5){
          // 雨：一条竖划痕 —— 横向高斯收细，纵向淡入淡出
          float y = clamp(gl_PointCoord.y, 0.0, 1.0);
          float edge = smoothstep(0.0, 0.14, y) * smoothstep(1.0, 0.82, y);
          a = exp(-d.x * d.x * 46.0) * edge;
        } else {
          /* 雪：柔和圆片；**风大时横向拉成流线**。
             静雪与暴风雪如果都是一颗颗圆点，画面里两者就只剩"亮度差"，
             用户一眼分不出来（"冬季的狂风暴雨为啥还是银装素裹"）。
             风越大 → uStreak 越大 → 雪花沿风向被拉长，"风雪"才读得出风。 */
          vec2 ds = vec2(d.x / (1.0 + uStreak * 2.4), d.y);
          a = smoothstep(0.5, 0.05, length(ds));
        }
        a *= vAlpha;
        if (a < 0.004) discard;
        vec3 col = mix(vec3(0.80, 0.85, 0.92), vec3(1.0, 1.0, 1.0), step(0.5, vKind));
        gl_FragColor = vec4(col, a);
      }`,
  });
  const mk = (n, kind, size, strength, useMat) => {
    const geo = new THREE.BufferGeometry();
    const a = new Float32Array(n * 3), k = new Float32Array(n);
    const vr = new Float32Array(n), sp = new Float32Array(n);
    for (let i = 0; i < n; i++){
      k[i] = kind;
      vr[i] = 0.42 + Math.random() * 0.98;        // 尺寸倍率
      sp[i] = 0.55 + Math.random() * 0.95;        // 下落速度倍率（见 updatePrecip 的说明）
    }
    geo.setAttribute('position',   new THREE.BufferAttribute(a, 3));
    geo.setAttribute('aKind',      new THREE.BufferAttribute(k, 1));
    geo.setAttribute('aVariation', new THREE.BufferAttribute(vr, 1));
    geo.setAttribute('aSpeed',     new THREE.BufferAttribute(sp, 1));
    const p = new THREE.Points(geo, useMat);
    p.frustumCulled = false; p.visible = false; p.renderOrder = 20;
    /* spread 是体积半径。第一版给 20~23，在视高机位上等于把自己塞进一团浓雾里 ——
       雨雪在屏幕上的覆盖率一度到 44%，画面被糊住。放大到 ±34/±30 之后
       同样多的粒子摊在更大体积里，"密度"才落回天气该有的量级。 */
    return { points: p, arr: a, n, spread: kind < 0.5 ? 34 : 30, size, strength, seeded: false };
  };
  // 单颗的量级刻意压得很低：厚度靠数量堆，不靠单颗不透明度（否则近处几颗就糊住画面）
  /* ⚠️ 雨雪**必须各有一份 uniform**。原来是同一个材质实例，而 updatePrecip 是逐个 S
     先写雨、再写雪地设 uSize/uIntensity —— 两者同时可见的过渡帧里，后写的雪会把雨的
     uSize 覆盖成 30（雨本该是 9），雨被画成一颗颗大雪球。
     ShaderMaterial.clone() 会克隆 uniforms：材质实例分开、着色器源码仍共用。 */
  const snowMat = mat.clone();
  const rain = mk(GPU_TIER === 'low' ? 5000 : 14000, 0.0,  9.0, 0.115, mat);
  // 雪刻意比雨少：雨可以铺满画面，雪片一大就糊住视线
  const snow = mk(GPU_TIER === 'low' ? 1200 : 2400,   1.0, 30.0, 0.190, snowMat);
  return { mat, snowMat, rain, snow, list: [rain, snow] };
})();
scene.add(PRECIP.rain.points, PRECIP.snow.points);
/* 粒子体积**跟着相机平移**，而不是靠"越界就折返"来回收。
   折返有个致命缺口：用 setCamera 瞬移机位（采集脚本每次都这么干）之后，
   整团粒子还在旧位置，近处会是一片"没有雨也没有雪"的空白 —— 实测 eye 与 low 两个机位
   视野内点数是 0。改成把相机位移整体加到粒子上，体积永远罩住相机。 */
let _prevCamX = null, _prevCamZ = null;
function updatePrecip(dt, t){
  const p = ENV.cur;
  const rainOn = (p.rainAmount || 0) > 0.01;
  const snowOn = (p.snowAmount || 0) > 0.01;
  PRECIP.rain.points.visible = rainOn;
  PRECIP.snow.points.visible = snowOn;
  if (!rainOn && !snowOn) return;
  const cam = camera.position;
  const dcx = _prevCamX === null ? 0 : cam.x - _prevCamX;
  const dcz = _prevCamZ === null ? 0 : cam.z - _prevCamZ;
  _prevCamX = cam.x; _prevCamZ = cam.z;
  const wx = Math.sin(t * 0.11) * 0.6 + Math.sin(t * 0.043) * 0.4;
  for (const S of PRECIP.list){
    const on = S === PRECIP.rain ? rainOn : snowOn;
    if (!on) continue;
    const amt = S === PRECIP.rain ? p.rainAmount : p.snowAmount;
    const uu = S.points.material.uniforms;     // 雨/雪各写自己那份（见 PRECIP 内的说明）
    uu.uIntensity.value = S.strength * Math.min(1, 0.35 + amt * 0.85);
    uu.uSize.value = S.size;
    uu.uStreak.value = (S === PRECIP.rain) ? 0
      : Math.max(0, Math.min(1, ((p.windMul || 1) - 1.5) / 2.2));
    const a = S.arr, n = S.n, X = S.spread, YT = 22, YB = -1.2, DH = YT - YB;
    /* 只推进**实际提交渲染**的那部分粒子。原来不管强度多小都遍历整个数组
       （独显档 1.4 万点/帧），小雨/小雪时 95% 的运算是白做的 —— drawRange 之外的粒子
       本来就不提交。降到小雪时 CPU 的粒子开销随之下降。 */
    const active = Math.max(32, Math.round(n * Math.min(1, amt)));
    if (!S.seeded){                       // 首帧铺满体积，否则会看到"从天上掉下来"
      S.seeded = true;
      for (let i = 0; i < n; i++){
        a[i*3]   = cam.x + (Math.random() * 2 - 1) * X;
        a[i*3+1] = YB + Math.random() * DH;
        a[i*3+2] = cam.z + (Math.random() * 2 - 1) * X;
      }
    }
    const isRain = S === PRECIP.rain;
    /* 下落速度必须**逐粒子**给。
       原来 vy 是整个数组共用的一个常量，2400 片雪同速下降 → 初始化时均匀铺开的那层间距
       永远保持，整层像一张网一起往下挪，落到底同批一起回顶，循环加深成"一层一层掉"。
       x/z 一直有逐粒子扰动，唯独下落速度没有，这才是分层的根因。
       给每片雪 0.55~1.50 的速度倍率：快慢互相追越，任何整齐的层都会在几帧内散掉。 */
    const vy = isRain ? -(16 + amt * 8) : -(10 + amt * 6);
    const sp = S.points.geometry.attributes.aSpeed;
    const spArr = sp.array;
    const drift = p.windMul * (isRain ? 1.6 : 3.4);
    for (let i = 0; i < active; i++){
      const j = i * 3;
      // 雨不做那层"雪花飘摆"（原来是对雨恒乘 0 的表达式，白算）
      a[j]   += dcx + wx * drift * dt + (isRain ? 0.0 : Math.sin(t * 1.6 + i * 0.37) * 0.9 * dt);
      a[j+1] += vy * spArr[i] * dt;
      a[j+2] += dcz + Math.sin(t * 1.1 + i * 0.21) * drift * 0.5 * dt;
      // 落到底就回到顶；横向越界折返，保证体积始终罩住相机
      if (a[j+1] < YB){ a[j+1] = YT; a[j] = cam.x + (Math.random() * 2 - 1) * X; a[j+2] = cam.z + (Math.random() * 2 - 1) * X; }
      else if (a[j] - cam.x >  X) a[j] -= 2 * X;
      else if (cam.x - a[j] >  X) a[j] += 2 * X;
      if (a[j+2] - cam.z >  X) a[j+2] -= 2 * X;
      else if (cam.z - a[j+2] >  X) a[j+2] += 2 * X;
    }
    S.points.geometry.attributes.position.needsUpdate = true;
    S.points.geometry.setDrawRange(0, active);
  }
}

/* 雨打水面：复用鱼跃涟漪的池子，低频率地在池面随机点起圈。
   只有雨要，雪落在水里不出圈。 */
let rainRippleAt = 0;
function updateRainRipples(t){
  if ((ENV.cur.rainAmount || 0) < 0.05 || ENV.time === 'night') return;
  if (t < rainRippleAt) return;
  rainRippleAt = t + 0.55 + Math.random() * 0.45;   // 降为点缀：主体是水面整片雨点闪动
  const a = Math.random() * TAU, r = Math.sqrt(Math.random());
  spawnRipple(Math.cos(a) * 12.5 * r, 3.0 + Math.sin(a) * 6.4 * r, t, 2);
}

/* ══════════════════════════════════════════════════════════════
   11 · 循环与自适应
   ══════════════════════════════════════════════════════════════ */
/* r184 起 Clock 已弃用；Timer 的 connect(document) 还会挂 Page Visibility ——
   切后台自动挂起计时，回前台不会出现"一帧跳 40 秒"的 dt（原来靠钳制值硬兜）。 */
const timer = new THREE.Timer();
timer.connect(document);
const statsEl = document.getElementById('stats');
let acc = 0, frames = 0, fps = 0, sndAcc = 0;

function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
addEventListener('resize', onResize);

const _swimmerWorld = new THREE.Vector3();   // 鱼/龟起涟漪要世界坐标（holder 是 koiGroup 的子节点）

/* ══ 音景（程序化合成，零音频资产）══
   四层，全部 Web Audio 原语：
   · 风：低通白噪声（0.5× 回放压低频），音量跟风场（天气底值风 + 阵风包络）
   · 雨：带通白噪声（1.5kHz 中心），音量跟 rainAmount
   · 虫鸣：4.3kHz 三角波 × 11Hz 幅度调制 —— 经典的"蛐蛐"合成，仅夜间且无雨无大风
   · 鸟鸣：晨间随机短促上挑滑音（2~3 声一组），仅晨间且安静
   AudioContext 在第一次点"音景"时才创建（自动播放策略要求用户手势）。
   各层音量都压得很低 —— 环境音要的是"听得见才对"，不是"听得清"。 */
const Snd = (()=>{
  let ctx = null, master = null, rainG = null, windG = null;
  let cricketCarrier = null, cricketMod = null, cricketG = null;
  let on = false, birdNext = 0;
  function ensure(){
    if (ctx) return true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch { return false; }
    master = ctx.createGain(); master.gain.value = 0;
    master.connect(ctx.destination);
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const mkNoise = (rate, type, freq, q)=>{
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true; src.playbackRate.value = rate;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = 0;
      src.connect(f); f.connect(g); g.connect(master); src.start();
      return g;
    };
    windG = mkNoise(0.5, 'lowpass',  380, 0.50);
    rainG = mkNoise(1.0, 'bandpass', 1500, 0.55);
    /* 虫鸣：载波 × 幅度调制。调制振荡器接到 gain 口上（不是 setInterval），
       节拍永远贴着音频时钟走。modDepth 控制颤动深度，cricketG 整体闸门由 tick 拉起。 */
    cricketCarrier = ctx.createOscillator(); cricketCarrier.type = 'triangle';
    cricketCarrier.frequency.value = 4300;
    cricketMod = ctx.createOscillator(); cricketMod.type = 'sine'; cricketMod.frequency.value = 11;
    cricketG = ctx.createGain(); cricketG.gain.value = 0;
    const modDepth = ctx.createGain(); modDepth.gain.value = 0.011;
    cricketMod.connect(modDepth); modDepth.connect(cricketG.gain);
    cricketCarrier.connect(cricketG); cricketG.connect(master);
    cricketCarrier.start(); cricketMod.start();
    return true;
  }
  function chirp(){
    const t0 = ctx.currentTime + 0.02, n = 2 + ((Math.random() * 2) | 0);
    for (let i = 0; i < n; i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      const f0 = 2600 + Math.random() * 700, t = t0 + i * 0.16;
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * (1.25 + Math.random() * 0.2), t + 0.09);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 0.13);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.16);
    }
  }
  function tick(p){
    if (!on || !ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    const rain = p.rainAmount || 0;
    const wind = Math.min(1, Math.max(0, ((p.windMul || 1) - 1) * 0.30)
                        + WIND.uWindGlobal.value * 0.5 + WIND.uWindStrength.value * 0.35);
    rainG.gain.setTargetAtTime(rain * 0.14, now, 0.5);
    windG.gain.setTargetAtTime(0.015 + wind * 0.085, now, 0.6);
    const quiet = rain < 0.15 && (p.windMul || 1) < 2.2;
    cricketG.gain.setTargetAtTime((ENV.time === 'night' && quiet) ? 0.016 : 0, now, 1.2);
    if (ENV.time === 'morning' && quiet && performance.now() > birdNext){
      chirp();
      birdNext = performance.now() + 4000 + Math.random() * 9000;
    }
  }
  function toggle(){
    if (!ensure()) return false;
    on = !on;
    ctx.resume().catch(()=>{});          // 无手势环境可能拒绝 resume —— 静默即可，不抛错
    master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.25);
    return on;
  }
  return { toggle, tick, get on(){ return on; } };
})();
function toggleSound(){ return Snd.toggle(); }

/* ══ 明信片 ══
   渲染画布本来就不含 DOM 覆盖层（面板/统计都是 HTML 元素），无需隐藏界面。
   ⚠️ 画布没有 preserveDrawingBuffer：缓冲在合成后随时可能失底。
   所以 postcardData **先亲自渲一帧**再取像素 —— 任何时刻调用都保证新鲜，
   代价只是用户点按钮时多渲一帧（按需开销，可忽略）。 */
function queuePostcard(){ takePostcard(); }
function postcardData(){
  composer.render();                    // 亲自渲一帧：没有 preserveDrawingBuffer，缓冲必须现渲现取
  const src = renderer.domElement;
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g2 = c.getContext('2d');
  g2.drawImage(src, 0, 0);
  /* 题跋：左下「远 香 堂」+ 小字信息行，右下日期。衬线白字 + 软阴影，压得住任何背景 */
  const px = c.height / 45, pad = px * 1.4;
  g2.shadowColor = 'rgba(0,0,0,.55)'; g2.shadowBlur = px * 0.6;
  g2.fillStyle = '#f5f2ea';
  g2.font = `600 ${px * 1.6}px "Songti SC","SimSun","Noto Serif SC",serif`;
  g2.fillText('远 香 堂', pad, c.height - pad - px * 1.1);
  g2.font = `${px * 0.72}px "Songti SC","SimSun",serif`;
  g2.fillStyle = 'rgba(245,242,234,.92)';
  g2.fillText(`拙政园 · ${timeLabelNow()}${ENV_SEASON[ENV.season].label} · ${weatherTag()}`, pad, c.height - pad);
  const d = new Date();
  g2.textAlign = 'right';
  g2.fillText(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
               c.width - pad, c.height - pad);
  g2.textAlign = 'left';
  return c.toDataURL('image/png');
}
function takePostcard(){
  try {
    const a = document.createElement('a');
    a.download = `远香堂-${timeLabelNow()}-${ENV.season}-${ENV.weather}.png`;
    a.href = postcardData();
    a.click();
  } catch (e){ console.warn('[明信片] 生成失败：', e); }
}
function animate(){
  requestAnimationFrame(animate);
  timer.update();                        // 先 update，getDelta/getElapsed 同帧多次调用值不变
  const rawDt = timer.getDelta();        // 真实帧间隔 —— 统计必须用它
  const dt = Math.min(rawDt, 0.05);      // 仿真仍钳制（Timer 已挡后台跳变，这是双保险）
  const t = timer.getElapsed();

  // 风：推进时间并调度阵风（所有风材质共享 WIND 这组 uniform）
  WIND.uTime.value = t;
  updateWind(t);
  applyPresence(ENV.cur);      // 每帧重申存在性，否则会被 GTAO pass 的 visible 还原冲掉
  // 水面涟漪（法线缓慢漂移）
  // 环境时序：3 秒缓动过渡（从当前实际画面出发，连点也不会跳）
  if (ENV.t < 1){
    ENV.t = Math.min(1, ENV.t + dt / ENV.dur);
    const e = ENV.t < 0.5 ? 2*ENV.t*ENV.t : 1 - Math.pow(-2*ENV.t + 2, 2) / 2;
    mixInto(ENV.cur, ENV.from, ENV.to, e);
    applyEnv(ENV.cur);
    renderer.shadowMap.needsUpdate = true;   // 过渡中 sunPos/存在性逐帧在动，阴影跟渲
  }
  const rainNow = ENV.cur.rainAmount || 0;
  WIND.uRain.value = rainNow;                 // 雨打枝叶：与风无关的那部分抖动
  waterNormalTex.offset.x += dt * (0.014 + 0.22 * rainNow);
  waterNormalTex.offset.y += dt * (0.009 + 0.17 * rainNow);
  if (waterSurface){
    waterSurface.material.uniforms.uTime.value = t;
    waterSurface.material.uniforms.uRain.value = rainNow;
  }
  // 云层缓慢漂移（天空球只有一张材质）
  skyMesh.material.uniforms.uTime.value = t;

  // 锦鲤沿椭圆轨道游动（轨道经核算落在池内）
  const fishes = koiGroup.userData.fishes;
  for (const f of fishes){
    const d = f.userData;
    d.t += dt * d.speed * (ENV.cur.koiSpeed || 1);   // 季节：冬季迟缓
    const o = KOI_ORBITS[d.orbit];
    const j = d.jitter + Math.sin(t * 0.35 + d.phase) * 0.06;
    f.position.x = koiGroup.position.x + o.cx + Math.cos(d.t) * o.a * j;
    f.position.z = koiGroup.position.z + o.cz + Math.sin(d.t) * o.b * j;
    f.rotation.y = Math.atan2(-(o.b * Math.cos(d.t)), -(o.a * Math.sin(d.t)));
    f.rotation.z = Math.sin(t * 4 + d.phase) * 0.1;

    // 偶尔自深水区上浮，鱼背破水再沉回
    let lift = 0;
    if (!d.rising && t >= d.riseAt){ d.rising = true; d.riseT0 = t; }
    if (d.rising){
      const e = t - d.riseT0, rd = 2.8;
      if (e >= rd){
        d.rising = false;
        d.riseAt = t + 9 + Math.random() * 18;      // 每条鱼各自随机，不会同时跃水
      } else {
        lift = Math.sin(Math.PI * (e / rd)) * 0.11; // 上浮再沉回
      }
    }
    f.position.y = CFG.water - 0.06 + Math.sin(t * 1.6 + d.phase) * 0.02 + lift;
    /* ⚠️ 涟漪要由**破水与入水两次穿越**触发，不能"上浮到一半时来一圈"。
       原来只在 u≥0.5 触发一次，落回水里那一下是干的；而且鱼背的出水高度只有 ~0.12m，
       一圈乱起在"没看清它在干什么"的时刻，看起来就是凭空的圈。
       判据：**水面在 CFG.water+0.06（不是 CFG.water）**，用"鱼背高出水面"的符号变化判穿越。 */
    const emerged = f.position.y + (d.halfH || 0.12) - (CFG.water + 0.06);
    if (d.wasEmerged === undefined) d.wasEmerged = emerged > 0;
    if ((emerged > 0) !== d.wasEmerged){
      d.wasEmerged = emerged > 0;
      /* ⚠️ f.position 是 **koiGroup 的局部坐标**（koiGroup 自己在 z=+3），
         直接拿它当世界坐标会把涟漪起在鱼的南边 3 米 —— 鱼的位置公式里加过
         koiGroup.position，这里却忘了加，两个口径不一致。统一取世界坐标。 */
      f.getWorldPosition(_swimmerWorld);
      spawnRipple(_swimmerWorld.x, _swimmerWorld.z, t, 3);   // 出水一圈、入水再一圈
    }
  }
  updateRipples(t);
  updateRainRipples(t);
  updatePrecip(dt, t);

  /* 蜻蜓：游弋航迹 + 高频振翅。
     ⚠️ 季节/天气把它藏起来时（dragonflyShow=0：冬季、暴雨、风雪）不必再算航迹 —— 原来照算不误。 */
  for (const d of dragonflies){
    if (!d.visible) continue;
    const fl = d.userData.flight;
    const tt = t * fl.sp + fl.ph;
    d.position.set(
      fl.cx + Math.cos(tt) * fl.ax + Math.sin(tt * 2.7) * 0.9,
      fl.y0 + Math.sin(tt * 3.3 + 1.1) * 0.24,
      fl.cz + Math.sin(tt * 1.6) * fl.az + Math.cos(tt * 3.1) * 0.7
    );
    const dx = -Math.sin(tt) * fl.ax + Math.cos(tt * 2.7) * 2.43;
    const dz =  Math.cos(tt * 1.6) * fl.az * 1.6 - Math.sin(tt * 3.1) * 2.17;
    if (Math.abs(dx) + Math.abs(dz) > 0.01) d.rotation.y = Math.atan2(dx, dz);
    for (const w of d.userData.wings){
      w.rotation.z = w.userData.sx * Math.sin(t * 44 + w.userData.ph) * 0.55;
    }
  }

  // 乌龟缓游（同轨道，速度更慢）
  for (const tw of swimTurtles){
    const d = tw.userData;
    d.t += dt * d.speed * (ENV.cur.koiSpeed || 1);   // 季节：冬季迟缓
    const o = KOI_ORBITS[d.orbit];
    const j = d.jitter + Math.sin(t * 0.25 + d.phase) * 0.05;
    tw.position.x = koiGroup.position.x + o.cx + Math.cos(d.t) * o.a * j;
    tw.position.z = koiGroup.position.z + o.cz + Math.sin(d.t) * o.b * j;
    /* ⚠️ 吃水深度是量出来的：模型原点在**底面**（loadAssetOnce 把底部对齐到 y=0），
       而这只龟的"原点→壳顶" = 0.271m。原来的 -0.05 只把 18% 的身高压进水里，
       壳顶高出水面 0.18m —— 看起来是"趴在水面上滑行"。压到 0.12 后约 44% 没入水中。 */
    tw.position.y = CFG.water - 0.12 + Math.sin(t * 0.9 + d.phase) * 0.02;
    /* 乌龟是"壳贴着水面游"的（实测壳顶高出水面 0.15~0.20m），
       但原来一条尾迹都没有 —— 看起来像贴在水面上滑行。
       按自己的节奏留圈；季节把乌龟藏起来时（冬季 turtleShow=0）不要再留。 */
    if (tw.visible && t >= (d.wakeAt || 0)){
      spawnRipple(tw.position.x, tw.position.z, t, 2);
      d.wakeAt = t + 1.5 + Math.random() * 1.2;
    }
    tw.rotation.y = Math.atan2(-(o.b * Math.cos(d.t)), -(o.a * Math.sin(d.t)));
  }

  // 人物日程（第十四轮）：天气门禁 + 时段 + 散步缓行
  // ⚠️ 大事：**有效天气**取 effectiveWeather()（冬+storm=winterrain），不要只查 ENV.weather
  const effW = effectiveWeather();
  const goodWeather = effW !== 'storm' && effW !== 'snow' && effW !== 'winterrain';
  for (const f of figures){
    // 呼吸（衣袍微起伏）
    const b = Math.sin(t * 1.7 + f.userData.breathPhase) * 0.006;
    f.userData.robe.scale.set(1 + b, 1 + b * 0.45, 1 + b);
    // 时段门禁：晨读（7.5~12）/ 午茶（12~18）/ 夜步（18~23）；无时段 = 全天（旧样稿）
    const sl = f.userData.slot;
    let inSlot = !sl || (ENV.hour >= sl.h0 && ENV.hour < sl.h1);
    f.visible = goodWeather && inSlot;
    // 散步：沿游廊缓行（z0→z1 来回，速度 sp）
    if (sl && sl.stroll && f.visible){
      const s2 = sl.stroll;
      const ph = Math.sin(t * s2.sp * TAU * 2 + f.userData.breathPhase);
      f.position.z = s2.z0 + (0.5 + 0.5 * ph) * (s2.z1 - s2.z0);
      f.position.x = s2.a + (s2.b - s2.a) * 0.5 * (1 + Math.sin(t * s2.sp * TAU + 1.7));
    }
  }

  controls.update();
  renderer.info.reset();
  composer.render();

  /* 音景每 0.25 秒跟一次环境值（setTargetAtTime 自己会平滑，不需要每帧） */
  sndAcc += dt;
  if (sndAcc >= 0.25){ sndAcc = 0; Snd.tick(ENV.cur); }

  /* 统计（每 0.5 秒刷新一次，避免频繁写 DOM）
     ⚠️ 必须用 rawDt：用被钳到 50ms 的 dt 记账，真实 10fps 会被显示成 20fps ——
     右下角这个数字是性能判断的依据，不能是安慰剂。 */
  acc += rawDt; frames++;
  if (acc >= 0.5){
    fps = Math.round(frames / acc);
    const info = renderer.info;
    statsEl.textContent =
      `${fps} fps\n` +
      `draw calls  ${info.render.calls}\n` +
      `triangles   ${info.render.triangles.toLocaleString()}\n` +
      `geometries  ${info.memory.geometries}\n` +
      `textures    ${info.memory.textures}\n` +
      `${weatherTag()} · ${timeLabelNow()}${ENV_SEASON[ENV.season].label}\n` +
      `GPU ${GPU_TIER === 'low' ? '核显档' : '独显档'} · ${AO_ENABLED ? 'GTAO' : '无 AO'} · 超采样 ${SUPERSAMPLE}x\n` +
      `按 0 复位视角 · 拖动旋转 / 滚轮缩放`;
    acc = 0; frames = 0;
  }
}
animate();

// 首帧渲染完成后隐藏加载层
requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
    document.getElementById('loading').classList.add('done');
    bootMark('首帧');
    console.log('[启动分段] ' + BOOT.marks.map(([n, t]) => n + ' ' + t + 'ms').join(' → ') +
                ' ｜ 合计 ' + (performance.now() - BOOT.t0).toFixed(0) + 'ms' +
                (assetFailures ? ' ｜ 资产失败 ' + assetFailures + ' 个' : ''));
    console.log('[远香堂] 场景就绪', {
      GPU档位: GPU_TIER, 超采样: SUPERSAMPLE, GTAO: AO_ENABLED,
      meshes: registry.meshes,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
    });
  });
});

// 供外部检查使用（smoke 测试与采集脚本都从这里驱动）
window.__garden = { scene, camera, renderer, composer, controls, THREE, ENV, setEnv, applyEnv,
                  WIND, PRECIP, weatherAllowed, effectiveWeather, weatherMutexReason, resetCamera,
                  queuePostcard, postcardData, toggleSound, sndState: () => Snd.on };
</script>
</body>
</html>
