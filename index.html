<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苏州园林 · 拙政园远香堂对景</title>
<!-- 内联空图标：不然浏览器会去请求 /favicon.ico，采集脚本每次都记一条 404 噪声 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23DCD8CF'/><path d='M2 11h12v1H2z' fill='%233C444F'/></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#D8DCDA;
    font-family:"Songti SC","SimSun","Noto Serif SC",serif}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  /* UI 可读性：文字浮在"任意背景"上，只调字色永远不稳（正午雾色算出的 luminance 是 0.724，
     旧的 dark<0.10 判据几乎从不成立，于是永远是 34% 白底 + 深灰字 + 标签 opacity .66，
     压到亮绿草地上对比度只有 2.2:1）。解法是给面板一层**固定衬底**，
     再把文字压到接近黑、把 opacity 抬上来，让对比度由衬底兜底而不是由场景兜底。 */
  :root{--ui-fg:#121417;--ui-fg-dim:#26292e;--ui-fg-hint:#3a3e44;
        --ui-panel:rgba(246,246,243,.60);--ui-bg:rgba(255,255,255,.50);
        --ui-bd:rgba(40,40,40,.42);--ui-sh:0 1px 0 rgba(255,255,255,.75);
        --ui-on-bg:rgba(30,34,40,.92);--ui-on-fg:#ffffff}
  #hud{position:fixed;left:22px;top:20px;color:var(--ui-fg);pointer-events:none;
    text-shadow:var(--ui-sh);user-select:none;transition:color .6s}
  #hud h1{font-size:20px;font-weight:600;letter-spacing:.24em}
  #hud p{margin-top:6px;font-size:12px;letter-spacing:.1em;opacity:.85;
    text-shadow:var(--ui-sh),0 1px 3px rgba(0,0,0,.35)}
  #stats{position:fixed;right:16px;bottom:14px;font:11px/1.6 ui-monospace,Consolas,monospace;
    color:var(--ui-fg);opacity:.92;pointer-events:none;text-align:right;user-select:none;
    white-space:pre;transition:color .6s;
    text-shadow:0 1px 0 rgba(255,255,255,.8),0 1px 3px rgba(0,0,0,.35)}
  /* 环境控制面板（左下）。三行：时段 / 季节 / 天气（2-1 / 2-2 / 2-3 分别接入） */
  /* 天气文案比「春/夏」长，按钮内边距收窄、标签栏加宽，四颗仍在一行 */
  #env{position:fixed;left:22px;bottom:18px;display:flex;flex-direction:column;gap:7px;
    font-family:"Songti SC","SimSun","Noto Serif SC",serif;user-select:none;z-index:8;
    padding:10px 14px 10px 12px;border-radius:5px;
    background:var(--ui-panel);border:1px solid var(--ui-bd);
    backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.18);
    transition:background .6s,border-color .6s}
  #env .row{display:flex;align-items:center;gap:6px}
  #env .lbl{width:2.7em;font-size:12px;letter-spacing:.22em;color:var(--ui-fg);
    font-weight:600;text-shadow:var(--ui-sh);transition:color .6s}
  #env button{font:inherit;font-size:12.5px;letter-spacing:.06em;padding:4px 11px;
    border:1px solid var(--ui-bd);border-radius:3px;cursor:pointer;
    background:var(--ui-bg);color:var(--ui-fg);backdrop-filter:blur(4px);
    text-shadow:var(--ui-sh);transition:background .25s,color .25s,border-color .25s}
  #env button:hover:not(:disabled){filter:brightness(1.12)}
  #env button.on{background:var(--ui-on-bg);color:var(--ui-on-fg);text-shadow:none;
    border-color:var(--ui-on-bg);font-weight:600}
  /* 置灰也要读得出"这里有个按钮，但不可用"：只降到 .5，别降到 .28 直接消失 */
  #env button:disabled{opacity:.5;cursor:not-allowed;color:var(--ui-fg-dim)}
  #env .lbl{width:3.1em}
  #env button{padding:4px 8px;letter-spacing:.02em}
  #env .hint{font-size:10.5px;letter-spacing:.08em;color:var(--ui-fg-hint);opacity:.9;
    margin-left:2px;text-shadow:var(--ui-sh);font-weight:600}
  #env .row{flex-wrap:wrap}                    /* 第 5 颗天气按钮与时辰滑杆行在窄屏可换行 */
  #env input[type="range"]{width:150px;height:22px;accent-color:#3a5a4a;
    background:transparent;cursor:pointer;flex:0 1 auto}
  #env .hint#hourReadout{min-width:3.2em;font-variant-numeric:tabular-nums}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#D8DCDA;
    color:#4a4a4a;font-size:14px;letter-spacing:.34em;transition:opacity .7s;z-index:9}
  #loading.done{opacity:0;pointer-events:none}
  /* ── 移动端/窄屏（P1-8 专项）──
     触控设备：面板收进视口内（原 left:22px 会让面板右缘顶出 320px 屏外）、
     命中区加大（min-height:34px）、键盘提示隐藏（触控没有键盘，还给面板省宽度）。
     hourReadout 是时辰读数不是提示，单独恢复显示。stats 限宽防右侧溢出。 */
  @media (max-width:520px),(hover:none){
    #env{left:10px;right:10px;bottom:10px;padding:9px 10px;max-width:calc(100vw - 20px)}
    #env .lbl{width:auto;min-width:2.1em}
    #env button{min-height:40px;padding:8px 10px;font-size:12.5px}
    #env .hint{display:none}
    #env .hint#hourReadout{display:inline-block;min-width:3.2em}
    #env input[type="range"]{width:104px}
    /* 窄屏 env 面板横向铺满底部，会把右下 stats 盖住 —— stats 移到右上 */
    #stats{right:10px;top:10px;bottom:auto;font-size:10px;max-width:calc(100vw - 20px)}
    #hud{left:12px;top:10px}
    #hud h1{font-size:16px;letter-spacing:.2em}
    #hud p{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>远 香 堂</h1>
  <p>拙政园中区对景 · 程序化几何 + AI 生成资产</p>
</div>
<div id="stats"></div>
<div id="env">
  <div class="row">
    <span class="lbl">时段</span>
    <button data-axis="time" data-v="morning">晨</button>
    <button data-axis="time" data-v="noon">午</button>
    <button data-axis="time" data-v="dusk">暮</button>
    <button data-axis="time" data-v="night">夜</button>
    <span class="hint">1 2 3 4</span>
  </div>
  <div class="row">
    <span class="lbl">季节</span>
    <button data-axis="season" data-v="spring">春</button>
    <button data-axis="season" data-v="summer">夏</button>
    <button data-axis="season" data-v="autumn">秋</button>
    <button data-axis="season" data-v="winter">冬</button>
    <span class="hint">Q W E R</span>
  </div>
  <div class="row">
    <span class="lbl">天气</span>
    <button data-axis="weather" data-v="clear">风和日丽</button>
    <button data-axis="weather" data-v="storm">狂风暴雨</button>
    <button data-axis="weather" data-v="overcast">阴霾暗沉</button>
    <button data-axis="weather" data-v="snow">银装素裹</button>
    <button data-axis="weather" data-v="mist">薄雾烟霭</button>
    <span class="hint">A S D F G</span>
  </div>
  <div class="row">
    <span class="lbl">时辰</span>
    <input id="hourSlider" type="range" min="0" max="24" step="0.1" value="12.5" aria-label="连续时辰">
    <span class="hint" id="hourReadout">12:30</span>
  </div>
  <div class="row">
    <span class="lbl">留影</span>
    <button data-act="shot" aria-label="保存明信片">明信片</button>
    <button data-act="sound" aria-label="开关音景">音景</button>
    <span class="hint">P / M</span>
  </div>
</div>
<div id="loading">营 造 中 …</div>

<script type="module">
// three 与全部 addons 已用 esbuild 打包进同目录的 vendor.js（见 build-entry.js），
// 页面不依赖任何外部 CDN —— 大陆网络下 unpkg / jsDelivr 常不稳定
import { THREE, OrbitControls, EffectComposer, RenderPass, UnrealBloomPass,
         ShaderPass, OutputPass, GLTFLoader, Reflector, mergeGeometries,
         GTAOPass } from './vendor.js';

/* ── 启动失败态 ──
   审计 B14：加载层原来是"第 2 帧就无条件撤掉"，GLB 失败只 console.warn ——
   WebGL 不可用 / vendor.js 没加载成功 / 脚本异常时，用户看到的是**永远的"营造中"**
   或者一个半成品场景，没有任何可读信息，也没有重试入口。这里在模块最前面挂兜底。 */
function bootFail(msg){
  const el = document.getElementById('loading');
  if (!el) return;
  el.classList.remove('done');
  el.style.display = '';
  el.style.opacity = '1';
  el.innerHTML =
    '<div style="font:500 15px/1.7 system-ui, sans-serif;color:#f2efe6;'
    + 'background:rgba(18,22,28,.86);padding:18px 22px;border-radius:10px;'
    + 'max-width:min(600px,84vw);text-align:left">'
    + '<div style="font-size:17px;font-weight:600;margin-bottom:8px">场景没能启动</div>'
    + '<div style="opacity:.82;margin-bottom:10px">' + String(msg).slice(0, 300) + '</div>'
    + '<div style="opacity:.62;margin-bottom:14px">常见原因：WebGL 不可用 · vendor.js 没加载成功 · '
    + '用 file:// 直接打开（会被 CORS 拦）· 着色器编译失败</div>'
    + '<button id="boot-retry" style="font:inherit;padding:6px 14px;border-radius:6px;'
    + 'border:1px solid rgba(240,236,226,.5);background:rgba(240,236,226,.14);color:#f2efe6;cursor:pointer">重试</button>'
    + '</div>';
  const b = document.getElementById('boot-retry');
  if (b) b.addEventListener('click', () => location.reload());
}
addEventListener('error', (e) => { if (!window.__garden) bootFail(e.message || '脚本错误'); });
addEventListener('unhandledrejection', (e) => {
  if (!window.__garden) bootFail((e.reason && e.reason.message) || '未处理的 Promise 拒绝');
});
setTimeout(() => { if (!window.__garden) bootFail('初始化超时（15 秒仍未就绪）'); }, 15000);

/* ══════════════════════════════════════════════════════════════
   0 · 配置与工具
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  garden: { w: 60, d: 45 },        // 园林平面尺寸
  wall:   { h: 4.5, t: 0.6 },      // 粉墙高 / 厚
  water:  0,                       // 水面高度 Y
  sun:    { color: 0xfff6e2, intensity: 1.12, pos: [42, 56, 30] },
  amb:    { color: 0x8899aa, intensity: 0.50 },
  fog:    { color: 0xDCE0E2, density: 0.0052 },
};

// 可复现随机：保证每次刷新园林形态一致
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20260909);
const rr  = (a,b)=>a+rnd()*(b-a);
const pick= a=>a[(rnd()*a.length)|0];

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

// 统一登记：便于统计与批量设置阴影
const registry = { meshes: 0, geos: 0, mats: 0 };

/* ══════════════════════════════════════════════════════════════
   1 · 材质库（命名角色，全局复用）
   ══════════════════════════════════════════════════════════════ */
function makeRoofTileTex(){                      // 青灰筒瓦：筒瓦圆拱 + 板瓦底 + 岁月斑驳
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#3E4852'; g.fillRect(0, 0, S, S);
  const cols = 10, cw = S / cols;
  for (let i = 0; i < cols; i++){
    const x = i * cw;
    const grd = g.createLinearGradient(x, 0, x + cw, 0);
    grd.addColorStop(0.00, '#2E373F');
    grd.addColorStop(0.16, '#4E5862');
    grd.addColorStop(0.40, '#78838E');
    grd.addColorStop(0.56, '#8B96A1');
    grd.addColorStop(0.78, '#4A545E');
    grd.addColorStop(1.00, '#2A323A');
    g.fillStyle = grd; g.fillRect(x, 0, cw, S);
    g.fillStyle = 'rgba(18,24,30,.8)';           // 筒瓦之间的缝
    g.fillRect(x, 0, 2, S);
  }
  g.fillStyle = 'rgba(26,32,38,.32)';            // 横向瓦垄搭接
  for (let y = 0; y < S; y += 26) g.fillRect(0, y, S, 2);
  for (let i = 0; i < 1100; i++){                // 苔痕与风化
    g.fillStyle = `rgba(${(58 + rr(0,74))|0},${(70 + rr(0,80))|0},${(80 + rr(0,84))|0},.13)`;
    g.fillRect(rnd() * S, rnd() * S, rr(1, 3.2), rr(1, 3.2));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function makePavingTex(){                        // 青砖铺地：45° 斜向菱形拼花 + 磨损
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#BEBAB0'; g.fillRect(0, 0, S, S);   // 原 #DDD9D0 在 ACES 下会糊成纯白
  const n = 8, step = S / n;
  for (let y = 0; y < n; y++){
    for (let x = 0; x < n; x++){
      if (((x + y) & 1) === 0) continue;         // 黑白相间
      const cx = (x + 0.5) * step, cy = (y + 0.5) * step;
      const v = rr(-12, 12);                          // 逐砖色差，避免整片死板
      g.fillStyle = `rgb(${46+v|0},${49+v|0},${52+v|0})`;
      g.beginPath();
      g.moveTo(cx, cy - step * 0.5);
      g.lineTo(cx + step * 0.5, cy);
      g.lineTo(cx, cy + step * 0.5);
      g.lineTo(cx - step * 0.5, cy);
      g.closePath();
      g.fill();
    }
  }
  g.strokeStyle = 'rgba(128,124,116,.55)'; g.lineWidth = 2.0;   // 砖缝
  for (let i = 0; i <= n; i++){
    g.beginPath(); g.moveTo(i*step, 0); g.lineTo(i*step, S); g.stroke();
    g.beginPath(); g.moveTo(0, i*step); g.lineTo(S, i*step); g.stroke();
  }

  // 磨损：磨亮的、磨暗的、苔痕 —— 青砖经年本就深浅不一
  const wear = [
    ['rgba(150,148,140,0.16)', 26, 18, 54],
    ['rgba(96,98,88,0.14)',    20, 14, 42],
    ['rgba(88,110,72,0.10)',   12, 10, 30],
  ];
  for (const [col, cnt, rMin, rMax] of wear){
    g.fillStyle = col;
    for (let i = 0; i < cnt; i++){
      g.beginPath();
      g.ellipse(rnd()*S, rnd()*S, rr(rMin,rMax), rr(rMin,rMax)*rr(0.5,1), rnd()*Math.PI, 0, Math.PI*2);
      g.fill();
    }
  }
  for (let i = 0; i < 6000; i++){
    const v = rr(-18, 18);
    g.fillStyle = `rgba(${150+v|0},${147+v|0},${139+v|0},0.30)`;
    g.fillRect(rnd()*S, rnd()*S, rr(1,2.4), rr(1,2.4));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeGroundTex(){                        // 草地：多尺度变化（大色块 → 草簇 → 细叶）
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#6E9C42'; g.fillRect(0,0,512,512);

  // ① 大尺度色块：打破平铺重复感（受旱泛黄 / 湿润深绿 / 中绿 / 草尖高光）
  const blobs = [
    ['rgba(126,150,70,0.30)', 22, 46, 92],
    ['rgba(72,110,52,0.34)',  18, 40, 78],
    ['rgba(96,132,58,0.26)',  24, 34, 70],
    ['rgba(140,160,96,0.18)', 10, 26, 58],
  ];
  for (const [col, n, rMin, rMax] of blobs){
    g.fillStyle = col;
    for (let i = 0; i < n; i++){
      g.beginPath();
      g.ellipse(rnd()*512, rnd()*512, rr(rMin, rMax), rr(rMin, rMax)*rr(0.5,1.0), rnd()*Math.PI, 0, Math.PI*2);
      g.fill();
    }
  }

  // ② 中尺度草簇
  for (let i = 0; i < 900; i++){
    const v = rr(-24, 26);
    g.fillStyle = `rgba(${96+v|0},${138+v|0},${54+v|0},0.5)`;
    g.beginPath();
    g.arc(rnd()*512, rnd()*512, rr(2, 7), 0, Math.PI*2);
    g.fill();
  }

  // ③ 细叶（保留原有竖向笔触）
  for (let i = 0; i < 14000; i++){
    const v = rr(-30, 26);
    g.fillStyle = `rgba(${100+v|0},${146+v|0},${56+v|0},.5)`;
    g.fillRect(rnd()*512, rnd()*512, rr(1,2.4), rr(2,6));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makePondBedTex(){                       // 池底：淤泥 + 藻斑 + 卵石
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#4A4E3C'; g.fillRect(0, 0, S, S);          // 淤泥（不是黑）

  // 大尺度斑块：藻 / 深淤泥 / 沙洲
  const blobs = [
    ['rgba(78,96,54,0.40)',   26, 30, 80],
    ['rgba(56,60,44,0.34)',   20, 24, 64],
    ['rgba(108,108,90,0.26)', 18, 18, 48],
  ];
  for (const [col, n, rMin, rMax] of blobs){
    g.fillStyle = col;
    for (let i = 0; i < n; i++){
      g.beginPath();
      g.ellipse(rnd()*S, rnd()*S, rr(rMin,rMax), rr(rMin,rMax)*rr(0.5,1), rnd()*Math.PI, 0, TAU);
      g.fill();
    }
  }

  // 卵石：石子 + 顶部高光
  for (let i = 0; i < 760; i++){
    const px = rnd()*S, py = rnd()*S, r = rr(2.5, 9);
    const rot = rnd()*Math.PI, ry = r * rr(0.55, 0.95);
    const v = rr(-26, 30);
    g.fillStyle = `rgba(${122+v|0},${120+v|0},${104+v|0},${rr(0.35,0.8).toFixed(2)})`;
    g.beginPath(); g.ellipse(px, py, r, ry, rot, 0, TAU); g.fill();
    g.fillStyle = `rgba(${178+v|0},${174+v|0},${154+v|0},0.32)`;
    g.beginPath(); g.ellipse(px - r*0.2, py - ry*0.25, r*0.42, ry*0.36, rot, 0, TAU); g.fill();
  }

  // 细泥点
  for (let i = 0; i < 12000; i++){
    const v = rr(-16, 16);
    g.fillStyle = `rgba(${74+v|0},${78+v|0},${60+v|0},0.35)`;
    g.fillRect(rnd()*S, rnd()*S, rr(1,2.2), rr(1,2.2));
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makePlaqueTex(text, vertical = false){  // 匾额 / 对联
  const W = vertical ? 160 : 640, H = vertical ? 640 : 190;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#14110D'; g.fillRect(0,0,W,H);
  g.strokeStyle = '#B8912F'; g.lineWidth = 7; g.strokeRect(11,11,W-22,H-22);
  g.strokeStyle = 'rgba(184,145,47,.35)'; g.lineWidth = 2; g.strokeRect(21,21,W-42,H-42);
  g.fillStyle = '#E7C868';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(231,200,104,.55)'; g.shadowBlur = 16;
  if (vertical){
    const chars = [...text];
    const step = (H - 70) / chars.length;
    g.font = 'bold 88px "KaiTi","STKaiti","SimSun",serif';
    chars.forEach((ch,i)=> g.fillText(ch, W/2, 46 + step*(i+0.5)));
  } else {
    g.font = 'bold 104px "KaiTi","STKaiti","SimSun",serif';
    const chars = [...text].join(' ');
    g.fillText(chars, W/2, H/2 + 6);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeInkWashTex(){                        // 水墨山水（屏风背景）
  const W = 512, H = 384;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#EDE6D6'; g.fillRect(0, 0, W, H);          // 宣纸底
  const hill = (baseY, amp, alpha, col)=>{                   // 远山淡墨
    g.fillStyle = col; g.globalAlpha = alpha;
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 14){
      g.lineTo(x, baseY + Math.sin(x * 0.011 + baseY) * amp + Math.sin(x * 0.031) * amp * 0.45);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
  };
  hill(H * 0.60, 26, 0.14, '#5A6470');
  hill(H * 0.71, 34, 0.22, '#4A545F');
  hill(H * 0.83, 20, 0.32, '#3A444E');
  // 一轮红日：外圈朱红晕染，内圈实心
  {
    const sx = W * 0.70, sy = H * 0.26, sr = H * 0.085;
    const halo = g.createRadialGradient(sx, sy, sr * 0.85, sx, sy, sr * 3.0);
    halo.addColorStop(0.0, 'rgba(184,55,42,.38)');
    halo.addColorStop(0.45, 'rgba(184,55,42,.12)');
    halo.addColorStop(1.0, 'rgba(184,55,42,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(sx, sy, sr * 3.0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(178,48,36,.92)';
    g.beginPath(); g.arc(sx, sy, sr, 0, TAU); g.fill();
  }
  g.globalAlpha = 0.10; g.fillStyle = '#6A7A88';             // 水面留白
  g.fillRect(0, H * 0.9, W, H * 0.1);
  g.globalAlpha = 0.5; g.fillStyle = '#3A342C';              // 一叶小舟
  g.beginPath(); g.ellipse(W * 0.62, H * 0.9, 26, 6, 0, 0, TAU); g.fill();
  g.globalAlpha = 0.42; g.strokeStyle = '#2E3A32'; g.lineWidth = 2;  // 松枝
  g.beginPath(); g.moveTo(W * 0.14, H * 0.86);
  g.quadraticCurveTo(W * 0.2, H * 0.66, W * 0.28, H * 0.6); g.stroke();
  for (let i = 0; i < 14; i++){
    const t = i / 14;
    const bx = W * (0.14 + 0.14 * t), by = H * (0.86 - 0.26 * t);
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + rr(-16, 16), by - rr(8, 22)); g.stroke();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#A8352A'; g.fillRect(W - 76, H - 76, 44, 44);   // 印章
  g.fillStyle = '#EDE6D6'; g.font = 'bold 24px "KaiTi","SimSun",serif'; g.textAlign = 'center';
  g.fillText('園', W - 54, H - 44);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeRockHoleTex(){                       // 太湖石表面：细腻斑驳石质（孔洞由几何挖凹实现）
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#A8A69E'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 3400; i++){                 // 石质斑驳
    g.fillStyle = `rgba(${(140 + rr(0,60))|0},${(140 + rr(0,60))|0},${(134 + rr(0,56))|0},.28)`;
    g.fillRect(rnd() * S, rnd() * S, rr(1, 3.5), rr(1, 3.5));
  }
  g.strokeStyle = 'rgba(118,118,112,.22)'; g.lineWidth = 1.4;   // 淡淡石纹
  for (let i = 0; i < 28; i++){
    const x0 = rnd() * S, y0 = rnd() * S;
    g.beginPath(); g.moveTo(x0, y0);
    g.bezierCurveTo(x0 + rr(-40,40), y0 + rr(-30,30), x0 + rr(-60,60), y0 + rr(-50,50),
                    x0 + rr(-90,90), y0 + rr(-70,70));
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeWaterNormalTex(){                   // 水波法线（正弦叠加，供水面细碎反射）
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const nx = Math.sin(x*0.11 + y*0.03)*0.55 + Math.sin(x*0.041 - y*0.067)*0.45;
      const ny = Math.cos(y*0.13 - x*0.02)*0.55 + Math.cos(y*0.05 + x*0.07)*0.45;
      const i = (y*S + x)*4;
      img.data[i]   = 128 + nx*46;
      img.data[i+1] = 128 + ny*46;
      img.data[i+2] = 250;
      img.data[i+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const roofTileTex = makeRoofTileTex();

/* 由贴图的明度当高度场，用 Sobel 差分生成法线贴图，让平涂材质产生凹凸立体感 */
function makeNormalMapFrom(srcTex, strength = 2.0){
  const src = srcTex.image;                    // CanvasTexture 的 image 就是 canvas
  const W = src.width, H = src.height;
  const sd = src.getContext('2d').getImageData(0, 0, W, H).data;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const octx = out.getContext('2d');
  const od = octx.createImageData(W, H);
  const lum = (x, y)=>{
    const i = (((y + H) % H) * W + ((x + W) % W)) * 4;
    return (sd[i] * 0.299 + sd[i+1] * 0.587 + sd[i+2] * 0.114) / 255;
  };
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const dx = (lum(x+1, y) - lum(x-1, y)) * strength;
      const dy = (lum(x, y+1) - lum(x, y-1)) * strength;
      let nx = -dx, ny = -dy, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      const i = (y * W + x) * 4;
      od.data[i]   = (nx / len * 0.5 + 0.5) * 255;
      od.data[i+1] = (ny / len * 0.5 + 0.5) * 255;
      od.data[i+2] = (nz / len * 0.5 + 0.5) * 255;
      od.data[i+3] = 255;
    }
  }
  octx.putImageData(od, 0, 0);
  const t = new THREE.CanvasTexture(out);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;                                     // 法线贴图是数据贴图，保持线性色彩空间
}
const roofNormalTex  = makeNormalMapFrom(roofTileTex, 2.6);
const pavingNormalTex = makeNormalMapFrom(pavingTex, 1.6);
const groundTex   = makeGroundTex();
const waterNormalTex = makeWaterNormalTex();
waterNormalTex.repeat.set(18, 18);

/* 池水着色：采样镜像反射 + 法线扰动 UV + 菲涅尔混合深水色。
   注意不加 tonemapping/colorspace 宏 —— 色调映射统一交给后处理链末端的 OutputPass，
   否则水面会被二次映射而与环境色不一致 */
/* 柳叶帘幕贴图（2026-09-15 柳树重塑）：竖条带 —— 一根微弯细茎 + 沿茎密生的
   窄小柳叶（左右互生、沿茎下指）。canvas 顶部 = 贴图 v=1 = 飘带挂点端 → 偏深；
   梢端偏亮。instanceColor 再叠加内外层次。alphaTest 硬裁边：无透明排序问题。 */
function makeWillowCurtainTex(){
  const W = 128, H = 560;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, W, H);
  const rnd2 = mulberry32(20260916);        // 固定种子：贴图每次一致
  // 茎：中央微弯竖线（v=1 顶在 canvas 顶部）
  c.strokeStyle = 'rgba(122,124,82,0.95)'; c.lineWidth = 3;
  c.beginPath();
  let sx = W / 2;
  c.moveTo(sx, 4);
  for (let y = 4; y <= H - 4; y += 14){
    sx = W / 2 + Math.sin(y * 0.022) * 5;
    c.lineTo(sx, y);
  }
  c.stroke();
  /* 叶：左右互生、窄披针形。叶距带抖动（步长 8~16px 随机），越往梢端越稀
     （真实柳穗上密下疏）；色相顶深梢亮、逐叶 ±8% 明度与色相噪声 ——
     首版被验收判"等距串珠+整树一个色"，这两处是主因。 */
  let y = 10;
  let row = 0;
  while (y < H - 6){
    const tt = y / H;                              // 0=挂点端 → 1=梢端
    const g = 1 - tt;
    const lr = row % 2 === 0 ? 1 : -1;
    row++;
    y += 8 + rnd2() * 8 + tt * 6;                   // 步长随梢端渐大 = 密度渐疏
    if (rnd2() < tt * 0.30) continue;              // 梢端随机跳叶
    const L = (13 + rnd2() * 13) * (1.05 - tt * 0.22);
    const Wd = 3.4 + rnd2() * 1.8;
    const cx = W / 2 + Math.sin(y * 0.022) * 5 + lr * 3;
    const li = 0.90 + rnd2() * 0.18;
    /* 第十二轮：整贴图提亮+绿移 —— 旧顶部 (158,128,116) 枯褐调挂上枝后整帘读作
       "墨绿近黑"（三轮验收同一结论）。现顶部 (158,182,116) 中性黄绿、
       梢端 (128,212,116) 亮黄绿，配合材质底色 ×1.3 春芽提亮 */
    const rC = Math.round((128 + 30 * g) * li);
    const gC = Math.round((170 - 12 * g) * li);
    const bC = Math.round((92 + 24 * g) * li);
    c.save();
    c.translate(cx, y);
    c.rotate(lr * (0.95 + (rnd2() - 0.5) * 0.5));
    c.fillStyle = `rgb(${rC},${gC},${bC})`;
    c.beginPath();
    c.ellipse(lr * L * 0.45, 0, L * 0.62, Wd * 0.5, 0, 0, TAU);
    c.fill();
    c.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

const WATER_REFLECT_SHADER = {
  uniforms: {
    color:         { value: null },       // Reflector 会用 options.color 覆盖
    tDiffuse:      { value: null },       // 反射贴图
    textureMatrix: { value: null },
    tNormal:       { value: waterNormalTex },
    uTime:         { value: 0 },
    uCenter:       { value: new THREE.Vector2(0, 3.0) },   // 池心（世界 XZ）
    uPondAx:       { value: 15.7 },                         // 近似椭圆池形
    uPondAz:       { value: 9.4 },
    uAbsorb:       { value: new THREE.Vector3(0.85, 0.38, 0.28) },  // 红先被吸收 → 深水偏青
    uShallow:      { value: 0.95 },
    uDeep:         { value: 1.80 },
    uSkyTop:       { value: new THREE.Color(0xA8BDD4) },   // 低档位用：天空双色近似反射
    uSkyHorizon:   { value: new THREE.Color(0xE6E2D8) },
    uReflMix:      { value: 1.0 },                          // 1=真实平面反射，0=天空近似
    uRain:         { value: 0.0 },                          // 降雨强度（0=不改变水面）
  },
  vertexShader: `
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec3 vWorld;
    void main(){
      vUv = textureMatrix * vec4(position, 1.0);
      vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform sampler2D tNormal;
    uniform float uTime;
    uniform vec2  uCenter;
    uniform float uPondAx, uPondAz, uShallow, uDeep;
    uniform vec3  uAbsorb;
    uniform vec3  uSkyTop, uSkyHorizon;
    uniform float uReflMix;
    uniform float uRain;
    varying vec4 vUv;
    varying vec3 vWorld;
    void main(){
      vec3 nrm = texture2D(tNormal, vWorld.xz * 0.055 + vec2(uTime * 0.013, uTime * 0.009)).xyz * 2.0 - 1.0;
      /* 雨点打水：只靠几十个涟漪环是看不出"整片池子在挨雨"的。
         这里给法线叠一层高频扰动（靠时间推进 + 两套不同频率的缩放），
         池面会整片细碎地闪动起来 —— 这才是大雨落在水上的样子。 */
      if (uRain > 0.001){
        vec3 rp1 = texture2D(tNormal, vWorld.xz * 0.55 + vec2(uTime * 0.30, -uTime * 0.23)).xyz * 2.0 - 1.0;
        vec3 rp2 = texture2D(tNormal, vWorld.xz * 0.92 - vec2(uTime * 0.41, uTime * 0.34)).xyz * 2.0 - 1.0;
        nrm.xz += (rp1.xz + rp2.xz) * (0.42 * uRain);
      }
      nrm = normalize(vec3(nrm.x * 0.55, 0.86, nrm.y * 0.55));
      vec3 V = normalize(cameraPosition - vWorld);
      float fres = pow(1.0 - clamp(dot(V, nrm), 0.0, 1.0), 2.2);
      fres = clamp(0.05 + fres * 1.12, 0.0, 0.90);
      /* 水面折射：原来只是把反射采样偏移一个固定量（0.045），
         那只做出"水在晃"，做不出"透过水看到的池底被水面掰弯"。
         折射的强弱本质取决于**视线与水面的夹角**：越接近斜掠越明显。
         这里按 1-cos(入射角) 收紧偏移量 —— 低头俯视时几乎不变形（看得清池底），
         平视池面时明显变形（水下扭曲）。偏移量压着 0.11 以内，
         避免把反射拉花成一片糊。 */
      float cosI = clamp(dot(V, nrm), 0.0, 1.0);
      vec4 uv = vUv;
      uv.xy += nrm.xz * uv.w * (0.045 + 0.065 * (1.0 - cosI));
      vec3 refl = texture2DProj(tDiffuse, uv).rgb;
      /* 低档位（核显）不走真实平面反射：Reflector 每帧要把整个场景再渲一遍，
         实测核显上关掉它 33fps → 59fps。这里用天空双色按视线方向近似反射 ——
         水面仍有法线扰动、菲涅尔与水深吸收，只是反射来自天空而非镜像渲染。 */
      // 压暗一档：真实水面反射的是天空 + 建筑 + 树（暗），直接用天空色会显得像雾
      vec3 skyFake = mix(uSkyHorizon * 0.74, uSkyTop * 0.88, clamp(-V.y, 0.0, 1.0));
      refl = mix(skyFake, refl, uReflMix);

      // 水体吸收：水柱越厚、视线越斜 → 光程越长 → 越不透明、越偏青。
      // 这一步是「看得见水下」与「深不见底」的分界；靠一个固定 alpha 是做不出来的。
      vec2 lp = vWorld.xz - uCenter;
      float pu = length(vec2(lp.x / uPondAx, lp.y / uPondAz));
      float depth = uShallow + (uDeep - uShallow) * sqrt(max(0.0, 1.0 - pu * pu));
      /* ⚠️ 这里原来是 clamp(dot(-V, up), 0.10, 1.0) —— **符号反了**。
         V 是"从水面指向相机"，俯视时 V≈+y，dot(-V,up) = −1 → 被 clamp 到 0.10；
         斜掠时 dot(-V,up)≈0 → 也被 clamp 到 0.10。也就是说**任何视角 cosT 都等于 0.10**，
         光程 depth/0.1 = 18 倍 → 吸收项 exp(−0.38×18) ≈ 0 → alpha 顶到 0.92~0.97，
         池面永远不透明，只剩固定的 base color(0x1C2E29) —— 看起来就是一块黑板。
         实测（正俯视取像素）：池水 RGB ≈ (30,48,46)，与 base color 几乎一致，池底完全没透出来。
         物理上光程 = depth / |cos(视线与法线夹角)|，所以取绝对值。 */
      float cosT = clamp(abs(dot(V, vec3(0.0, 1.0, 0.0))), 0.10, 1.0);
      vec3 absorb = exp(-uAbsorb * (depth / cosT));
      float body = clamp(1.0 - absorb.g, 0.06, 0.92);

      vec3 col = mix(color, refl, fres);
      float alpha = mix(body, 0.97, fres);
      gl_FragColor = vec4(col, alpha);
    }`,
};
let waterSurface = null;
/* 辅助 pass（GTAO 的法线/深度）期间：不刷新平面反射、不重渲阴影 —— 见 GTAO wrapper 处的说明 */

/* 启动分段计时：init 要 3~4 秒，只看"卡"没用，得能说出时间花在哪一段（审计 P04）。

/* ── 天气材质登记表 ──
   积雪（snowCover）：只登记「雪真的会积在上面」的实体面 —— 地面 / 铺地 / 石 / 砖 / 木 /
   屋面 / 植被。刻意不含水面、池底、天空、远景山、窗纸 —— 雪落在水里不会白，落在远景山上
   会变成一片白剪影，两个都是明显的假。
   湿地（wetness）：粗糙度 → 变光、metalness 略微上抬，让天空与树在石板上留下反射。 */
const SNOW_COVER_MATS = [
  MAT.grass, MAT.reed, MAT.lily, MAT.lotus, MAT.wisteria, MAT.banana,
  MAT.wall, MAT.wallCap, MAT.roof, MAT.ridge,
  MAT.wood, MAT.woodDark, MAT.woodRed,
  MAT.stone, MAT.stoneDark, MAT.marble, MAT.rock, MAT.rockDark,
  MAT.rockSmooth, MAT.rockSmoothDark, MAT.taihu, MAT.taihuDark,
  MAT.riverStone, MAT.bark, MAT.trunk,
];
const WET_MATS = [MAT.grass, MAT.wall, MAT.wallCap, MAT.roof, MAT.ridge,
                  MAT.stone, MAT.stoneDark, MAT.marble, MAT.riverStone,
                  MAT.rockSmooth, MAT.rockSmoothDark, MAT.taihu, MAT.taihuDark,
                  MAT.wood, MAT.woodDark, MAT.woodRed];
for (const m of WET_MATS){ m.userData.dryRough = m.roughness; m.userData.dryMetal = m.metalness; }
/* ── 天气角色登记 ──
   SNOW_COVER_MATS / WET_MATS 是**手工维护的数组**，材质必须在创建时登记：
   雪在 installSnow(SNOW_COVER_MATS) 时被链式注入，湿地的 dryRough 也在那一刻记录，
   事后再 push 进去的材质既不会被注入雪、也拿不到 dryRough（applyWetness 按列表遍历）。
   ⚠️ 实测：地面用 MAT.grass.clone()、铺地是独立材质，两者都不在表里 ——
   于是**最大的一块可见面（草地）与主步道既不积雪也不打湿**。 */
function registerWeatherRoles(mat, { snow = 0, wet = 0 } = {}){
  if (snow && SNOW_COVER_MATS.indexOf(mat) < 0) SNOW_COVER_MATS.push(mat);
  if (wet && WET_MATS.indexOf(mat) < 0){
    WET_MATS.push(mat);
    mat.userData.dryRough = mat.roughness;
    mat.userData.dryMetal = mat.metalness;
  }
  return mat;
}
// 竹叶用的是 MAT.leaf，而薄叶面的积雪加成原来只写给了竹竿材质 —— 叶材质本身也要进雪表
registerWeatherRoles(MAT.leaf,     { snow: 1 });

/* 风摆动：注入顶点位移，用于竹叶 / 柳条 / 水草（风场与调度见 addWind / updateWind） */
/* ── 风场 ──
   一场阵风以一个风源（柳树）为中心，强度随到风源的距离衰减。
   相位取顶点的世界坐标，所以邻近枝叶同步摆、远处的不同步 —— 看起来才像风在"走"。
   所有风材质共享同一组 uniform 对象，每帧只需更新一次 */
const WIND = {
  uTime:         { value: 0 },
  uWindOrigin:   { value: new THREE.Vector3(0, -999, 0) },
  uWindRadius:   { value: 17.0 },
  uWindStrength: { value: 0.0 },      // 局部阵风强度（按风源平方衰减）
  uWindGlobal:   { value: 0.0 },      // **全园均匀**的天气底值风：不乘衰减
  uWindPhase:    { value: 0.0 },
  uRain:         { value: 0.0 },      // 降雨强度：雨点砸在叶片上也会让枝叶抖，与风无关
};
const willowOrigins = [];             // 由柳树摆放处登记，作为风源候选

/* 风摆权重按材质分两种模式 —— 这是之前的 bug 所在：
   柳条几何是从 y=0 向下垂到 y=-1 的，若统一用 max(position.y,0) 加权，
   柳条与柳叶的权重恒为 0，风再大也不动。
   · base  ：以基部为支点，越高摆得越厉害（竹叶、水草）
   · crown ：以树冠为支点，**越低**摆得越厉害（垂柳的枝条与叶片都是垂挂的） */
function addWind(mat, amp = 0.09, speed = 1.4, mode = 'base', crownY = 5.2){
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, WIND);
    mat.userData.shader = shader;
    const wExpr = (mode === 'crown')
      ? `clamp((${crownY.toFixed(1)} - wPos.y) / 2.5, 0.0, 1.6)`
      : `clamp(position.y, 0.0, 1.6)`;
    shader.vertexShader = `
      uniform float uTime;
      uniform vec3  uWindOrigin;
      uniform float uWindRadius;
      uniform float uWindStrength;
      uniform float uWindGlobal;
      uniform float uWindPhase;
      uniform float uRain;
      /* 相位 hash：three r184 未内置 hash，自声明（与项目 snowHash 同型） */
      float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    ` + shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       #ifdef USE_INSTANCING
         vec3 wPos = (modelMatrix * instanceMatrix * vec4(position, 1.0)).xyz;
       #else
         vec3 wPos = (modelMatrix * vec4(position, 1.0)).xyz;
       #endif
       float wFall = max(0.0, 1.0 - distance(wPos, uWindOrigin) / uWindRadius);
       /* 天气底值风是**独立一项**，不能塞进 uWindStrength：底值风没有风源，
          一旦乘上 wFall（风源挂在柳树上，或退化成 (0,-999,0) 的哨兵）就被衰减成 0。
          实测暴风时 wFall 在池中/竹林/柳树三处**全是 0**，有效风 = 0 ——
          表现就是"狂风暴雨里一片叶子都不动"。只有阵风该按距离衰减。 */
       float gust  = uWindGlobal + uWindStrength * wFall * wFall;
       /* 相位去同步（第十六轮修复"轮胎旋转"）：
          旧公式 X 用 sin、Z 用 cos、共用同一个 ph —— 整树相位几乎一致，
          在 (x,z) 平面合成椭圆轨道，狂风里像轮胎在同步打转（用户实测）。
          现在用世界坐标的 hash 给**每片叶/条一个独立相位**，邻片不同步；
          X/Z 各用不同的相位偏移与频率，破坏圆形轨道；
          再叠一个随时间的慢变风向角 aDir，造成"一阵往东一阵往西"的真实乱风。 */
       float h1 = hash21(wPos.xz * 3.7);
       float hx = wPos.x * 0.42 + wPos.z * 0.19 + uWindPhase + h1 * 6.28;
       float hz = wPos.x * 0.15 + wPos.z * 0.36 + uWindPhase * 1.7 + h1 * 5.1;
       float aDir = 0.6 * sin(uTime * 0.31 + h1 * 3.5);     // 慢变风向（每片叶还不同）
       float wt    = ${wExpr};
       float ampEff = ${amp.toFixed(3)} * wt * (0.16 + 2.8 * gust);
       /* 主摆动：沿风向偏 x、偏 z 但频率/相位各自独立，不再构成圆形轨道 */
       transformed.x += sin(uTime * ${speed.toFixed(2)}      + hx) * ampEff * cos(aDir);
       transformed.z += cos(uTime * ${(speed*0.67).toFixed(2)} + hz) * ampEff * 0.62 * sin(aDir);
       transformed.x += cos(uTime * ${(speed*0.44).toFixed(2)} + hz * 1.3) * ampEff * 0.34;
       /* 高频抖动通道：起风时"枝叶翻飞"，下雨时"雨点砸在叶片上" */
       float tremble = gust + uRain * 0.85;
       transformed.x += sin(uTime * 6.3 + hx * 2.3) * ampEff * tremble * 0.8;
       transformed.z += cos(uTime * 7.1 + hz * 1.9) * ampEff * tremble * 0.6;`
    );
  };
  mat.customProgramCacheKey = () => 'wind' + amp + speed + mode;
  return mat;
}
addWind(MAT.leaf,   0.13, 1.35, 'base');    // 竹叶
addWind(MAT.willow, 0.30, 0.95, 'crown');   // 柳条 + 柳叶（垂挂，支点在树冠）
addWind(MAT.willowLeaf, 0.26, 0.95, 'crown');   // 叶帘飘带：比骨架枝稍轻，两层摆动才不"打架"
addWind(MAT.wisteria, 0.08, 1.15, 'crown', 3.2);  // 花穗轻摆：棚架梁高 3.2，穗梢越低摆幅越大
addWind(MAT.reed,   0.15, 1.10, 'base');    // 水草
/* ⚠️ 荷叶 / 荷花此前不在风场表里 —— 狂风暴雨里柳枝疯摆而荷花荷叶纹丝不动，
   同框对比非常出戏（用户反馈）。叶子/花瓣用 crown 模式（world-y 越低摆动越大），
   幅度取小：荷瓣轻薄 0.05、叶盘大而平 0.06，风暴里是"摇曳打转"不是"连根拔起"。 */
addWind(MAT.lily,  0.06, 1.15, 'crown', 2.4);   // 睡莲叶/莲杆：水面浮叶随风转
addWind(MAT.lotus, 0.05, 1.25, 'crown', 2.2);   // 荷花：花瓣应风轻摆

/* 随机自然风：随机挑一棵柳树起风，间隔、时长、风力均随机。
   触发间隔刻意压在 30 秒以内（静默 3~20s + 持续 3~8s ≤ 28s），
   保证任何一次打开场景都能看到起风 */
/* baseMul：天气带来的**常驻**底值风（与"阵风"无关）。
   ⚠️ 它必须每帧由 updateWind 写进 WIND.uWindStrength，不能只在 applyEnv 里写 ——
   applyEnv 只在 2.8 秒过渡期间被调用，过渡一结束就被 updateWind 每帧覆盖掉，
   实测底值从 2.2 掉到 0.153（只剩阵风残余），表现就是"狂风暴雨里一片叶子都不动"。 */
const gust = { active: false, t0: 0, dur: 0, peak: 0, nextAt: 2, peakMul: 1 };
function updateWind(t){
  const g = gust;
  /* 每帧先立起"天气底值风" —— 它是**全园均匀**的，写进 uWindGlobal，不参与距离衰减。
     量级按位移反算过：ampEff = amp * wt * (0.16 + 2.8 * gust)，柳叶 amp=0.30、wt≈0.9，
     gust=0.78 → 摆幅 ≈0.55m，这是"狂风"该有的幅度；旧值 2.6 若真生效会是 3m 以上的甩动
     （它一直被衰减吃掉，所以没人发现刻度是错的）。银装素裹 windMul=1.35 → 0.09，只是微风。 */
  const base = Math.min(0.85, Math.max(0, ((ENV.cur.windMul || 1) - 1.0) * 0.26));
  WIND.uWindGlobal.value = base;
  if (g.active){
    const e = t - g.t0;
    if (e >= g.dur){
      g.active = false;
      g.nextAt = t + 3 + Math.random() * 17;              // 静默 3~20 秒
    }
  } else if (t >= g.nextAt && willowOrigins.length){
    const o = willowOrigins[(Math.random() * willowOrigins.length) | 0];
    g.active = true;
    g.t0 = t;
    g.dur = 3.0 + Math.random() * 5.0;                    // 持续 3~8 秒
    g.peak = 0.70 + Math.random() * 0.40;                 // 常态风力
    WIND.uWindOrigin.value.set(o.x, o.y + 4.6, o.z);      // 风源取树冠高度
    WIND.uWindRadius.value = 20 + Math.random() * 14;    // 半径放大，让最近的竹林也能进风区
    WIND.uWindPhase.value = Math.random() * 10;
  }
  // 阵风分量：只在阵风进行中非零
  let gustVal = 0;
  if (g.active){
    const e = t - g.t0;
    const env = Math.sin(Math.PI * (e / g.dur));
    gustVal = g.peak * (g.peakMul || 1) * env * (0.82 + 0.18 * Math.sin(e * 2.7));
  }
  // 阵风单独写 uWindStrength；没有阵风时把风源推到哨兵位（wFall=0 → 该项自动为 0）
  WIND.uWindStrength.value = gustVal;
  if (!g.active) WIND.uWindOrigin.value.set(0, -999, 0);
}

/* ══════════════════════════════════════════════════════════════
   2 · 渲染器 / 相机 / 控制器
   ══════════════════════════════════════════════════════════════ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
/* ── 快速设备档位 ──
   双显卡笔记本上，浏览器默认常常跑在核显上（实测 Intel Iris Xe 只有 22.6fps，
   而同一场景在 RTX 4060 上是 54.3fps）。场景是按独显设计的，核显上根本没法看。
   这里读一次 GPU 名字决定初始画质。**完整的自动升降级留到定稿后再做** ——
   现在只解决「核显上打不开」这一个现实问题。 */
const GPU_TIER = (()=>{
  try {
    const gl = renderer.getContext();
    const d  = gl.getExtension('WEBGL_debug_renderer_info');
    const n  = d ? String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL)) : '';
    return /Intel|Iris|UHD Graphics|HD Graphics|Radeon\(TM\) Graphics|Vega|llvmpipe|SwiftShader/i.test(n)
           ? 'low' : 'high';
  } catch { return 'high'; }
})();

/* 超采样抗锯齿（SSAA）：按高于画布的分辨率渲染，由浏览器呈现时降采样。
   对竹林叶片、窗棂、瓦垄这类高频细节的提升比任何后期 AA 都直接。
   代价是填充率按倍率平方增长；核显档位直接关掉。 */
const SUPERSAMPLE = GPU_TIER === 'low' ? 1.0 : 1.15;   // 原 1.5 → 2.25 倍像素面积太烧（用户实测掉帧到十几帧）；1.15 已足够柔化边缘
/* ⚠️ Math.max 是"下限"，不是"上限"：DPR=3 的屏幕等于 9 倍像素面积。
   加一条**物理像素预算**：整幅渲染目标不超预算，超了就把倍率压回来。
   预算给得宽松，常见 1080p/1440p 桌面机的 1.5× 超采样一点不受影响；
   只有 4K + 高 DPR 这类才会被压回原生（那种情况本来也跑不动）。 */
const PIXEL_BUDGET = GPU_TIER === 'low' ? 1920 * 1080 * 1.1 : 2560 * 1440 * 1.05;   // 原 3840*2160*1.05：高 DPR/大屏上 2.25× 像素把帧率拖到 10-20（用户实测）
const RENDER_SCALE = Math.min(
  Math.max(devicePixelRatio, SUPERSAMPLE),
  Math.max(1, Math.sqrt(PIXEL_BUDGET / Math.max(1, innerWidth * innerHeight))));
renderer.setPixelRatio(RENDER_SCALE);
bootMark('渲染器');
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;   // 原 1.05 在 ACES 下把粉墙/石材推到纯白
renderer.shadowMap.enabled = true;
/* r184 已弃用 PCFSoftShadowMap（内部自动回落为 PCF），显式声明避免每帧 console 警告 */
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.info.autoReset = false;      // 手动 reset，以便统计整帧（含后处理）开销
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CFG.fog.color, CFG.fog.density);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.5, 900);
camera.position.set(-20, 17, 32);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.62;
controls.panSpeed = 0.7;
controls.zoomSpeed = 0.85;
controls.minDistance = 9;
controls.maxDistance = 170;
controls.maxPolarAngle = Math.PI * 0.492;   // 限制俯仰，避免钻入地面
controls.minPolarAngle = Math.PI * 0.055;
controls.target.set(0, 3.5, -1);
/* 视角边界与复位（审计 F03）：极角原本就限住了，但**目标点可以任意平移** ——
   能把视点拖到园子外/地下而且回不来，也没有"回初始机位"的入口。
   这里给目标点一个园子范围，并保留初始机位供 0 键复位。 */
const CAM_HOME = { pos: camera.position.clone(), target: controls.target.clone() };
controls.addEventListener('change', ()=>{
  const t = controls.target;
  t.x = Math.max(-34, Math.min(34, t.x));
  t.z = Math.max(-28, Math.min(28, t.z));
  t.y = Math.max(0.2, Math.min(16, t.y));
});
function resetCamera(){
  camera.position.copy(CAM_HOME.pos);
  controls.target.copy(CAM_HOME.target);
  controls.update();
}

/* 渐变天空球 */
function makeSkyMat(top, horizon, sunCol, sunDir){
  return new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{
      uTop:{value:new THREE.Color(top)}, uHorizon:{value:new THREE.Color(horizon)},
      uSunColor:{value:new THREE.Color(sunCol)}, uSunDir:{value:sunDir.clone().normalize()},
      uTime:{value:0},
      uCloudTint:{value:new THREE.Color(0xFFFBF3)},   // 云的颜色（黄昏会转暖）
      uCloudAmount:{value:0.88},                       // 云量（阴天→1，晴→低）
      uStarAmount:{value:0.0},                         // 星（仅夜间）
      uDiskFade:{value:0.0},                           // 1 = 抹掉日轮（阴/雨/雪：天上有云，看不到日头）
    },
    vertexShader:`varying vec3 vDir;
      void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vDir;
      uniform vec3 uTop, uHorizon, uSunColor, uSunDir;
      uniform float uTime;
      uniform vec3  uCloudTint;
      uniform float uCloudAmount, uStarAmount, uDiskFade;

      // 便宜的 value-noise FBM —— 给天空一层有体积感的云，
      // 原来的天空是均匀平色，占了画面 30~40% 面积却毫无信息
      float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
      float vnoise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
                   mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
      }
      float fbm(vec2 p){
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++){ v += a * vnoise(p); p *= 2.03; a *= 0.5; }
        return v;
      }

      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(uHorizon, uTop, pow(h, 0.55));

        float s = clamp(dot(d, normalize(uSunDir)), 0.0, 1.0);
        col += uSunColor * (pow(s, 620.0) * 0.55 + pow(s, 7.0) * 0.16) * (1.0 - uDiskFade);

        // 云：把视线方向投影到天空平面做 FBM，两层叠出絮状结构
        if (d.y > 0.015){
          vec2 cp = d.xz / max(d.y, 0.06) * 0.52 + vec2(uTime * 0.0035, uTime * 0.0019);
          float f  = fbm(cp * 1.55);
          float f2 = fbm(cp * 4.10 + 7.3);
          float cloud = smoothstep(0.50, 0.88, f * 0.74 + f2 * 0.36);
          cloud *= smoothstep(0.015, 0.28, d.y);           // 地平线附近淡出，避免硬边
          col = mix(col, uCloudTint, cloud * uCloudAmount);
        }

        // 星：夜间才有。方向量化后取伪随机亮点，加一点闪烁
        if (uStarAmount > 0.001 && d.y > 0.0){
          vec3 sp = floor(d * 260.0);
          float h = hash21(sp.xy + sp.z * 31.7);
          float tw = 0.75 + 0.25 * sin(uTime * 2.1 + h * 63.0);
          col += vec3(0.85, 0.90, 1.0) * step(0.9982, h) * uStarAmount * tw * smoothstep(0.0, 0.22, d.y);
        }

        gl_FragColor = vec4(col, 1.0);
      }`,
  });
}
const skyMesh = new THREE.Mesh(
  new THREE.SphereGeometry(420, 48, 28),
  makeSkyMat(0xA8BDD4, 0xE6E2D8, 0xFFF3D8, new THREE.Vector3(...CFG.sun.pos))
);
skyMesh.frustumCulled = false;
scene.add(skyMesh);

/* 用渐变天空 + 地面色烘焙 PMREM 环境贴图（石材/水面需要反射） */
(function bakeEnv(){
  const pmrem = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene();
  const s = new THREE.Mesh(new THREE.SphereGeometry(14, 32, 20),
    makeSkyMat(0xA8BDD4, 0xE6E2D8, 0xFFF3D8, new THREE.Vector3(...CFG.sun.pos)));
  es.add(s);
  const g = new THREE.Mesh(new THREE.CircleGeometry(14, 28).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0x5F7B45 }));
  g.position.y = -3.2; es.add(g);
  scene.environment = pmrem.fromScene(es, 0.035).texture;
  scene.environmentIntensity = 1.0;
  pmrem.dispose();
  s.geometry.dispose(); g.geometry.dispose();
})();
/* 环境贴图（PMREM）只在启动时按"渐变天空 + 地面色"烘这一张，之后不重烘 ——
   于是夜里/阴天材质还在被白天的环境光照着（实测 scene.environmentIntensity 恒为 1.0）。
   不重烘、只按**当前天光亮度 / 烘焙时天光亮度**缩放它：代价是一个标量，且随时段/天气连续变化。 */
const lumOf = (c)=> 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
const ENV_BAKE_LUM = (lumOf(new THREE.Color(0xA8BDD4)) + lumOf(new THREE.Color(0xE6E2D8))) * 0.5;

/* ══════════════════════════════════════════════════════════════
   3 · 通用构件工厂
   ══════════════════════════════════════════════════════════════ */
function mesh(geo, mat, { cast = true, receive = true, name } = {}){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = receive;
  if (name) m.name = name;
  registry.meshes++; registry.geos++;
  return m;
}
const box = (w,h,d)=> new THREE.BoxGeometry(w,h,d);

/* 立柱（微收分） */
function makeColumn(h, r = 0.24, mat = MAT.wood, seg = 10){
  const g = new THREE.CylinderGeometry(r*0.92, r, h, seg);
  return mesh(g, mat, { name:'column' });
}

/* 椽头 / 斗拱小方块 —— 用实例化批量生成 */
function instancedBoxes(list, mat, size = [0.26,0.26,0.34]){
  if (!list.length) return null;
  const g = box(...size);
  const inst = new THREE.InstancedMesh(g, mat, list.length);
  inst.castShadow = true; inst.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        p = new THREE.Vector3(), s = new THREE.Vector3(1,1,1);
  list.forEach((it, i)=>{
    p.set(it.x, it.y, it.z);
    q.setFromEuler(new THREE.Euler(0, it.ry || 0, 0));
    s.set(1, 1, it.sz || 1);
    m.compose(p, q, s); inst.setMatrixAt(i, m);
  });
  inst.instanceMatrix.needsUpdate = true;
  registry.meshes++; registry.geos++;
  return inst;
}

/* 通用实例化：任意几何 + 摆位列表（支持 rx/ry/rz 与三轴缩放） */
function instancedGeo(geo, list, mat, { cast = true, receive = true } = {}){
  if (!list.length) return null;
  const inst = new THREE.InstancedMesh(geo, mat, list.length);
  inst.castShadow = cast; inst.receiveShadow = receive;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        p = new THREE.Vector3(), s = new THREE.Vector3();
  list.forEach((it, i)=>{
    p.set(it.x, it.y, it.z);
    q.setFromEuler(new THREE.Euler(it.rx || 0, it.ry || 0, it.rz || 0));
    s.set(it.sx || 1, it.sy || 1, it.sz || 1);
    m.compose(p, q, s); inst.setMatrixAt(i, m);
  });
  inst.instanceMatrix.needsUpdate = true;
  registry.meshes++; registry.geos++;
  return inst;
}

/* 带瓦垄波纹的板：给游廊这类直线坡屋面用。
   波纹只作用在顶面，沿局部 X 排列（= 垂直于走廊走向），与瓦垄实际走向一致 */
function makeCorrugatedSlab(w, h, d, tileW = 0.36, amp = 0.05){
  const segW = Math.max(8, Math.round(w / (tileW / 4)));
  const geo = new THREE.BoxGeometry(w, h, d, segW, 1, 6);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    if (p.getY(i) <= 0) continue;                 // 只顶面起伏
    const x = p.getX(i);
    p.setY(i, p.getY(i) + amp * Math.abs(Math.sin(x * Math.PI / tileW)));
  }
  geo.computeVertexNormals();
  return geo;
}

/* 一攒斗拱：坐斗 → 十字拱 → 三升 → 向外挑出的昂。
   合并成单一 BufferGeometry，整排只占一次 instanced draw call。
   ⚠️ 原点放在**底部**（y 从 0 到 DOUGONG_H）：斗拱在真实结构里的作用就是
   「填满额枋顶面到屋面之间的净空」，所以每攒按自己的净空做 Y 向缩放，
   底坐落在额枋上、顶顶住屋面 —— 这样它不可能悬空。 */
const DOUGONG_H = 0.43;
function makeDougongGeo(){
  const parts = [];
  const put = (w, h, d, x, y, z)=>{ const gg = box(w, h, d); gg.translate(x, y, z); parts.push(gg); };
  put(0.44, 0.20, 0.44,  0.00, 0.10,  0.00);     // 坐斗（大斗）
  put(1.02, 0.12, 0.15,  0.00, 0.26,  0.00);     // 横拱（沿面宽）
  put(0.15, 0.12, 1.02,  0.00, 0.26,  0.00);     // 纵拱（沿进深）
  put(0.20, 0.11, 0.20, -0.46, 0.375, 0.00);     // 三升：拱端小斗
  put(0.20, 0.11, 0.20,  0.46, 0.375, 0.00);
  put(0.20, 0.11, 0.20,  0.00, 0.375, -0.46);
  put(0.20, 0.11, 0.20,  0.00, 0.375,  0.46);
  put(0.15, 0.12, 0.62,  0.00, 0.24,  0.40);     // 昂：向檐外挑
  const merged = mergeGeometries(parts, false);
  parts.forEach(p => p.dispose());
  return merged;
}

/* 中式屋顶：曲面举折（凹曲屋面）+ 翼角起翘 + 山花 + 脊饰
   以矩形平面参数化高度场生成四坡曲面，法线朝上，再叠加角部起翘 */
function makeChineseRoof({ w, d, hRidge, ridgeLen, lift = 1.5,
                           segX = 200, segZ = 120, mat = MAT.roof,
                           tileW = 0.36, tileAmp = 0.055 }){
  const W = w / 2, D = d / 2;
  const L = Math.max(0.8, Math.min(ridgeLen / 2, W - 0.8));
  const group = new THREE.Group();

  /* ── 举折剖面 ──
     中式屋面不是一条幂曲线，而是按檩位分段、逐段加陡的折线（举架：檐口最缓、近脊最陡）。
     这里用四条折线段代替原来的 (1-t)^1.55：形状几乎一样，但"分片"是真的 ——
     折点落在各檩位上，与下面的分片拓扑一致。
     P_T 是从正脊量起的归一化进深，P_H 是同位置的高度比例（0=正脊、1=檐口）。 */
  const P_T = [0, 0.25, 0.50, 0.75, 1.00];
  const P_H = [1, 0.67241, 0.39655, 0.17241, 0];
  const profile = (t)=>{
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < P_T.length - 1; i++){
      if (t <= P_T[i + 1]){
        const k = (t - P_T[i]) / (P_T[i + 1] - P_T[i]);
        return hRidge * (P_H[i] + (P_H[i + 1] - P_H[i]) * k);
      }
    }
    return 0;
  };
  /* 歇山拓扑：正脊只到 x=±L；端坡（撒头）**不到脊** —— 它在 x=±L 处断开，
     断口由竖直山花面封住（见 ⑤）。TS 是山花底的相对位置（0.5 = 正脊到檐口的一半）。
       · 主坡：高度只随进深 z 变（沿 x 是一整片柱面）→ 平整的大坡。
       · 撒头：高度只随 x 变，沿 x 也走同一条举折 → 与主坡在垂脊处**逐点同高**。 */
  const TS = 0.5, zsG = TS * D, ysG = profile(TS);
  const xHip = (t)=> t <= TS ? L : L + (W - L) * (t - TS) / (1 - TS);
  const corner = (x, z)=> Math.pow(Math.min(1, Math.abs(x) / W) * Math.min(1, Math.abs(z) / D), 1.7);
  const heightAt = (x, z)=>{
    const ax = Math.abs(x), az = Math.abs(z), tz = Math.min(1, az / D);
    const t = ax <= xHip(tz) ? tz
            : TS + (1 - TS) * Math.min(1, (ax - L) / Math.max(0.001, W - L));
    return profile(t) + lift * corner(x, z);      // 后一项 = 角部起翘
  };

  /* ① 屋面：**按举折分片的真拓扑** —— 主坡（正脊两侧）+ 撒头（两端坡）+ 竖直山花面。
     主坡与撒头在垂脊处共用同一组 t 采样（tRows 里保证有一行正好落在 TS），
     所以两者的边界**逐点重合**，垂脊正好压在那条接缝上，不会漏光。
     瓦垄仍是同一张网格的顶点位移（零额外 draw call）：主坡随 x、撒头随 z，垄向与真实铺瓦一致。
     靠近垂脊 0.28m 内把波纹收到 0 —— 瓦在这里本来就要裁齐，也让接缝两侧同高。 */
  const tRows = [];
  for (let i = 0; i <= segZ; i++) tRows.push(i / segZ);
  if (!tRows.some(t => Math.abs(t - TS) < 1e-9)){ tRows.push(TS); tRows.sort((a, b)=> a - b); }
  const hipFade = (d)=>{ const q = Math.max(0, Math.min(1, d / 0.28)); return q * q * (3 - 2 * q); };

  const makePatch = (rows, nCols, at, flip, name)=>{
    const pos = [], uvs = [], idx = [];
    for (let i = 0; i < rows.length; i++)
      for (let j = 0; j <= nCols; j++){
        const q = at(rows[i], j, nCols);
        pos.push(q[0], q[1], q[2]); uvs.push(q[3], q[4]);
      }
    for (let i = 0; i < rows.length - 1; i++)
      for (let j = 0; j < nCols; j++){
        const a = i * (nCols + 1) + j, b = a + 1, c = a + nCols + 1, e = c + 1;
        if (flip) idx.push(a, b, c,  b, e, c);
        else      idx.push(a, c, b,  b, c, e);
      }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx); g.computeVertexNormals();
    return mesh(g, mat, { name, cast:false });
  };

  // 主坡：行=举折折点（正脊→檐口），列在各自的半宽内均分 —— 半宽随垂脊外扩，列均匀 ⇒ 瓦垄间距恒定
  const mainAt = (sgn)=> (t, j, nCols)=>{
    const xh = xHip(t), z = sgn * t * D, x = ((j / nCols) * 2 - 1) * xh;
    const rip = tileAmp * Math.abs(Math.sin(x * Math.PI / tileW)) * hipFade(xh - Math.abs(x));
    return [x, profile(t) + lift * corner(x, z) + rip, z, x * 0.34, z * 0.34];
  };
  group.add(makePatch(tRows, segX, mainAt(1),  false, 'roofMainS'));
  group.add(makePatch(tRows, segX, mainAt(-1), true,  'roofMainN'));

  // 撒头：每个 x 一行，行内 z 均分；沿 x 走同一条举折剖面
  const segV = Math.max(24, Math.min(160, Math.round(2 * D / 0.09)));
  const endRows = tRows.filter(t => t >= TS - 1e-9);
  const endAt = (sgn)=> (t, k, nCols)=>{
    const x = sgn * (L + (W - L) * (t - TS) / (1 - TS));
    const z = -t * D + 2 * t * D * (k / nCols);
    const rip = tileAmp * Math.abs(Math.sin(z * Math.PI / tileW)) * hipFade(t * D - Math.abs(z));
    return [x, profile(t) + lift * corner(x, z) + rip, z, x * 0.34, z * 0.34];
  };
  /* ⚠️ 撒头的绕序与主坡**相反**：撒头的行沿 +x、列沿 +z，用主坡那套绕序算出的法线朝下
     （法线 = 行向量 × 列向量 = x̂ × ẑ = −ŷ）；主坡是行沿 +z、列沿 +x → +ŷ。
     原来照抄了主坡的 flip，两片端坡法线都朝下：MAT.roof 是 DoubleSide，靠 gl_FrontFacing
     把光照"兜"回了正面（所以肉眼没炸），但 ① GTAO 的法线 pass 读到的仍是朝下的法线
     ② 积雪判据 upness = smoothstep(0.30,0.78, −0.9) = 0 → **端坡永远不积雪**。 */
  group.add(makePatch(endRows, segV, endAt(1),  true,  'roofEndE'));
  group.add(makePatch(endRows, segV, endAt(-1), false, 'roofEndW'));

  /* ② 檐口封边（滴水瓦口）：沿四周向下拉一圈，让屋顶有厚度、不再"透视" */
  const fasciaH = 0.38, N = 18;
  const fv = [], fi = [];
  const addStrip = (p1, p2)=>{
    const y1 = heightAt(p1.x, p1.z), y2 = heightAt(p2.x, p2.z);
    const b = fv.length / 3;
    fv.push(p1.x, y1, p1.z,  p2.x, y2, p2.z,  p2.x, y2 - fasciaH, p2.z,  p1.x, y1 - fasciaH, p1.z);
    fi.push(b, b+2, b+1,  b, b+3, b+2);
  };
  for (let s = 0; s < N; s++){
    const t0 = s / N, t1 = (s + 1) / N;
    const x0 = -W + 2*W*t0, x1 = -W + 2*W*t1;
    const z0 = -D + 2*D*t0, z1 = -D + 2*D*t1;
    addStrip({x:x0, z: D}, {x:x1, z: D});
    addStrip({x:x1, z:-D}, {x:x0, z:-D});
    addStrip({x:-W, z:z1}, {x:-W, z:z0});
    addStrip({x: W, z:z0}, {x: W, z:z1});
  }
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.Float32BufferAttribute(fv, 3));
  fGeo.setIndex(fi);
  fGeo.computeVertexNormals();
  group.add(mesh(fGeo, mat, { name:'eaveFascia' }));

  /* ③ 正脊 + 两端脊饰
     苏式厅堂正脊不用北方鸱吻 —— 鸱吻/龙吻脊属高等级做法（寺庙主殿、品官府第、家祠），
     园林厅堂习用「纹头脊」：两端以攀脊砌高、作钩子头，脊端翘起而形体低矮 */
  const ridge = mesh(box(2*L + 0.4, 0.36, 0.46), MAT.ridge, { name:'mainRidge' });
  ridge.position.set(0, hRidge + 0.1, 0);
  group.add(ridge);
  const ornS = hRidge / 3.0;                       // 脊饰随屋顶尺度缩放
  const wenShape = new THREE.Shape();
  wenShape.moveTo(-0.44, 0);
  wenShape.lineTo( 0.44, 0);
  wenShape.bezierCurveTo( 0.50, 0.22,  0.34, 0.46,  0.06, 0.50);   // 缓升到顶
  wenShape.bezierCurveTo(-0.16, 0.52, -0.36, 0.36, -0.44, 0.14);   // 钩子头回收
  wenShape.closePath();
  const wenGeo = new THREE.ExtrudeGeometry(wenShape, { depth: 0.34, bevelEnabled: false, curveSegments: 12 });
  wenGeo.translate(0, 0, -0.17);
  [-1, 1].forEach(sgn=>{
    const orn = mesh(wenGeo, MAT.ridge, { name:'wenTouJi' });
    orn.position.set(sgn * (L + 0.16), hRidge - 0.06, 0);
    orn.rotation.y = sgn > 0 ? 0 : Math.PI;
    orn.scale.setScalar(ornS);
    group.add(orn);
    const pan = mesh(box(0.9, 0.2, 0.46), MAT.ridge, { name:'panRidge' });   // 攀脊
    pan.position.set(sgn * (L - 0.3), hRidge + 0.24, 0);
    group.add(pan);
  });

  /* ④ 垂脊：正脊端 → 檐角（贴着高度场的脊线） */
  /* 歇山的垂脊**不从正脊端起**，而是从山花底角（x=±L, |z|=TS·D）起，
     沿"主坡与撒头交线"一直压到檐角 —— 这正好是两条坡面共享的那条折线。 */
  const hipRidge = (sx, sz)=>{
    const pts = [];
    const steps = 14;
    for (let i = 0; i <= steps; i++){
      const t = TS + (1 - TS) * (i / steps);
      const x = sx * xHip(t);
      const z = sz * (D * t);
      pts.push(new THREE.Vector3(x, profile(t) + lift * corner(x, z) + 0.14, z));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    return mesh(new THREE.TubeGeometry(curve, 14, 0.1, 5, false), MAT.ridge, { name:'hipRidge' });
  };
  group.add(hipRidge(-1,-1), hipRidge(1,-1), hipRidge(-1,1), hipRidge(1,1));

  /* ⑤ 竖直山花面 + 博风板 —— 这一次有真拓扑可依附。
     ⚠️ 这里失败过两次：当时 x=±L 处曲面沿 x 是平的，硬塞一块"下缘=heightAt(L,z)、
     上缘=正脊标高"的板，从上看就是两块平铺在瓦面上的褐板（用户："屋顶出现莫名其妙的线和框"）。
     现在的拓扑在 x=±L **天然断开**：主坡(|x|≤L)止于此、撒头(|x|>L)从这里外扩，
     落差 = profile(|z|/D) − profile(TS)，山花面就是封住这段落差的竖直面，
     博风板压在它的上边缘。依附关系是几何自带的，不再靠"算出来的贴合"。 */
  const gsN = 24;
  [[1, false], [-1, true]].forEach(([sgn, flip])=>{
    // —— 竖直山花面（白粉，与山墙同色）——
    const gp = [], gu = [], gi = [];
    for (let i = 0; i <= gsN; i++){
      const z = -zsG + 2 * zsG * (i / gsN);
      const c = lift * corner(sgn * L, z);
      gp.push(sgn * L, ysG + c, z);                          gu.push(i / gsN, 0);
      gp.push(sgn * L, profile(Math.abs(z) / D) + c, z);     gu.push(i / gsN, 1);
    }
    for (let i = 0; i < gsN; i++){
      const a = i * 2, b = a + 1, c2 = a + 2, d = a + 3;
      if (flip) gi.push(a, c2, b,  b, c2, d); else gi.push(a, b, c2,  b, d, c2);
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute('position', new THREE.Float32BufferAttribute(gp, 3));
    gg.setAttribute('uv', new THREE.Float32BufferAttribute(gu, 2));
    gg.setIndex(gi); gg.computeVertexNormals();
    group.add(mesh(gg, MAT.wall, { name:'roofGable', cast:false }));

    // —— 博风板：沿山花上边缘的木封檐板（悬出屋面 0.12、压住山花上沿 0.26）——
    const bp = [], bi = [];
    for (let i = 0; i <= gsN; i++){
      const z = -zsG + 2 * zsG * (i / gsN);
      const yT = profile(Math.abs(z) / D) + lift * corner(sgn * L, z);
      const xi = sgn * (L - 0.03), xo = sgn * (L + 0.12);
      bp.push(xi, yT - 0.26, z,  xo, yT - 0.26, z,  xo, yT + 0.10, z,  xi, yT + 0.10, z);
    }
    for (let i = 0; i < gsN; i++){
      const r0 = i * 4, r1 = (i + 1) * 4;
      for (let k = 0; k < 4; k++){
        const a = r0 + k, b = r0 + ((k + 1) % 4), c = r1 + k, d = r1 + ((k + 1) % 4);
        bi.push(a, b, c,  b, d, c);
      }
    }
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3));
    bg.setIndex(bi); bg.computeVertexNormals();
    group.add(mesh(bg, MAT.gableBoard, { name:'roofBarge', cast:false }));
  });

  /* ⑥ 檐口瓦当（筒瓦端头圆盘，实例化） */
  {
    const spacing = tileW;              // 与瓦垄同间距，瓦当才落在垄头上
    const list = [];
    const addRow = (p0, p1)=>{
      const dx = p1.x - p0.x, dz = p1.z - p0.z;
      const len = Math.hypot(dx, dz);
      const n = Math.max(1, Math.round(len / spacing));
      const nx = -dz / len, nz = dx / len;          // 水平外法线
      const ry = Math.atan2(nx, nz);
      for (let i = 0; i < n; i++){
        const t = (i + 0.5) / n;
        const x = p0.x + dx * t, z = p0.z + dz * t;
        list.push({ x, y: heightAt(x, z) - 0.07 + tileAmp * 0.55, z, ry });
      }
    };
    addRow({x:-W, z: D}, {x: W, z: D});
    addRow({x: W, z: D}, {x: W, z:-D});
    addRow({x: W, z:-D}, {x:-W, z:-D});
    addRow({x:-W, z:-D}, {x:-W, z: D});
    const tg = new THREE.CylinderGeometry(0.078, 0.078, 0.1, 10);
    const inst = new THREE.InstancedMesh(tg, MAT.ridge, list.length);
    inst.castShadow = false;
    const qA = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI/2);
    const qB = new THREE.Quaternion();
    const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(1,1,1);
    list.forEach((it, i)=>{
      p.set(it.x, it.y, it.z);
      qB.setFromAxisAngle(new THREE.Vector3(0,1,0), it.ry);
      q.copy(qB).multiply(qA);
      m.compose(p, q, s); inst.setMatrixAt(i, m);
    });
    inst.instanceMatrix.needsUpdate = true;
    group.add(inst);
  }

  // 把屋面高度场导出：檐椽/斗拱/挂落等檐下构件必须贴着它定位，
  // 否则翼角起翘（本屋顶 lift=1.15）会把檐口抬高近 1 米，而固定高度的构件就会在四角悬空。
  group.userData.heightAt = heightAt;

  return group;
}
function makeCeiling(w, d, y, mat = MAT.woodDark){
  const m = mesh(new THREE.PlaneGeometry(w, d), mat, { cast:false, name:'ceiling' });
  m.rotation.x = Math.PI / 2;        // 法线朝下
  m.position.y = y;
  return m;
}

/* ── 窗棂格心 ──
   原来的芯仔只是等距的直棂网格（cols×rows 根通长条），那是"格栅"不是"格心"。
   苏式长窗/半窗的芯仔是有画样的：步步锦（矩形套叠、回纹收头）、冰裂纹（不规则冰裂）、
   万字纹（卍字连续）等。这里实现前两种 —— 它们最能拉开近景的信息量，
   而且都是**线段集合**，共用同一条"把线段变成实体木棂再合并成一个网格"的通路。

   ⚠️ 每根棂条是一次 geometry 合并，不是一次 draw call：最终每个窗芯仍只有 1 个网格
   （材质统一为木材），所以格心复杂度几乎不影响渲染开销，只影响 init 时的构建量。 */
function latticeSegs_bujunjin(w, h){                 // 步步锦
  /* 步步锦：矩形**层层内收的套叠**（这是"步步"的本义）。
     ⚠️ 上一版我做了三级收分（0/0.24/0.48），圈间太密、看着像一个厚框，
     用户直接否掉了。现在去掉第三圈，只留"外圈 + 明显内收的内圈"，
     再叠一个中心十字花 —— 这是江南长窗芯仔最常见的朴素做法。
     ⚠️ 相对坐标 (0,0)-(w,h)，由 buildLatticeMesh 统一平移到面板中心。 */
  const segs = [], T = 0.048;
  const ring = (t)=>{
    const iw = w*(1-2*t), ih = h*(1-2*t), x0 = w*t, y0 = h*t;
    segs.push({ x: w*0.5,  y: y0,     w: iw, h: T, r: 0 });
    segs.push({ x: w*0.5,  y: h - y0, w: iw, h: T, r: 0 });
    segs.push({ x: x0,     y: h*0.5,  w: ih, h: T, r: Math.PI/2 });
    segs.push({ x: w - x0, y: h*0.5,  w: ih, h: T, r: Math.PI/2 });
  };
  ring(0.00); ring(0.17);
  // 中心十字花（内圈之内）
  const cw = w*0.56, ch = h*0.56;
  segs.push({ x: w*0.5, y: h*0.5, w: cw, h: T, r: 0 });
  segs.push({ x: w*0.5, y: h*0.5, w: ch, h: T, r: Math.PI/2 });
  return segs;
}

/* 直棂：等距横竖棂条（最朴素的芯仔，用于次级窗与室内隔断） */
function latticeSegs_zhiLing(w, h, cols = 3, rows = 4){
  const segs = [], T = 0.05;
  for (let i = 1; i < cols; i++) segs.push({ x: (w/cols)*i, y: h*0.5, w: h, h: T, r: Math.PI/2 });
  for (let j = 1; j < rows; j++) segs.push({ x: w*0.5, y: (h/rows)*j, w: w, h: T, r: 0 });
  return segs;
}
function latticeSegs_iceCrack(w, h, seed = 11){      // 冰裂纹（递归切分 + 去重）
  const rnd = mulberry32(seed);
  const cells = [];
  (function rec(x, y, cw, ch, d){
    if (d >= 4 || (cw < 0.34 && ch < 0.34) || cells.length > 26){ cells.push({ x, y, w: cw, h: ch }); return; }
    if (rnd() < 0.5){ const t = 0.32 + rnd()*0.36, a = ch*t; rec(x, y, cw, a, d+1); rec(x, y+a, cw, ch-a, d+1); }
    else            { const t = 0.32 + rnd()*0.36, a = cw*t; rec(x, y, a, ch, d+1); rec(x+a, y, cw-a, ch, d+1); }
  })(0, 0, w, h, 0);
  const segs = [], seen = new Set();
  const push = (x, y, len, rot)=>{
    const k = rot.toFixed(0) + '|' + x.toFixed(3) + '|' + y.toFixed(3) + '|' + len.toFixed(3);
    if (seen.has(k)) return;                       // 相邻格子共享的边只留一条
    seen.add(k); segs.push({ x, y, w: len, h: 0.05, r: rot });
  };
  for (const c of cells){
    push(c.x + c.w/2, c.y,       c.w, 0);
    push(c.x + c.w/2, c.y + c.h, c.w, 0);
    push(c.x,         c.y + c.h/2, c.h, Math.PI/2);
    push(c.x + c.w,   c.y + c.h/2, c.h, Math.PI/2);
  }
  return segs;
}
/* ── 清代江南隔扇芯仔：宫式方格 + 中段"菱花/海棠"葵式花心带 ──
   大户人家隔扇最常见的一种：上下两段是规整的宫式方格，中间夹一条葵式花心带，
   每个花心 = 菱形 + 内十字 + 四出海棠尖。依据是用户提供的那张远香堂立面照片
   （整排落地长窗、宫式方格夹一条菱花花心带、下面裙板）—— 不做 100% 复刻，
   只要"做法与气味"对：宫式打底、葵式点睛、木色沉、窗纸透。
   坐标系：buildLatticeMesh 的原点在**芯区左上角**，y 向下。 */
function latticeSegs_qingStyle(w, h, cols = 2, rows = 3){
  const segs = [], T = 0.048;
  const seg2 = (x1, y1, x2, y2, th = T)=>{
    segs.push({ x: (x1 + x2) / 2, y: (y1 + y2) / 2,
                w: Math.hypot(x2 - x1, y2 - y1), h: th, r: Math.atan2(y2 - y1, x2 - x1) });
  };
  /* ⚠️ 第二版（用户第二张近景照片后作废）：原来做的是"细密宫式方格 + 一条大花心带"，
     花心占满带高、近看像徽标。照片里的真实做法是**横竖棂条分成方格、每格中央一枚小小的
     如意/海棠花心**（花心只有格子的三成左右），所以改成 cols×rows 的方格 + 逐格小花心。 */
  const cw = w / cols, ch = h / rows;
  for (let j = 0; j <= rows; j++) seg2(0, j * ch, w, j * ch, T * 1.15);   // 通长横棂
  for (let i = 0; i <= cols; i++) seg2(i * cw, 0, i * cw, h, T);         // 通长竖棂
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++){
    const cx = (i + 0.5) * cw, cy = (j + 0.5) * ch;
    const R = Math.min(cw, ch) * 0.30;          // 花心只占格子三成
    const s = R * 0.44, t = R * 0.30, q = R * 0.32;
    // 削角小菱形＝如意/海棠花心的直线近似（四角各削一刀，八边形）
    const pts = [[-R, 0], [-s, -R + t], [s, -R + t], [R, 0], [s, R - t], [-s, R - t]];
    for (let k = 0; k < 6; k++){
      const A = pts[k], B = pts[(k + 1) % 6];
      seg2(cx + A[0], cy + A[1], cx + B[0], cy + B[1], T * 0.85);
    }
    seg2(cx - q, cy, cx + q, cy, T * 0.8); seg2(cx, cy - q, cx, cy + q, T * 0.8);   // 内十字
  }
  return segs;
}
/* 把线段集合变成"一个合并网格"。0/90° 直接用轴对齐盒子（省一次旋转），
   其余角度（菱花花心的 45° 斜棂）旋转后同样合进这一个网格 —— 所以芯仔再花
   也只是一个 draw call。 */
function buildLatticeMesh(segs, w, h, depth, mat, name = 'winLattice'){
  const geos = [];
  const nrm = new THREE.Matrix4().makeTranslation(-w/2, -h/2, 0);     // 芯区左上角为原点
  for (const s of segs){
    let g;
    if (s.r === 0)        g = box(Math.max(1e-3, s.w), Math.max(1e-3, s.h), depth);
    else if (s.r === Math.PI/2) g = box(Math.max(1e-3, s.h), Math.max(1e-3, s.w), depth);
    else { g = box(Math.max(1e-3, s.w), Math.max(1e-3, s.h), depth);
           g.applyMatrix4(new THREE.Matrix4().makeRotationZ(s.r)); }
    g.applyMatrix4(new THREE.Matrix4().makeTranslation(s.x, s.y, 0));
    geos.push(g);
  }
  if (!geos.length) return null;
  let merged = null;
  try { merged = mergeGeometries(geos, false); } catch (e){ merged = null; }
  if (!merged) return null;
  merged.applyMatrix4(nrm);
  return mesh(merged, mat, { name });
}

/* ── 小木作：栏杆 / 美人靠 / 雀替 / 挂落 ──
   这些是中式建筑里"信息密度最高"的一层：远看只是几道线，近看却全是细节。
   统一放在这里生成，构件数用 InstancedMesh 压住，不逐个建网格。 */

/* 靠椅栏杆（含美人靠）：立柱 + 上扶手 + 中枋 + 细棂条 + 靠背斜撑
   返回一个 Group；origin 在栏段中心、y=0 落在楼/台面上。 */
function makeRailing(len, { h = 1.05, back = true, postEvery = 1.6,
                            matPost = MAT.woodRed, matBar = MAT.wood } = {}){
  const g = new THREE.Group();
  // 立柱
  const posts = [];
  const n = Math.max(1, Math.round(len / postEvery));
  for (let i = 0; i <= n; i++) posts.push({ x: -len/2 + (len/n)*i, y: 0, z: 0, ry: 0 });
  const postInst = instancedBoxes(posts, matPost, [0.13, h + 0.12, 0.13]);
  if (postInst){ postInst.position.y = (h + 0.12)/2; g.add(postInst); }
  // 上扶手（寻杖）
  const hand = mesh(box(len, 0.11, 0.20), matPost, { name:'railingHand' });
  hand.position.y = h; g.add(hand);
  // 中枋
  const mid = mesh(box(len, 0.08, 0.13), matBar);
  mid.position.y = h * 0.46; g.add(mid);
  // 细棂条（竖向，间距 0.2）
  const bars = [];
  const nb = Math.max(2, Math.floor(len / 0.2));
  for (let i = 0; i <= nb; i++){
    const x = -len/2 + (len/nb)*i;
    if (posts.some(p => Math.abs(p.x - x) < 0.09)) continue;   // 与立柱重合的跳过
    bars.push({ x, y: h*0.24, z: 0, ry: 0 });
  }
  const barInst = instancedBoxes(bars, matBar, [0.045, h*0.50, 0.055]);
  if (barInst) g.add(barInst);
  // 靠背：向后倾斜的条板（美人靠的"靠"）
  if (back){
    const bh = 0.46, tilt = 0.22;
    const backBar = mesh(box(len, bh, 0.075), matBar, { name:'railingBack' });
    backBar.position.set(0, h + bh*0.45, -0.16);
    backBar.rotation.x = -tilt;
    g.add(backBar);
    // 斜撑
    const struts = [];
    for (let i = 0; i <= n; i++) struts.push({ x: -len/2 + (len/n)*i, y: h + 0.06, z: -0.09, ry: 0 });
    const stInst = instancedBoxes(struts, matBar, [0.07, 0.42, 0.07]);
    if (stInst){ stInst.rotation.x = -tilt; g.add(stInst); }
  }
  return g;
}

/* 雀替：柱与额枋交角处的托木，轮廓自上而下收分，是"梁柱交接"最直观的标志 */
function makeQueTu(w = 0.78, h = 1.45, mat = MAT.woodRed){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.lineTo(w, 0);
  s.bezierCurveTo(w*0.72, h*0.34, w*0.44, h*0.70, 0, h);   // 内凹的软曲线
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.16, bevelEnabled: false, curveSegments: 10 });
  geo.translate(0, 0, -0.08);
  return mesh(geo, mat, { name:'queti' });
}

/* 挂落：檐枋下的花牙子 —— 通长细枋 + 等距垂牙 + 每间收头小立枋 */
function makeGuaLuo(len, { depth = 0.34, mat = MAT.woodDark, step = 0.62 } = {}){
  const g = new THREE.Group();
  const beam = mesh(box(len, 0.16, 0.13), mat, { name:'gualuoBeam' });
  beam.position.y = 0; g.add(beam);
  const drops = [];
  const n = Math.max(1, Math.floor(len / step));
  for (let i = 0; i < n; i++) drops.push({ x: -len/2 + step*(i + 0.5), y: -depth/2 - 0.08, z: 0, ry: 0 });
  const di = instancedBoxes(drops, mat, [0.11, depth, 0.10]);
  if (di) g.add(di);
  return g;
}

/* 江南半窗：下部槛墙、窗芯糊纸、格心芯仔（芯仔约占七八成）
   形制参考《园冶》长窗/半窗、营造法原地坪窗 */
function makeJiangnanWindow(w, h, pattern = 'bujunjin'){
  const g = new THREE.Group();
  const fr = 0.16, depth = 0.16;
  // 窗芯（浅色纸背，透光感）
  const inner = mesh(box(w - fr * 1.7, h - fr * 1.7, depth * 0.4), MAT.winPaper, { name:'winPaper' });
  inner.position.z = -0.03; g.add(inner);
  // 外框
  const top = mesh(box(w, fr, depth), MAT.woodDark); top.position.y =  h/2 - fr/2; g.add(top);
  const bot = mesh(box(w, fr, depth), MAT.woodDark); bot.position.y = -h/2 + fr/2; g.add(bot);
  const lf  = mesh(box(fr, h, depth), MAT.woodDark); lf.position.x = -w/2 + fr/2; g.add(lf);
  const rf  = mesh(box(fr, h, depth), MAT.woodDark); rf.position.x =  w/2 - fr/2; g.add(rf);
  // 格心（步步锦 / 冰裂纹），合并成单个网格
  const iw = w - fr * 1.7, ih = h - fr * 1.7;
  const segs = pattern === 'ice'  ? latticeSegs_iceCrack(iw, ih, 11)
             : pattern === 'zhi'  ? latticeSegs_zhiLing(iw, ih, 3, 4)
             :                      latticeSegs_bujunjin(iw, ih);
  const lat = buildLatticeMesh(segs, iw, ih, depth * 0.55, MAT.woodDark);
  if (lat){ lat.position.z = 0.02; g.add(lat); }
  // 窗台石
  const sill = mesh(box(w + 0.34, 0.11, depth + 0.2), MAT.stoneDark, { name:'winSill' });
  sill.position.y = -h/2 - 0.055; g.add(sill);
  return g;
}

/* 落地长窗（隔扇）：上段芯仔 + 中段夹堂板 + 下段裙板。
   这是苏州厅堂——尤其四面厅——正面的做法：长窗**从台基直达额枋**，一间一樘，下端是实心裙板。
   ⚠️ 关于"还原到什么程度"必须说清楚：网上只检索到书目与抓不到正文的页面，
   **远香堂芯仔的具体图案我没能证实**；这里依据的是苏州园林的通行做法 ——
   厅堂长窗用**宫式**（规整直棂方格）+ 夹堂板 + 裙板；葵式（冰裂/乱纹）用在游廊、亭子等次要位置。
   侧面的山墙窗仍保留半窗（那才是半窗本来该在的位置）。 */
function makeChangChuang(w, h, cols = 5, rows = 4){
  const g = new THREE.Group();
  const fr = 0.17, depth = 0.15;
  const hPanel = h * 0.34, hMid = h * 0.06, hCore = h - hPanel - hMid;
  const yBot = -h / 2;
  const iw = w - fr * 1.7, ih = hCore - 0.05, yCore = yBot + hPanel + hMid + hCore / 2;
  /* 木色：用户给的两张远香堂照片里，隔扇是**枣红**（不是近黑褐）——
     所以整樘改用与柱子同色系的 woodRed，只留窗纸与石槛做对比。 */
  const ww = MAT.woodRed;
  const paper = mesh(box(iw, ih, depth * 0.35), MAT.winPaper, { name:'ccPaper' });
  paper.position.set(0, yCore, -0.03); g.add(paper);
  const panel = mesh(box(iw, hPanel - 0.05, depth * 0.55), ww, { name:'ccPanel' });
  panel.position.set(0, yBot + hPanel / 2, 0.01); g.add(panel);          // 下段裙板
  const mid = mesh(box(iw, hMid, depth * 0.6), ww, { name:'ccMid' });
  mid.position.set(0, yBot + hPanel + hMid / 2, 0.01); g.add(mid);       // 中段夹堂板
  // 上段芯仔：方格 + 每格中央一枚如意/海棠花心（清代江南隔扇做法，见 latticeSegs_qingStyle）
  const segs = latticeSegs_qingStyle(iw, ih, 2, 3);
  const lat = buildLatticeMesh(segs, iw, ih, depth * 0.55, ww);
  if (lat){ lat.position.set(0, yCore, 0.02); g.add(lat); }
  const top = mesh(box(w, fr, depth), ww); top.position.y = h/2 - fr/2; g.add(top);
  const bot = mesh(box(w, fr, depth), ww); bot.position.y = -h/2 + fr/2; g.add(bot);
  const lf  = mesh(box(fr, h, depth), ww); lf.position.x = -w/2 + fr/2; g.add(lf);
  const rf  = mesh(box(fr, h, depth), ww); rf.position.x =  w/2 - fr/2; g.add(rf);
  const sl  = mesh(box(w + 0.1, 0.12, depth + 0.16), MAT.stoneDark, { name:'ccSill' });
  sl.position.y = -h/2 - 0.06; g.add(sl);                                // 下槛（贴地横木）
  return g;
}

/* 格扇门 / 长窗：木框 + 细棂条 + 不透明衬板（关闭状态，不透光穿视） */
function makeLatticePanel(w, h, cols = 4, rows = 5, frameMat = MAT.woodDark, backing = MAT.latticeBack){
  const g = new THREE.Group();
  const t = 0.09;
  // 外框（原点在面板正中 —— 所有调用点都按居中放置）
  const fr = 0.16;
  const top = mesh(box(w, fr, t*1.6), frameMat); top.position.y =  h/2 - fr/2; g.add(top);
  const bot = mesh(box(w, fr, t*1.6), frameMat); bot.position.y = -h/2 + fr/2; g.add(bot);
  const lf  = mesh(box(fr, h, t*1.6), frameMat); lf.position.x = -w/2 + fr/2; g.add(lf);
  const rf  = mesh(box(fr, h, t*1.6), frameMat); rf.position.x =  w/2 - fr/2; g.add(rf);
  // 衬板（关着的门扇：纸/木板，不透）
  const back = mesh(new THREE.PlaneGeometry(w - fr*1.4, h - fr*1.4), backing, { cast:false, name:'backing' });
  back.position.z = -t*0.35; g.add(back);
  /* 芯仔：等距直棂 → **真正的格心**。
     原来这里只是 cols×rows 的通长直棂，也就是"格栅"，不是窗花 ——
     门扇与室内隔断全用它，所以近看"没有窗花"。
     现在改为：先随机挑一档直棂（保留细分感），再叠一圈内收的矩形套叠，
     门/隔断与窗子用同一套语汇。 */
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(1,1,1);
  const iw2 = w - fr*1.5, ih2 = h - fr*1.5;
  const segs = latticeSegs_bujunjin(iw2, ih2);
  const lat = buildLatticeMesh(segs, iw2, ih2, t*0.9, frameMat, 'panelLattice');
  if (lat) g.add(lat);
  // 细直棂：作为格心的次级细分（数量随 cols/rows，保持各地窗棂疏密不同）
  const gv = box(0.038, ih2, t*0.7);
  const gh = box(iw2, 0.038, t*0.7);
  const iv = new THREE.InstancedMesh(gv, frameMat, Math.max(0, cols - 1));
  const ih = new THREE.InstancedMesh(gh, frameMat, Math.max(0, rows - 1));
  for (let i = 1; i < cols; i++){ p.set(-w/2 + (w/cols)*i, 0, 0); m.compose(p,q,s); iv.setMatrixAt(i-1, m); }
  for (let j = 1; j < rows; j++){ p.set(0, -h/2 + (h/rows)*j, 0); m.compose(p,q,s); ih.setMatrixAt(j-1, m); }
  iv.instanceMatrix.needsUpdate = ih.instanceMatrix.needsUpdate = true;
  iv.castShadow = ih.castShadow = true;
  g.add(iv, ih);
  return g;
}

/* 带孔洞的墙体：一次挤出成型（真镂空） */
function makeWallRun({ len, h, t, holes = [] }){
  const shape = new THREE.Shape();
  shape.moveTo(-len/2, 0);
  shape.lineTo( len/2, 0);
  shape.lineTo( len/2, h);
  shape.lineTo(-len/2, h);
  shape.closePath();

  for (const hd of holes){
    const p = new THREE.Path();
    if (hd.type === 'circle'){
      /* ⚠️ 月洞门是**能走人的整圆洞**，不是上半圆漏窗。
         原来只 absarc 了 π→0（上半圆）再沿弦线闭合：洞口下沿停在 y = r+0.18 = 1.80，
         下面 1.8 米是**一整堵实墙** —— 人过不去，而墙外还摆着"下沉门槛石阶"。
         圆心抬到 r+0.18 是为了让洞口下沿与 0.22 高的门槛石齐平，形状改成整圆。 */
      const { x, r } = hd, cy = hd.cy ?? r + 0.18;
      p.absarc(x, cy, r, 0, TAU, false);
    } else {                                          // 多边形漏窗
      const { x, y, r, n = 8, rot = 0 } = hd;
      for (let i = 0; i <= n; i++){
        const a = rot + (i/n) * TAU;
        const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
        i === 0 ? p.moveTo(px, py) : p.lineTo(px, py);
      }
      p.closePath();
    }
    shape.holes.push(p);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth:t, bevelEnabled:false, curveSegments:14 });
  geo.translate(0, 0, -t/2);
  return mesh(geo, MAT.wall, { name:'wall' });
}

/* 墙顶小青瓦披檐（人字坡） */
function makeWallCap(len, t, y){
  const g = new THREE.Group();
  const half = t/2 + 0.24;
  [-1, 1].forEach(sgn=>{
    const slope = mesh(box(len, 0.14, half*1.06), MAT.wallCap, { name:'wallCap' });
    slope.position.set(0, y + 0.3, sgn*half*0.5);
    /* ⚠️ 符号反了：-sgn 让两块坡板**朝外翘**，横断面成"凹"（中间汇水）、
       脊条浮在凹谷上方。正号才是中间高、两侧低的人字披檐。 */
    slope.rotation.x = sgn * 0.42;
    g.add(slope);
  });
  const ridge = mesh(box(len, 0.2, 0.2), MAT.ridge);
  ridge.position.y = y + 0.52; g.add(ridge);
  return g;
}

/* ══════════════════════════════════════════════════════════════
   4 · 建筑：远香堂 / 水榭 / 游廊
   ══════════════════════════════════════════════════════════════ */

/* 远香堂：面阔五开间、单檐歇山顶 */
function makeYuanxiangHall(){
  const g = new THREE.Group();
  const W = 20, D = 8, H = 7;          // 面阔 / 进深 / 通高
  const bays = 5;

  /* ① 两级青石台基 */
  const p1 = mesh(box(W + 4.4, 0.62, D + 4.4), MAT.stone, { name:'terraceLower' });
  p1.position.y = 0.31; g.add(p1);
  const p2 = mesh(box(W + 3.0, 0.62, D + 3.0), MAT.stone, { name:'terraceUpper' });
  p2.position.y = 0.93; g.add(p2);
  // 台基压边
  const edge = mesh(box(W + 4.6, 0.1, D + 4.6), MAT.stoneDark);
  edge.position.y = 0.62; g.add(edge);

  /* ② 踏跺（南侧两级） */
  for (let i = 0; i < 2; i++){
    const st = mesh(box(4.6, 0.31, 0.62), MAT.stone, { name:'step' });
    st.position.set(0, 0.155 + i*0.31, (D + 4.4)/2 + 0.31 - i*0.62);
    g.add(st);
  }

  /* ③ 柱网：檐柱 6 根（五开间）+ 金柱 */
  const colH = H - 2.35;
  const zFront = D/2 - 0.3, zBack = -D/2 + 0.3;
  const xs = [];
  for (let i = 0; i <= bays; i++) xs.push(-W/2 + (W/bays)*i);
  const colGeo = new THREE.CylinderGeometry(0.22, 0.26, colH, 10);
  const frontCols = [], backCols = [];
  xs.forEach(x=>{ frontCols.push({x, y:0, z:zFront}); backCols.push({x, y:0, z:zBack}); });
  const allCols = [...frontCols, ...backCols];
  // 金柱（内圈）
  [-W/2 + W/bays, W/2 - W/bays].forEach(x=>{
    allCols.push({x, y:0, z: zFront - D*0.34});
    allCols.push({x, y:0, z: zBack + D*0.34});
  });
  const colInst = new THREE.InstancedMesh(colGeo, MAT.wood, allCols.length);
  colInst.castShadow = colInst.receiveShadow = true;
  const cm = new THREE.Matrix4(), cp = new THREE.Vector3(), cq = new THREE.Quaternion(), cs = new THREE.Vector3(1,1,1);
  allCols.forEach((c, i)=>{ cp.set(c.x, 1.24 + colH/2, c.z); cm.compose(cp, cq, cs); colInst.setMatrixAt(i, cm); });
  colInst.instanceMatrix.needsUpdate = true;
  g.add(colInst);
  // 柱础
  const baseGeo = new THREE.CylinderGeometry(0.36, 0.4, 0.22, 10);
  const baseInst = new THREE.InstancedMesh(baseGeo, MAT.stoneDark, allCols.length);
  baseInst.receiveShadow = true;
  allCols.forEach((c, i)=>{ cp.set(c.x, 1.24 + 0.11, c.z); cm.compose(cp, cq, cs); baseInst.setMatrixAt(i, cm); });
  baseInst.instanceMatrix.needsUpdate = true;
  g.add(baseInst);

  /* ④ 额枋（横向联系） */
  const beamY = 1.24 + colH;
  [zFront, zBack].forEach(z=>{
    const b = mesh(box(W + 0.6, 0.5, 0.32), MAT.woodRed, { name:'architrave' });
    b.position.set(0, beamY + 0.25, z); g.add(b);
  });
  // 端额枋：外侧面收在柱列线上（原来放在 ±(W/2+0.3)，外侧面到 ±10.46，
  // 在墙外露出一截无支撑的梁头）
  [-W/2 + 0.16, W/2 - 0.16].forEach(x=>{
    const b = mesh(box(0.32, 0.5, D + 0.6), MAT.woodRed);
    b.position.set(x, beamY + 0.25, 0); g.add(b);
  });

  /* ④b 雀替 + 挂落（小木作，紧贴额枋下缘）
     雀替是"梁柱交角"最直观的标志：每根檐柱两侧各一片，托在额枋下面。
     挂落挂在额枋前侧，是檐下的一道水平花边 —— 远看只是一条线，近看全是细节。 */
  {
    const fi = 1.45;                                   // 雀替高（从额枋下缘往下）
    // 檐柱列：与 xs 一致（五开间六柱）
    xs.forEach(x=>{
      { const q = makeQueTu(0.78, fi, MAT.woodRed);
        q.position.set(x - 0.39, beamY + 0.5 - fi, zFront + 0.30); g.add(q); }
      { const q = makeQueTu(0.78, fi, MAT.woodRed);
        q.scale.x = -1;
        q.position.set(x + 0.39, beamY + 0.5 - fi, zFront + 0.30); g.add(q); }
    });
    const gl = makeGuaLuo(W + 0.5, { depth: 0.34, step: 0.62 });
    gl.position.set(0, beamY + 0.5 - 0.20, zFront + 0.30);
    g.add(gl);
  }

  /* ⑤ 前檐：实心墙 + 中央大门（两扇敞开）+ 两侧长窗 */
  const panelH = colH - 0.35;
  const doorW = 3.8, doorH = 3.5;
  // 前墙（带门洞）
  const fw = new THREE.Shape();
  fw.moveTo(-W/2, 0); fw.lineTo(W/2, 0); fw.lineTo(W/2, colH); fw.lineTo(-W/2, colH); fw.closePath();
  const dh = new THREE.Path();
  dh.moveTo(-doorW/2, 0); dh.lineTo(doorW/2, 0); dh.lineTo(doorW/2, doorH); dh.lineTo(-doorW/2, doorH); dh.closePath();
  fw.holes.push(dh);
  const frontWall = mesh(new THREE.ExtrudeGeometry(fw, { depth: 0.3, bevelEnabled: false }), MAT.wall, { name:'frontWall' });
  frontWall.position.set(0, 1.24, zFront - 0.15);
  g.add(frontWall);
  // 门槛石
  const sill = mesh(box(doorW + 0.6, 0.24, 0.56), MAT.stoneDark, { name:'doorSill' });
  sill.position.set(0, 1.24 + 0.12, zFront);
  g.add(sill);
  // 门框
  [-1, 1].forEach(sx=>{
    const jamb = mesh(box(0.22, doorH, 0.36), MAT.woodRed, { name:'doorJamb' });
    jamb.position.set(sx * (doorW/2 + 0.11), 1.24 + doorH/2, zFront);
    g.add(jamb);
  });
  const lintel = mesh(box(doorW + 0.46, 0.3, 0.36), MAT.woodRed, { name:'doorLintel' });
  lintel.position.set(0, 1.24 + doorH + 0.15, zFront);
  g.add(lintel);
  // 两扇门向内敞开
  [-1, 1].forEach(sx=>{
    const pivot = new THREE.Group();
    pivot.position.set(sx * (doorW/2 - 0.03), 1.24 + 0.12, zFront - 0.08);
    const leaf = makeLatticePanel(doorW/2 - 0.06, doorH - 0.24, 2, 5);
    leaf.position.set(-sx * (doorW/4), (doorH - 0.24)/2, 0);
    pivot.add(leaf);
    pivot.rotation.y = -sx * 1.18;          // 向室内敞开
    g.add(pivot);
  });
  // 前墙半窗（每侧两扇，下有槛墙）
  [-1, 1].forEach(sx=>{
    [4.1, 7.9].forEach((px)=>{   // 柱心之间（檐柱约在 ±2.2 / ±6 / ±9.8），长窗填满开间
      /* 正面：**落地长窗**（一间一樘，填满柱间、从台基直达额枋）。
         ⚠️ 原来是 4 樘半窗（窗顶 4.49、下面砌槛墙）—— 那是山墙/次间的做法，不是四面厅的形制。 */
      const win = makeChangChuang(3.45, 3.20, 5, 4);
      win.position.set(sx * px, 1.24 + 0.06 + 1.60, zFront + 0.34);
      g.add(win);
    });
  });
  // 室内屏风（正对大门，裱水墨山水）
  const screen = mesh(box(2.9, 2.6, 0.14), MAT.woodRed, { name:'screen' });
  screen.position.set(0, 1.24 + 1.52, zBack + 1.7);
  g.add(screen);
  const inkMat = new THREE.MeshStandardMaterial({ map: makeInkWashTex(), roughness:0.88, metalness:0.0 });
  const screenPanel = mesh(new THREE.PlaneGeometry(2.5, 1.9), inkMat, { name:'screenPanel' });
  screenPanel.position.set(0, 1.24 + 1.78, zBack + 1.78);   // 抬高，避开案几遮挡
  g.add(screenPanel);
  // 室内陈设：主位（条案 + 左右各一太师椅，面向大门）+ 陪位（两侧各二，相向而坐）
  const furnY = 1.24;
  const altar = mesh(box(2.4, 0.12, 0.52), MAT.woodRed, { name:'altarTable' });   // 条案
  altar.position.set(0, furnY + 0.94, zBack + 2.35);
  g.add(altar);
  [-1.0, 1.0].forEach(sx=>{
    const leg = mesh(box(0.1, 0.92, 0.1), MAT.woodDark, { name:'tableLeg' });
    leg.position.set(sx, furnY + 0.46, zBack + 2.35);
    g.add(leg);
  });
  const makeChair = (x, z, ry)=>{
