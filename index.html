function makeLotusPod(x, z, h = 0.85){

  stem.position.y = h / 2; g.add(stem);
  const pod = mesh(new THREE.CylinderGeometry(0.13, 0.055, 0.17, 10), MAT.lotusPod, { name:'podBody' });
  pod.position.y = h + 0.085; g.add(pod);
  const top = mesh(new THREE.CylinderGeometry(0.13, 0.115, 0.03, 10), MAT.lotusPod, { name:'podTop' });
  top.position.y = h + 0.185; g.add(top);
  // 莲子（顶面一圈 + 中心一颗）
  const seedMat = new THREE.MeshStandardMaterial({ color:0x51702C, roughness:0.7, metalness:0.0 });
  const seeds = new THREE.InstancedMesh(new THREE.SphereGeometry(0.024, 6, 5), seedMat, 9);
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(1,1,1);

/* 假山连片：一串峰石沿池岸接到桥头 */
function makeRockChain(points){
  const g = new THREE.Group();
  points.forEach((pt, i)=>{
    const pk = mesh(makeTaihuPeak(pt.h, pt.r, i + 1), i % 3 === 0 ? MAT.taihuDark : MAT.taihu, { name:'taihuPeak' });
    pk.position.set(pt.x, 0.05, pt.z);

      const br = rr(0.32, 0.62);

      const bp = bg.attributes.position;
      for (let j = 0; j < bp.count; j++){
        const nn = rr(0.78, 1.28);
        bp.setXYZ(j, bp.getX(j) * nn, bp.getY(j) * nn * 0.7, bp.getZ(j) * nn);

      bg.computeVertexNormals();
      const bm = mesh(bg, MAT.taihu, { name:'taihuBoulder' });

function makeRockery(x, z){

  }
  return g;

/* ══════════════════════════════════════════════════════════════
   7 · 地面 · 围墙 · 远山
   ══════════════════════════════════════════════════════════════ */
function makeGround(){
  const g = new THREE.Group();
  const W = CFG.garden.w, D = CFG.garden.d;
  const geo = new THREE.PlaneGeometry(W + 26, D + 26, 48, 40);
  geo.rotateX(-Math.PI/2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){      // 自然微起伏 + 池内下挖（保证不冒出水面）
    const x = p.getX(i), z = p.getZ(i);
    const h = Math.sin(x*0.19)*0.28 + Math.cos(z*0.16)*0.24 + Math.sin((x+z)*0.09)*0.16;
    const dx = x, dz = z - 3.0;
    let ang = Math.atan2(dz, dx);
    if (ang < 0) ang += TAU;
    const ri = Math.min(POND_RADII.length - 1, Math.floor(ang / TAU * POND_RADII.length));
    const d = Math.hypot(dx, dz) / Math.max(0.5, POND_RADII[ri]);
    const dip = d < 1.35 ? (1 - d / 1.35) * 2.2 : 0;
    p.setY(i, h - 0.34 - dip);
  }
  geo.computeVertexNormals();
  const gt = groundTex.clone();
  gt.needsUpdate = true; gt.repeat.set(26, 20);
  const mat = MAT.grass.clone(); mat.map = gt;
  const m = mesh(geo, mat, { cast:false, name:'ground' });
  g.add(m);
  return g;
}

/* 围墙四面（含漏窗 / 月洞门） */
function makeWalls(){
  const g = new THREE.Group();
  const W = CFG.garden.w, D = CFG.garden.d;
  const H = CFG.wall.h, T = CFG.wall.t;

  // —— 北墙（无门洞，带漏窗）
  const northHoles = [];
  for (let i = -2; i <= 2; i++){
    if (i === 0) continue;
    northHoles.push({ x: i * 9.2, y: 2.7, r: 0.92, n: 8, rot: Math.PI/8 });
  }
  const north = makeWallRun({ len: W, h: H, t: T, holes: northHoles });
  north.position.set(0, 0, -D/2);
  g.add(north);
  g.add(withPos(makeWallCap(W, T, H), 0, 0, -D/2));

  // —— 南墙（中央月洞门 + 漏窗）
  const southHoles = [
    { type:'circle', x: 0, r: 1.62 },
    { type:'poly',   x: -12.5, y: 2.7, r: 0.92, n: 8, rot: Math.PI/8 },
    { type:'poly',   x:  12.5, y: 2.7, r: 0.92, n: 8, rot: Math.PI/8 },
    { type:'poly',   x: -21.0, y: 2.7, r: 0.8,  n: 6, rot: 0 },
    { type:'poly',   x:  21.0, y: 2.7, r: 0.8,  n: 6, rot: 0 },
  ];
  const south = makeWallRun({ len: W, h: H, t: T, holes: southHoles });
  south.position.set(0, 0, D/2);
  g.add(south);
  g.add(withPos(makeWallCap(W, T, H), 0, 0, D/2));
  // 月洞门下沉门槛石阶
  const sill = mesh(box(4.0, 0.22, 1.4), MAT.stoneDark, { name:'threshold' });
  sill.position.set(0, 0.11, D/2 + 0.1);
  g.add(sill);

  // —— 东墙
  const eastHoles = [
    { type:'poly', x: -14, y: 2.7, r: 0.9, n: 6, rot: 0 },
    { type:'poly', x:  2,  y: 2.7, r: 0.9, n: 8, rot: Math.PI/8 },
  ];
  const east = makeWallRun({ len: D, h: H, t: T, holes: eastHoles });
  east.rotation.y = Math.PI/2;
  east.position.set(W/2, 0, 0);
  g.add(east);
  const eastCap = makeWallCap(D, T, H);
  eastCap.rotation.y = Math.PI/2;
  eastCap.position.set(W/2, 0, 0);
  g.add(eastCap);

  // —— 西墙
  const westHoles = [
    { type:'poly', x: -10, y: 2.7, r: 0.9, n: 8, rot: Math.PI/8 },
    { type:'poly', x:  8,  y: 2.7, r: 0.9, n: 6, rot: 0 },
  ];
  const west = makeWallRun({ len: D, h: H, t: T, holes: westHoles });
  west.rotation.y = Math.PI/2;
  west.position.set(-W/2, 0, 0);
  g.add(west);
  const westCap = makeWallCap(D, T, H);
  westCap.rotation.y = Math.PI/2;
  westCap.position.set(-W/2, 0, 0);
  g.add(westCap);

  return g;
}
function withPos(obj, x, y, z){ obj.position.set(x, y, z); return obj; }

/* 远山剪影 + 柱状树林（围墙外的留白层） */
function makeDistantHills(){
  const g = new THREE.Group();
  // 远山：起伏山脊剪影（多峰、两端收拢）
  const makeRidge = (radius, height, mat, count) => {
    const grp = new THREE.Group();
    for (let i = 0; i < count; i++){
      const a = (i/count)*TAU + rr(-0.16,0.16);
      const r = radius * rr(0.9, 1.1);
      const h = height * rr(0.5, 1.28);
      const w = rr(26, 54);
      const sh = new THREE.Shape();
      sh.moveTo(-w/2, 0);
      const n = 8 + ((rnd()*4)|0);
      for (let k = 0; k <= n; k++){
        const t = k / n;
        const px = -w/2 + w * t;
        const bell = Math.pow(Math.sin(Math.PI * t), 0.72);   // 两端收拢
        sh.lineTo(px, h * bell * rr(0.35, 1.05));
      }
      sh.lineTo(w/2, 0);
      sh.closePath();
      const m = mesh(new THREE.ShapeGeometry(sh), mat, { cast:false, receive:false });
      m.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
      m.lookAt(0, 0, 0);
      grp.add(m);
    }
    return grp;
  };
  g.add(makeRidge(78, 11, MAT.distantNear, 14));
  g.add(makeRidge(104, 17, MAT.distantDeep, 12));
  g.add(makeRidge(138, 24, MAT.distant, 10));
  // 柱状树林（近一点的剪影）
  const trees = [];
  const n = 46;
  for (let i = 0; i < n; i++){
    const a = (i/n)*TAU + rr(-0.06,0.06);
    const r = 62 * rr(0.94, 1.08);
    trees.push({
      x: Math.cos(a)*r, z: Math.sin(a)*r,
      h: rr(5, 12), ry: a,
    });
  }
  const treeGeo = new THREE.PlaneGeometry(1, 1);
  treeGeo.translate(0, 0.5, 0);
  const inst = new THREE.InstancedMesh(treeGeo, MAT.distantDeep, n);
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  trees.forEach((t, i)=>{
    p.set(t.x, 0, t.z);
    q.setFromEuler(new THREE.Euler(0, -t.ry + Math.PI/2, 0));
    s.set(rr(1.6, 3.4), t.h, 1);
    m.compose(p, q, s); inst.setMatrixAt(i, m);
  });
  inst.instanceMatrix.needsUpdate = true;
  g.add(inst);
  return g;
}

/* ── 蜻蜓 ──
   程序化精密建模（10 节腹部 + 复眼 + 四片带翅脉的翅）。
   这里不走 AI 生成模型：导入的蜻蜓翅膀是死的，而振翅是它可信的前提 */
function makeDragonflyWingGeo(){
  const L = 0.185, W = 0.050;
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(L*0.26,  W*1.00, L*0.74,  W*0.90, L,       W*0.16);
  s.bezierCurveTo(L*1.02,  W*0.00, L*0.80, -W*0.58, L*0.50, -W*0.74);
  s.bezierCurveTo(L*0.22, -W*0.86, L*0.06, -W*0.40, 0,       0);
  return new THREE.ShapeGeometry(s, 14);
}
function makeDragonfly(){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color:0x2E4A44, roughness:0.48, metalness:0.18, envMapIntensity:0.9, flatShading:true });
  const eyeMat  = new THREE.MeshStandardMaterial({ color:0x141F1D, roughness:0.22, metalness:0.45, envMapIntensity:1.3 });
  const wingMat = new THREE.MeshStandardMaterial({ color:0xD2E6EA, roughness:0.3, metalness:0.0,
                                                   transparent:true, opacity:0.40, side:THREE.DoubleSide,
                                                   depthWrite:false, envMapIntensity:0.9 });
  // 腹部：10 节，自粗到细
  for (let i = 0; i < 10; i++){
    const r = 0.0115 * (1 - i * 0.072);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.9, r, 0.0162, 7), bodyMat);
    seg.rotation.x = Math.PI / 2;
    seg.position.set(0, 0, -0.026 - i * 0.0168);
    g.add(seg);
  }
  const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.017, 9, 7), bodyMat);
  thorax.scale.set(1, 0.95, 1.55); thorax.position.z = 0.004; g.add(thorax);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.0115, 9, 7), bodyMat);
  head.scale.set(1.3, 1, 0.85); head.position.z = 0.028; g.add(head);
  [-1, 1].forEach(sx=>{                      // 一对大复眼
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0084, 9, 7), eyeMat);
    eye.position.set(sx * 0.0090, 0.0038, 0.0315);
    g.add(eye);
  });
  // 四翅（前后翅反相振翅）
  const wGeo = makeDragonflyWingGeo();
  const wings = [];
  [[-1,  0.020, 0], [1,  0.020, 0], [-1, -0.013, 1.7], [1, -0.013, 1.7]].forEach(([sx, zz, ph])=>{
    const pivot = new THREE.Group();
    pivot.position.set(sx * 0.0075, 0.0125, zz);
    const w = new THREE.Mesh(wGeo, wingMat);
    w.rotation.y = sx > 0 ? 0 : Math.PI;
    pivot.add(w);
    pivot.userData = { sx, ph };
    g.add(pivot); wings.push(pivot);
  });
  g.userData.wings = wings;
  // 会动的东西绝不能参与静态几何合并
  g.traverse(o=>{ if (o.isMesh) o.userData.noMerge = true; });
  return g;
}

// 性能：小尺寸构件在阴影里的贡献几乎不可见，关闭其投影以压低 shadow pass 的 draw call
world.traverse(o=>{
  if (!o.isMesh || o.isInstancedMesh) return;
  const b = new THREE.Box3().setFromObject(o);
  const sz = b.getSize(new THREE.Vector3());
  if (Math.max(sz.x, sz.y, sz.z) < 1.1) o.castShadow = false;
});

/* ── 几何合并：同材质 + 同阴影标记的静态网格合并成单个 BufferGeometry ──
   把 draw call 从数百降到几十；动态物体（鱼、龟）和 InstancedMesh 不参与 */
function mergeStatics(root){
  root.updateMatrixWorld(true);
  const buckets = new Map();
  root.traverse(o=>{
    if (!o.isMesh || o.isInstancedMesh) return;
    if (o.userData.noMerge || Array.isArray(o.material)) return;
    const key = o.material.uuid + '|' + (o.castShadow ? 1 : 0) + (o.receiveShadow ? 1 : 0);
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, list: [] });
    buckets.get(key).list.push(o);
  });

  let groups = 0, removed = 0;
  for (const b of buckets.values()){
    if (b.list.length < 2) continue;                 // 单个网格不值得合并
    const geos = [];
    for (const o of b.list){
      const g = o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      if (!g.index){                                  // 统一为带索引
        const n = g.attributes.position.count;
        const idx = new Uint32Array(n);
        for (let i = 0; i < n; i++) idx[i] = i;
        g.setIndex(new THREE.BufferAttribute(idx, 1));
      }
      if (!g.attributes.normal) g.computeVertexNormals();
      if (!g.attributes.uv){                          // 统一补 uv，否则合并会失败
        const n = g.attributes.position.count;
        g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
      }
      const keep = new THREE.BufferGeometry();        // 只保留三种属性
      keep.setAttribute('position', g.attributes.position);
      keep.setAttribute('normal', g.attributes.normal);
      keep.setAttribute('uv', g.attributes.uv);
      keep.setIndex(g.index);
      geos.push(keep);
    }
    let merged = null;
    try { merged = mergeGeometries(geos, false); } catch(e){ merged = null; }
    if (!merged) continue;
    const mm = new THREE.Mesh(merged, b.mat);
    mm.castShadow = b.cast; mm.receiveShadow = b.recv;
    mm.name = 'mergedStatic';
    root.add(mm);
    for (const o of b.list){ if (o.parent) o.parent.remove(o); removed++; }
    groups++;
  }
  console.log('[几何合并]', groups, '组材质 →', removed, '个网格');
}

// 后处理链的渲染缓冲必须显式开启 MSAA —— renderer 的 antialias 只对直连画布生效，
// 走 EffectComposer 时会被完全绕过（实测 samples 为 0，全场景边缘锯齿）
const composerTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerTarget);
composer.setPixelRatio(Math.min(devicePixelRatio, 1.25));   // 后处理单独限 DPR：2x 时填充率是 1.25x 的 2.6 倍
composer.setSize(innerWidth, innerHeight);

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.14, 0.32, 1.15);
composer.addPass(bloom);

const VignetteShader = {
  uniforms:{ tDiffuse:{ value:null }, uStrength:{ value:0.62 }, uSize:{ value:0.86 } },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uStrength,uSize; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float d = distance(vUv, vec2(0.5));
      c.rgb *= mix(1.0, smoothstep(uSize, uSize-0.52, d), uStrength);
      gl_FragColor = c;
    }`,
};
composer.addPass(new ShaderPass(VignetteShader));
composer.addPass(new OutputPass());

const clock = new THREE.Clock();
const statsEl = document.getElementById('stats');
let acc = 0, frames = 0, fps = 0;

function onResize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
addEventListener('resize', onResize);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 风：推进时间并调度阵风（所有风材质共享 WIND 这组 uniform）
  WIND.uTime.value = t;
  updateWind(t);
  // 水面涟漪（法线缓慢漂移）
  waterNormalTex.offset.x += dt * 0.014;
  waterNormalTex.offset.y += dt * 0.009;
  if (waterSurface) waterSurface.material.uniforms.uTime.value = t;

  // 锦鲤沿椭圆轨道游动（轨道经核算落在池内）
  const fishes = koiGroup.userData.fishes;
  for (const f of fishes){
    const d = f.userData;
    d.t += dt * d.speed;
    const o = KOI_ORBITS[d.orbit];
    const j = d.jitter + Math.sin(t * 0.35 + d.phase) * 0.06;
    f.position.x = koiGroup.position.x + o.cx + Math.cos(d.t) * o.a * j;
    f.position.z = koiGroup.position.z + o.cz + Math.sin(d.t) * o.b * j;
    f.rotation.y = Math.atan2(-(o.b * Math.cos(d.t)), -(o.a * Math.sin(d.t)));
    f.rotation.z = Math.sin(t * 4 + d.phase) * 0.1;

    // 偶尔自深水区上浮，鱼口从下向上触水，激起一圈圈涟漪
    let lift = 0;
    if (!d.rising && t >= d.riseAt){ d.rising = true; d.riseT0 = t; d.rippled = false; }
    if (d.rising){
      const e = t - d.riseT0, rd = 2.8;
      if (e >= rd){
        d.rising = false;
        d.riseAt = t + 9 + Math.random() * 18;      // 每条鱼各自随机，不会同时跃水
      } else {
        const u = e / rd;
        lift = Math.sin(Math.PI * u) * 0.11;        // 上浮再沉回
        if (!d.rippled && u >= 0.5){
          d.rippled = true;
          const hx = Math.cos(f.rotation.y) * 0.30, hz = -Math.sin(f.rotation.y) * 0.30;
          spawnRipple(f.position.x + hx, f.position.z + hz, t);   // 涟漪落在鱼口前方
        }
      }
    }
    f.position.y = CFG.water - 0.06 + Math.sin(t * 1.6 + d.phase) * 0.02 + lift;
  }
  updateRipples(t);

  // 蜻蜓：游弋航迹 + 高频振翅
  for (const d of dragonflies){
    const fl = d.userData.flight;
    const tt = t * fl.sp + fl.ph;
    d.position.set(
      fl.cx + Math.cos(tt) * fl.ax + Math.sin(tt * 2.7) * 0.9,
      fl.y0 + Math.sin(tt * 3.3 + 1.1) * 0.24,
      fl.cz + Math.sin(tt * 1.6) * fl.az + Math.cos(tt * 3.1) * 0.7
    );
    const dx = -Math.sin(tt) * fl.ax + Math.cos(tt * 2.7) * 2.43;
    const dz =  Math.cos(tt * 1.6) * fl.az * 1.6 - Math.sin(tt * 3.1) * 2.17;
    if (Math.abs(dx) + Math.abs(dz) > 0.01) d.rotation.y = Math.atan2(dx, dz);
    for (const w of d.userData.wings){
      w.rotation.z = w.userData.sx * Math.sin(t * 44 + w.userData.ph) * 0.55;
    }
  }

  // 乌龟缓游（同轨道，速度更慢）
  for (const tw of swimTurtles){
    const d = tw.userData;
    d.t += dt * d.speed;
    const o = KOI_ORBITS[d.orbit];
    const j = d.jitter + Math.sin(t * 0.25 + d.phase) * 0.05;
    tw.position.x = koiGroup.position.x + o.cx + Math.cos(d.t) * o.a * j;
    tw.position.z = koiGroup.position.z + o.cz + Math.sin(d.t) * o.b * j;
    tw.position.y = CFG.water - 0.05 + Math.sin(t * 0.9 + d.phase) * 0.02;
    tw.rotation.y = Math.atan2(-(o.b * Math.cos(d.t)), -(o.a * Math.sin(d.t)));
  }

  controls.update();
  renderer.info.reset();
  composer.render();

  // 统计（每 0.5 秒刷新一次，避免频繁写 DOM）
  acc += dt; frames++;
  if (acc >= 0.5){
    fps = Math.round(frames / acc);
    const info = renderer.info;
    statsEl.textContent =
      `${fps} fps\n` +
      `draw calls  ${info.render.calls}\n` +
      `triangles   ${info.render.triangles.toLocaleString()}\n` +
      `geometries  ${info.memory.geometries}\n` +
      `textures    ${info.memory.textures}`;
    acc = 0; frames = 0;
  }
}
animate();

// 首帧渲染完成后隐藏加载层
requestAnimationFrame(()=>{
  requestAnimationFrame(()=>{
    document.getElementById('loading').classList.add('done');
    console.log('[远香堂] 场景就绪', {
      meshes: registry.meshes,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
    });
  });
});

// 供外部检查使用
window.__garden = { scene, camera, renderer, composer, controls, THREE };
</script>
